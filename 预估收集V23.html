<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预估收集工具 · 月度滚动预估</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#152235; --ink2:#354764; --mute:#6E7E96;
  --paper:#F2F4F8; --card:#FFFFFF; --line:#E1E5ED; --line2:#C8CFDB;
  --blue:#2054E0; --blue-soft:#EDF3FF; --blue-line:#B2CBF8;
  --blue-hover:#1744BA;
  --green:#0D7F56; --green-soft:#E8F5EF;
  --red:#B8322B; --red-soft:#FAECEA;
  --amber:#9E6200; --amber-soft:#FBF2E0;
  --navy-bar:#172B45;
  --shadow-sm:0 1px 2px rgba(21,34,53,.05),0 2px 8px rgba(21,34,53,.06);
  --shadow-md:0 2px 6px rgba(21,34,53,.06),0 8px 24px rgba(21,34,53,.08);
  --shadow-lg:0 8px 30px rgba(10,18,32,.12),0 2px 8px rgba(10,18,32,.06);
  --r:12px;
  --r-sm:8px;
  --num:"Bahnschrift","Segoe UI",system-ui,sans-serif;
  --transition:180ms cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
::selection{background:rgba(32,84,224,.18);color:var(--ink)}
button{font-family:inherit;cursor:pointer;transition:var(--transition)}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--ink);transition:var(--transition)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C8CFDB;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#A0AAB8}

/* ---------- app bar ---------- */
.appbar{
  background:linear-gradient(135deg,var(--ink),#1A2E4A);
  color:#fff;display:flex;align-items:center;gap:18px;padding:0 24px;height:54px;
  position:sticky;top:0;z-index:50;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 2px 12px rgba(0,0,0,.15);
}
.logo{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.logo b{font-size:16px;font-weight:700;letter-spacing:.02em}
.logo span{font-size:11px;color:#8DA3C4;font-weight:500}
.tabs{display:flex;gap:2px;height:100%}
.tab{
  background:none;border:none;color:#A8BCD6;font-size:13.5px;
  padding:0 18px;height:100%;border-bottom:3px solid transparent;
  transition:color var(--transition),border-color var(--transition);
  font-weight:500;
}
.tab:hover{color:#E8F0FF}
.tab.on{color:#fff;border-bottom-color:#5B8DEF;font-weight:600}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.sync-badge{
  font-size:11px;padding:3px 10px;border-radius:99px;
  background:rgba(255,255,255,.1);color:#C4D5ED;white-space:nowrap;
  border:1px solid rgba(255,255,255,.08);
}
.sync-badge.live{background:rgba(46,160,109,.2);color:#8FE8BF;border-color:rgba(46,160,109,.3)}
.icon-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  color:#D8E5F8;border-radius:var(--r-sm);padding:5px 12px;font-size:12px;
  transition:background var(--transition);
}
.icon-btn:hover{background:rgba(255,255,255,.16)}
.icon-btn:active{background:rgba(255,255,255,.22);transform:scale(.97)}

/* ---------- 口径条 ---------- */
.ctxbar{
  background:var(--navy-bar);color:#CDD8EB;display:flex;align-items:center;
  gap:22px;padding:8px 24px;font-size:12px;position:sticky;top:54px;z-index:49;
  flex-wrap:wrap;min-height:44px;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset;
}
.ctx-cycle{font-weight:700;color:#fff;font-size:13px;white-space:nowrap}
.mchips{display:flex;gap:5px;align-items:center}
.mchip{
  width:30px;text-align:center;padding:2px 0;border-radius:6px;
  font-size:11px;font-family:var(--num);border:1px solid rgba(255,255,255,.22);
  color:#A0B9DD;transition:var(--transition);
}
.mchip.act{background:#E6EDFA;color:var(--ink);border-color:#E6EDFA;font-weight:700}
.mchip.fc{border-style:dashed;color:#7CB8FF;border-color:#4B7ED9}
.ctx-legend{color:#879CBD;white-space:nowrap}
.ctx-kpis{margin-left:auto;display:flex;gap:24px;align-items:center}
.ctx-kpi{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.ctx-kpi small{color:#879CBD;font-size:10px;font-weight:500}
.ctx-kpi b{font-family:var(--num);font-size:15px;color:#fff}
.gauge{
  width:120px;height:6px;border-radius:99px;
  background:rgba(255,255,255,.12);overflow:hidden;position:relative;
}
.gauge i{
  display:block;height:100%;
  background:linear-gradient(90deg,#4B7ED9,#2A9E6A);border-radius:99px;
  transition:width .5s cubic-bezier(.4,0,.2,1);
}

/* ---------- layout ---------- */
main{max-width:1480px;margin:0 auto;padding:20px 24px 64px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-sm);margin-bottom:18px;
  transition:box-shadow var(--transition);
}
.card:hover{box-shadow:var(--shadow-md)}
.card-h{
  display:flex;align-items:center;gap:12px;padding:14px 18px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.card-h h3{font-size:14px;font-weight:700;color:var(--ink)}
.card-h .hint{font-size:12px;color:var(--mute);font-weight:400}
.card-b{padding:16px 18px}
.empty{padding:56px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;font-size:16px;color:var(--ink2);margin-bottom:8px;font-weight:600}

/* ---------- controls ---------- */
.btn{
  border:1px solid var(--line2);background:#fff;border-radius:var(--r-sm);
  padding:7px 16px;font-size:13px;color:var(--ink2);
  transition:all var(--transition);font-weight:500;
}
.btn:hover{border-color:var(--blue);color:var(--blue);background:#FAFCFF}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--blue-hover);border-color:var(--blue-hover);box-shadow:0 2px 8px rgba(32,84,224,.25)}
.btn.pri:active{background:#133AA0;transform:scale(.97)}
.btn.danger{color:var(--red);border-color:#E2BEBA}
.btn.danger:hover{background:var(--red-soft);border-color:var(--red)}
.btn.sm{padding:5px 12px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
select.ctrl,input.ctrl{
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:7px 10px;
  font-size:13px;background:#fff;outline:none;
}
select.ctrl:focus,input.ctrl:focus{
  border-color:var(--blue);box-shadow:0 0 0 3px rgba(32,84,224,.12);
}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r-sm);overflow:hidden}
.seg button{
  border:none;background:#fff;padding:6px 14px;font-size:12.5px;color:var(--ink2);
  border-right:1px solid var(--line);transition:all var(--transition);font-weight:500;
}
.seg button:last-child{border-right:none}
.seg button:hover{background:#F6F8FC}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11.5px;color:var(--mute);font-weight:600;letter-spacing:.01em}

/* ---------- tables ---------- */
.twrap{overflow:auto;max-height:72vh;border-radius:0 0 var(--r) var(--r)}
.twrap::-webkit-scrollbar-track{background:var(--card)}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;white-space:nowrap}
/* 表头行整体垂直固定，确保所有表头单元格在上下滚动时一起固定 */
.dt thead tr{position:sticky;top:0;z-index:5}
.dt th{
  position:sticky;top:0;background:#EBEEF5;color:var(--ink2);
  font-weight:700;font-size:11px;padding:8px 10px;
  border-bottom:2px solid var(--line2);text-align:right;z-index:3;
  letter-spacing:.02em;
}
.dt th.l,.dt td.l{text-align:left}
.dt td{
  padding:6px 10px;border-bottom:1px solid var(--line);
  text-align:right;background:#fff;transition:background .12s;
}
.dt tr:nth-child(even) td{background:#FAFBFD}
.dt tr:hover td{background:#F0F4FC}
.dt .stick1{
  position:sticky;left:0;z-index:2;
  border-right:2px solid var(--line);
}
/* 表头第一列交叉点提高层级，确保在表头行固定时仍显示在最上层 */
.dt th.stick1{z-index:6}
.dt .grp-row td{
  background:#F2F4F8;font-weight:700;color:var(--ink);
  border-top:1px solid var(--line2);font-size:13px;
}
.dt .total-row td{
  background:#E8ECF3;font-weight:700;border-top:2px solid var(--line2);
  position:sticky;bottom:0;z-index:2;
}
.dt td.act-cell{color:var(--ink2);background:#F7F8F4}
.dt td.dim{color:var(--mute)}
/* 提报进度: 各经理(DSM)表格统一列宽 —— 固定布局 + 统一 colgroup, 与内容无关 */
table.dt.prog-tbl{table-layout:fixed;min-width:560px}
.dt.prog-tbl col.c-rep{width:200px}
.dt.prog-tbl col.c-st{width:104px}
.dt.prog-tbl col.c-pct{width:92px}
.dt.prog-tbl col.c-fill{width:112px}
.dt.prog-tbl col.c-upd{width:auto}
.dt.prog-tbl th,.dt.prog-tbl td{overflow:hidden;text-overflow:ellipsis}
td.pos,.pos{color:var(--green);font-weight:600}
td.neg,.neg{color:var(--red);font-weight:600}
td.warn,.warn{color:var(--amber);font-weight:600}
.fc-in{
  width:72px;border:1px solid var(--blue-line);background:var(--blue-soft);
  color:var(--blue);font-weight:600;font-family:var(--num);
  border-radius:6px;padding:5px 7px;text-align:right;outline:none;
  transition:all var(--transition);
}
.fc-in::placeholder{color:#A0B8E0;font-weight:400}
.fc-in:hover{border-color:var(--blue)}
.fc-in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(32,84,224,.15);background:#fff}
.fc-in.filled{background:#fff;border-color:var(--blue-line)}
.fc-in.ovr{background:#FFF6E6;border-color:#E2B25C;color:var(--amber)}
.fc-in.ovr:hover{border-color:var(--amber)}
.fc-in.ovr:focus{background:#fff;border-color:var(--amber);box-shadow:0 0 0 3px rgba(158,98,0,.14)}
.subv.ovr-sub{color:var(--amber);font-weight:600}
.tag.ovr{background:var(--amber-soft);color:var(--amber)}
.rm-in{
  width:240px;border:1px solid var(--line2);border-radius:6px;
  padding:5px 8px;font-size:12px;outline:none;
  transition:all var(--transition);
}
.rm-in:hover{border-color:var(--blue)}
.rm-in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(32,84,224,.12)}
.subv{display:block;font-size:10px;color:var(--mute);font-family:var(--num);line-height:1.1;margin-top:1px}
.tag{
  display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:4px;
  background:#EDF1F7;color:var(--ink2);margin-left:6px;vertical-align:1px;
  font-weight:600;letter-spacing:.01em;
}
.tag.q{background:var(--amber-soft);color:var(--amber)}
.tag.new{background:var(--green-soft);color:var(--green)}
.delta-up::before{content:"▲";font-size:9px;margin-right:2px}
.delta-dn::before{content:"▼";font-size:9px;margin-right:2px}

/* ---------- multi-select dropdown ---------- */
.ms-wrap{position:relative;display:inline-block;vertical-align:middle}
.ms-trigger{
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:6px 10px;
  background:#fff;cursor:pointer;font-size:13px;min-width:110px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  color:var(--ink2);user-select:none;transition:all var(--transition);
}
.ms-trigger:hover{border-color:var(--blue)}
.ms-trigger::after{content:"▼";font-size:9px;color:var(--mute);transition:transform var(--transition)}
.ms-wrap.open .ms-trigger::after{transform:rotate(180deg)}
.ms-panel{
  position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:#fff;
  border:1px solid var(--line2);border-radius:var(--r-sm);
  box-shadow:var(--shadow-lg);max-height:300px;overflow-y:auto;
  min-width:190px;display:none;padding:6px 0;
  animation:msIn .15s cubic-bezier(.4,0,.2,1);
}
@keyframes msIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.ms-wrap.open .ms-panel{display:block}
.ms-panel label{
  display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:12.5px;
  cursor:pointer;white-space:nowrap;color:var(--ink2);transition:background .1s;
}
.ms-panel label:hover{background:var(--blue-soft)}
.ms-panel input[type=checkbox]{margin:0;width:14px;height:14px;accent-color:var(--blue)}
.ms-panel .ms-all{border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:5px;font-weight:700}
.ms-panel .ms-done{
  border-top:1px solid var(--line);padding-top:6px;margin-top:5px;
  background:var(--blue-soft);color:var(--blue);font-weight:600;justify-content:center;
}
.ms-panel .ms-done:hover{background:var(--blue-line);color:#fff}
/* 选中项高亮(现代浏览器 :has) */
.ms-panel label:has(input:checked){background:var(--blue-soft);color:var(--blue);font-weight:600}

/* ---------- 看板: 下钻筛选条 ---------- */
.drillbar{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:9px 16px 11px;border-top:1px solid var(--line);
  background:linear-gradient(180deg,#FBFCFE,#F5F8FC);
}
.drillbar-lab{
  font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--mute);
  text-transform:uppercase;margin-right:2px;white-space:nowrap;
}
.drillbar-sp{flex:1 1 12px}
.drillbar-count{font-size:11.5px;color:var(--blue);font-weight:600;white-space:nowrap}
.drillbar .ms-trigger{min-width:124px}
.ms-trigger-txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-cur{
  font-size:9.5px;font-weight:700;color:#fff;background:var(--blue);
  border-radius:4px;padding:1px 5px;letter-spacing:.02em;flex:none;
}
/* 当前维度 = 主下钻 */
.ms-wrap.primary .ms-trigger{border-color:var(--blue-line);background:var(--blue-soft)}
.ms-wrap.primary .ms-trigger:hover{border-color:var(--blue)}
/* 已选中态 */
.ms-wrap.active .ms-trigger{border-color:var(--blue);color:var(--blue);font-weight:600;box-shadow:0 0 0 2px rgba(32,84,224,.10)}
.ms-wrap.primary.active .ms-trigger{background:var(--blue-soft)}


/* ---------- resizable / reorderable / sortable table ---------- */
.dt th,.dt td{border-right:1px solid var(--line)}
.dt th:last-child,.dt td:last-child{border-right:none}
.resize-handle{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;z-index:7;touch-action:none}
.resize-handle::after{content:"";position:absolute;right:2px;top:0;bottom:0;width:2px;border-radius:2px}
.resize-handle:hover::after,.resize-handle.dragging::after{background:var(--blue)}
.dt th{position:relative}
table.rz-fixed{table-layout:fixed}
.rz-fixed th,.rz-fixed td{overflow:hidden;text-overflow:ellipsis}
.rz-fixed .fc-in,.rz-fixed .rm-in{width:100%;min-width:0}
body.col-resizing{cursor:col-resize !important}
body.col-resizing *{user-select:none !important}
body.col-resizing .dt td,body.col-resizing .dt th,body.col-resizing .dt tr:hover td{transition:none !important}
/* 看板列排序 + 拖拽换列 */
.dt th.sortable{cursor:pointer;user-select:none}
.dt th.sortable:hover{background:#DFE6F3}
.sort-ico{display:inline-block;margin-left:4px;font-size:9px;color:#AAB6C9;vertical-align:1px}
.dt th.sorted{color:var(--blue)}
.dt th.sorted .sort-ico{color:var(--blue)}
.dt th.dragging-col{opacity:.4}
.dt th.drop-before{box-shadow:inset 3px 0 0 var(--blue)}
.dt th.drop-after{box-shadow:inset -3px 0 0 var(--blue)}

/* ---------- watermark ---------- */
.watermark{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.watermark span{
  position:absolute;display:block;font-size:13px;
  color:rgba(160,175,200,.14);font-weight:600;
  transform:rotate(-30deg);white-space:nowrap;user-select:none;
  letter-spacing:.04em;
}

/* ---------- fill mode switch ---------- */
.fill-mode-seg {
  display: inline-flex;
  border: 1px solid var(--line2);
  border-radius: var(--r-sm);
  overflow: hidden;
  margin-right: 12px;
}
.fill-mode-seg button {
  border: none;
  background: #fff;
  padding: 6px 14px;
  font-size: 12.5px;
  color: var(--ink2);
  border-right: 1px solid var(--line);
  transition: all var(--transition);
  font-weight: 500;
}
.fill-mode-seg button:last-child { border-right: none; }
.fill-mode-seg button:hover { background: #F6F8FC; }
.fill-mode-seg button.on { background: var(--ink); color: #fff; font-weight: 600; }

/* ---------- BI banner ---------- */
.bi-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: linear-gradient(135deg, var(--blue-soft), #F0F4FF);
  border: 1px solid var(--blue-line);
  border-radius: var(--r-sm);
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.bi-banner .bi-text {
  font-size: 12.5px;
  color: var(--ink2);
}
.bi-banner .bi-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--blue);
  border: 1px solid var(--blue);
  color: #fff;
  font-weight: 600;
  padding: 6px 16px;
  border-radius: 6px;
  font-size: 12.5px;
  text-decoration: none;
  transition: var(--transition);
  cursor: pointer;
}
.bi-banner .bi-btn:hover {
  background: var(--blue-hover);
  border-color: var(--blue-hover);
}

/* ---------- stats grid ---------- */
.statgrid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;padding:16px 18px;
}
.stat{
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  background:linear-gradient(180deg,#fff,#F8FAFD);
  transition:all var(--transition);
}
.stat:hover{border-color:var(--line2);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.stat small{display:block;font-size:11px;color:var(--mute);margin-bottom:4px;font-weight:600;letter-spacing:.01em}
.stat b{font-family:var(--num);font-size:20px;color:var(--ink)}
.stat .sub{font-size:11px;color:var(--mute);font-family:var(--num);margin-top:2px}
.savestate{font-size:12px;color:var(--mute);transition:color var(--transition)}
.savestate.ok{color:var(--green)}

/* 预估准确率统计卡高亮 */
.stat.accuracy{
  background:linear-gradient(180deg,#EDF3FF,#E8F0FE);
  border-color:var(--blue-line);
}
.stat.accuracy small{color:var(--blue)}
.stat.accuracy b{color:var(--blue)}

/* 差异列样式 */
/* ---------- 预估准确率横幅 ---------- */
.acc-card{border-left:3px solid var(--blue)}
.acc-strip{display:flex;align-items:center;gap:26px;padding:12px 18px;flex-wrap:wrap}
.acc-title{font-size:13px;font-weight:700;color:var(--ink);display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:220px}
.acc-title small{font-size:11px;color:var(--mute);font-weight:500;white-space:normal}
.acc-kpi{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.acc-kpi small{font-size:10.5px;color:var(--mute);font-weight:600;margin-bottom:2px}
.acc-kpi b{font-family:var(--num);font-size:16px;color:var(--ink)}
.acc-kpi.main b{font-size:21px}
.dt td.diff-cell{font-weight:600}
.dt td.diff-cell.pos{color:var(--green)}
.dt td.diff-cell.neg{color:var(--red)}
.dt td.diff-cell.warn{color:var(--amber)}

/* 差异列高亮 */
.dt th.diff-h, .dt td.diff-cell { background: #FAFBFE; }
.dt tr:hover td.diff-cell { background: #F0F4FC; }

/* dashboard chart */
.chartbox{padding:12px 18px 6px}
.chartbox svg{border-radius:6px}
.legend{display:flex;gap:18px;font-size:11px;color:var(--mute);padding:0 18px 12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* remarks drawer rows */
.rm-li{
  padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;
  transition:background .12s;
}
.rm-li:hover{background:#FAFBFE}
.rm-li b{color:var(--ink2)}
.rm-li .who{color:var(--mute);font-size:11.5px;margin-right:8px}

/* admin */
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:980px){.admin-grid{grid-template-columns:1fr}}
.chip-toggle{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);
  border-radius:99px;padding:5px 14px;font-size:12px;margin:0 6px 6px 0;
  background:#fff;cursor:pointer;user-select:none;transition:all var(--transition);
}
.chip-toggle:hover{border-color:var(--blue);background:#FAFCFF}
.chip-toggle.q{background:var(--amber-soft);border-color:#DDB85C;color:var(--amber);font-weight:600}
.chip-toggle.q:hover{background:#F7EBD0}
.vlist .vitem{display:flex;align-items:center;gap:14px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.vlist .vitem b{min-width:160px}
.vlist .meta{color:var(--mute);font-size:12px}
.note{
  font-size:12.5px;color:var(--ink2);background:var(--amber-soft);
  border:1px solid #E5D2A0;border-radius:var(--r-sm);
  padding:12px 16px;margin-bottom:12px;
}
.note.blue{background:var(--blue-soft);border-color:var(--blue-line)}
.steps{font-size:13px;color:var(--ink2)}
.steps li{margin:8px 0 8px 20px}
.steps b{color:var(--ink)}
kbd.k{background:#EDF1F7;border:1px solid var(--line2);border-radius:4px;padding:1px 6px;font-size:11px;font-family:var(--num)}

/* modal */
.mask{
  position:fixed;inset:0;background:rgba(10,16,28,.5);
  display:none;align-items:flex-start;justify-content:center;z-index:100;
  padding:6vh 16px;backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}
.mask.show{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:16px;max-width:700px;width:100%;
  max-height:86vh;overflow:auto;
  box-shadow:0 24px 80px rgba(10,18,32,.25),0 4px 16px rgba(10,18,32,.1);
  animation:modalIn .25s cubic-bezier(.4,0,.2,1);
}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-h{
  padding:16px 24px;border-bottom:1px solid var(--line);
  font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;
}
.modal-b{padding:20px 24px}
.modal-f{
  padding:14px 24px;border-top:1px solid var(--line);
  display:flex;justify-content:flex-end;gap:10px;
}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:13px;margin:8px 0}
.kv span{color:var(--mute)}
.mcheck{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.mcheck label{
  border:1px solid var(--line2);border-radius:7px;padding:5px 9px;
  font-size:12px;cursor:pointer;font-family:var(--num);transition:all var(--transition);
}
.mcheck label:hover{border-color:var(--blue)}
.mcheck label.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 24px;border-radius:99px;
  font-size:13px;box-shadow:var(--shadow-lg);z-index:200;
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* ============================================================
   移动端: 逐行卡片式填写视图 + 响应式外壳
   ============================================================ */
/* —— 卡片式填写(仅手机渲染该结构) —— */
.m-fill{padding:8px 10px 4px;position:relative}
.m-grp{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin:10px 0 6px;padding:7px 10px;border-radius:8px;
  background:#F2F4F8;border:1px solid var(--line);
  font-weight:700;font-size:13px;color:var(--ink);
}
.m-grp-name{margin-right:2px}
.m-grp-sub{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--mute)}
.m-grp-sub b{font-weight:700;color:var(--ink2)}
.m-row{
  border:1px solid var(--line);border-radius:12px;background:#fff;
  box-shadow:var(--shadow-sm);padding:12px 13px;margin-bottom:12px;
}
.m-row-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.m-row-name{font-weight:700;font-size:14px;color:var(--ink)}
.m-kpi{
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
  padding:8px;border-radius:8px;background:linear-gradient(180deg,#FAFBFD,#F4F7FB);
  border:1px solid var(--line);margin-bottom:10px;
}
.m-kpi div{display:flex;flex-direction:column;gap:1px;min-width:0}
.m-kpi small{font-size:9.5px;color:var(--mute);font-weight:600}
.m-kpi b{font-family:var(--num);font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-act{margin-bottom:6px}
.m-act-lab{font-size:10.5px;color:var(--mute);font-weight:600;letter-spacing:.02em}
.m-act-strip{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.m-act-chip{
  font-size:11px;font-family:var(--num);color:var(--ink2);
  background:#F2F4F0;border:1px solid var(--line);border-radius:6px;padding:2px 7px;
}
.m-act-chip i{font-style:normal;color:var(--mute);margin-right:4px}
.m-months{margin-top:2px}
.m-mo{
  display:grid;grid-template-columns:1fr auto;align-items:center;
  gap:8px 10px;padding:8px 0;border-top:1px dashed var(--line);
}
.m-mo:first-child{border-top:none}
.m-mo-lab{font-size:13px;color:var(--ink2);font-weight:600;white-space:nowrap}
.m-mo-lab i.fc{
  font-style:normal;font-size:10px;font-weight:600;color:var(--blue);
  background:var(--blue-soft);border-radius:4px;padding:1px 5px;margin-left:6px;
}
.m-mo-field{display:flex;align-items:center;gap:6px;justify-self:end}
.m-fill .fc-in{width:128px;height:40px;font-size:16px;text-align:right;border-radius:8px}
.m-mo-unit{color:var(--mute);font-size:12.5px;min-width:14px}
.m-mo-amt,.m-mo-rv{grid-column:1 / -1;justify-self:end;text-align:right;margin-top:-3px}
.m-mo-rv:empty,.m-mo-amt:empty{display:none}
.m-rm{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.m-rm label{font-size:11px;color:var(--mute);font-weight:600}
.m-fill .rm-in{width:100%;font-size:16px;padding:9px 10px;border-radius:8px}
.m-total{
  position:sticky;bottom:0;z-index:4;margin-top:6px;
  background:#E8ECF3;border-top:2px solid var(--line2);
  border-radius:10px;padding:10px 12px;
  box-shadow:0 -4px 14px rgba(21,34,53,.07);
}
.m-total:empty{display:none}
.m-total-lab{font-weight:700;font-size:12px;color:var(--ink2);display:block;margin-bottom:5px}
.m-total-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.m-total-grid span{display:flex;flex-direction:column;min-width:0}
.m-total-grid small{font-size:9.5px;color:var(--mute);font-weight:600}
.m-total-grid b{font-family:var(--num);font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .card-h .hint{font-size:11.5px}
  .card-b{padding:12px}
  .statgrid{grid-template-columns:repeat(2,1fr);gap:8px;padding:12px}

}
/* 极窄屏(小手机): 月度输入与 KPI 再紧凑一点 */
@media(max-width:380px){
  .m-fill .fc-in{width:108px}
  .m-kpi b,.m-total-grid b{font-size:12.5px}

@media print{.appbar,.ctxbar,.card-h .btn,.fc-toolbar{display:none}}

<script>
/* =====================================================================
   预估收集工具 — 单文件应用
   三运行模式:
   ① 作为 Claude Artifact 发布 → window.storage 共享存储，全员实时共用
   ② GitHub Pages 云端模式   → 管理员上传数据包 JSON，其他人自动拉取
   ③ 本地 HTML 文件           → localStorage 持久化 + 数据包文件接力
   — 修改下面的 CLOUD_URL 为你的 GitHub 数据包 Raw URL 即可启用云端 —
   ===================================================================== */
"use strict";
// ★ 改为你的 GitHub 数据包 Raw URL（以 https://raw.githubusercontent.com/ 开头）
const CLOUD_URL = "https://raw.githubusercontent.com/kong19891105/Forecast/refs/heads/main/data.json";
const MN = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { if (v === null || v === undefined || v === "") return 0; const n = typeof v === "number" ? v : parseFloat(String(v).replace(/,/g, "")); return isFinite(n) ? n : 0; };
const zeros = () => Array(12).fill(0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---- 移动端检测: 窄屏(手机)启用逐行卡片式填写视图 ---- */
const MOBILE_BP = 720;
const mqMobile = window.matchMedia("(max-width:" + MOBILE_BP + "px)");
function isMobile() { return mqMobile.matches; }

/* ---- 数字显示: 金额一律千元(K) ---- */
function fmtK(v, d) { if (v === null || v === undefined || !isFinite(v)) return "–";
  const k = v / 1000; const dd = d !== undefined ? d : (Math.abs(k) >= 100 ? 0 : 1);
  return k.toLocaleString("zh-CN", { minimumFractionDigits: dd, maximumFractionDigits: dd }); }
function fmtQ(v) { if (v === null || v === undefined || !isFinite(v)) return "–";
  return v.toLocaleString("zh-CN", { maximumFractionDigits: 1 }); }
function fmtPct(v) { return (v === null || !isFinite(v)) ? "–" : (v * 100).toFixed(1) + "%"; }
function fmtPP(v)  { return (v === null || !isFinite(v)) ? "–" : (v > 0 ? "+" : "") + (v * 100).toFixed(1) + "pp"; }
function fmtDK(v)  { if (v === null || !isFinite(v)) return "–"; const s = fmtK(Math.abs(v)); return (v >= 0 ? "+" : "-") + s; }
function clsSign(v, inv) { if (v === null || !isFinite(v) || Math.abs(v) < 1e-9) return ""; return (v > 0) !== !!inv ? "pos" : "neg"; }
function clsAch(v) { if (v === null || !isFinite(v)) return ""; return v >= 1 ? "pos" : (v < 0.8 ? "neg" : "warn"); }
function achSymHtml(v) { if (v === null || !isFinite(v)) return ""; return '<span style="color:' + (v >= 1 ? "var(--green)" : (v < 0.8 ? "var(--red)" : "var(--amber)")) + ';font-size:0.9em">● </span>'; }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2400); }

/* =================== 存储适配层 =================== */
// 共享模式(Claude Artifact)用 window.storage;本地/云端模式用 localStorage 持久化,
// localStorage 不可用时(极少数浏览器隐私模式)退回内存。
const Store = {
  shared: false,
  mem: {},
  ls: null,
  async init() {
    try { if (window.storage && typeof window.storage.get === "function") { await window.storage.list("fc-", true); this.shared = true; } } catch (e) { this.shared = false; }
    if (!this.shared) { try { const t = "__fc_t__"; localStorage.setItem(t, "1"); localStorage.removeItem(t); this.ls = localStorage; } catch (e) { this.ls = null; } }
  },
  _lsGet(k) { try { const v = this.ls.getItem(k); return v == null ? null : JSON.parse(v); } catch (e) { return null; } },
  _lsSet(k, v) { try { this.ls.setItem(k, JSON.stringify(v)); return true; } catch (e) { console.error(e); toast("⚠ 本地存储写入失败(可能空间已满)"); return false; } },
  async get(k) {
    if (this.shared) { try { const r = await window.storage.get(k, true); return r && r.value != null ? JSON.parse(r.value) : null; } catch (e) { return null; } }
    if (this.ls) return this._lsGet("fcv5:" + k);
    return this.mem[k] !== undefined ? this.mem[k] : null;
  },
  async set(k, v) {
    if (this.shared) { try { const r = await window.storage.set(k, JSON.stringify(v), true); return !!r; } catch (e) { console.error(e); toast("⚠ 共享存储写入失败"); return false; } }
    if (this.ls) return this._lsSet("fcv5:" + k, v);
    this.mem[k] = JSON.parse(JSON.stringify(v)); return true;
  },
  async del(k) {
    if (this.shared) { try { await window.storage.delete(k, true); } catch (e) {} }
    else if (this.ls) { try { this.ls.removeItem("fcv5:" + k); } catch (e) {} }
    else delete this.mem[k];
  },
  async list(prefix) {
    if (this.shared) { try { const r = await window.storage.list(prefix, true); return (r && r.keys) ? r.keys.map(x => typeof x === "string" ? x : x.key) : []; } catch (e) { return []; } }
    if (this.ls) { const out = []; const p = "fcv5:" + prefix; for (let i = 0; i < this.ls.length; i++) { const k = this.ls.key(i); if (k && k.startsWith(p)) out.push(k.slice(5)); } return out; }
    return Object.keys(this.mem).filter(k => k.startsWith(prefix));
  },
  /* 个人空间(shared=false): 每个使用者各自一份,用于记住身份 */
  async pget(k) {
    if (this.shared) { try { const r = await window.storage.get(k, false); return r && r.value != null ? JSON.parse(r.value) : null; } catch (e) { return null; } }
    if (this.ls) return this._lsGet("fcv5p:" + k);
    return this.mem["p:" + k] !== undefined ? this.mem["p:" + k] : null;
  },
  async pset(k, v) {
    if (this.shared) { try { const r = await window.storage.set(k, JSON.stringify(v), false); return !!r; } catch (e) { return false; } }
    if (this.ls) return this._lsSet("fcv5p:" + k, v);
    this.mem["p:" + k] = JSON.parse(JSON.stringify(v)); return true;
  },
  async pdel(k) {
    if (this.shared) { try { await window.storage.delete(k, false); } catch (e) {} }
    else if (this.ls) { try { this.ls.removeItem("fcv5p:" + k); } catch (e) {} }
    else delete this.mem["p:" + k];
  }
};

/* =================== 密码管理 =================== */
// 密码以 SHA-256 哈希形式存在独立的 fc-passwords key 中(兼容历史明文,首次验证成功后自动升级为哈希)。
// 带 updatedAt 时间戳:导出数据包时一并带出;导入/云端拉取时,云端密码比本地新才覆盖,
// 这样管理员改密码 → 导出上传 GitHub → 团队成员打开页面即生效,而管理员本机最新设置不会被旧包冲掉。
async function sha256(str) {
  try {
    if (crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (e) {}
  // 回退:非安全上下文(如某些 http 环境)用简易散列,仍避免明文落盘
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619) >>> 0; h2 = Math.imul(h2 + c, 2654435761) >>> 0; }
  return "fb" + h1.toString(16).padStart(8, "0") + h2.toString(16).padStart(8, "0");
}
const isHash = v => typeof v === "string" && (/^[0-9a-f]{64}$/.test(v) || /^fb[0-9a-f]{16}$/.test(v));
const Passwords = {
  _cache: null, _loaded: false,
  async _load() { if (this._loaded) return; this._cache = await Store.get("fc-passwords") || {}; this._loaded = true; },
  async _save() { this._cache.updatedAt = Date.now(); await Store.set("fc-passwords", this._cache); },
  async getAdminPin() { await this._load(); return this._cache.adminPin || ""; },
  async setAdminPin(v) { await this._load(); if (v) this._cache.adminPin = await sha256(v); else delete this._cache.adminPin; await this._save(); },

function detectCols(headers) {
  const H = headers.map(h => String(h ?? "").trim());
  const find = (...cands) => { for (const c of cands) { const i = H.findIndex(h => h === c); if (i >= 0) return H[i]; } return null; };
  const findInc = kw => { const i = H.findIndex(h => h.includes(kw)); return i >= 0 ? H[i] : null; };
  // 自动识别年份: 同时存在 "XX Amt" 与 "XX Amt AOP" 的最大年份为当年
  let cy = null; const yrs = [];
  for (const h of H) { const m = h.match(/^(\d{2}) Amt$/); if (m && H.includes(m[1] + " Amt AOP")) yrs.push(parseInt(m[1])); }
  if (yrs.length) cy = Math.max(...yrs);
  if (cy === null) return { err: "未找到形如「26 Amt」与「26 Amt AOP」的列,请确认导出的是系统标准 detail 明细。" };
  const ly = cy - 1;
  const C = {
    cy, ly,
    rep: find("Rep", "rep", "代表", "销售代表"),
    prov: find("Province", "省份", "省"),
    grp: find("Region 0 - for 预估") || findInc("for 预估") || find("Prod Group", "Product Line5", "产品组"),
    rsm: find("RSM", "Region", "大区"),
    dsm: find("District", "DSM", "地区"),

  for (const need of ["rep", "prov", "grp", "month"]) if (!C[need]) return { err: "缺少必需列: " + need + " (Rep / Province / Region 0 - for 预估 / Month)" };
  return C;
}

function aggregateRows(rows, C) {

  for (const r of rows) {

    used++;

    const grp = String(r[C.grp] ?? "").trim() || "未分组";

/* =================== 预估准确率(版本回测) ===================
   对比口径:版本保存时还是"预估"、但现在已经关账有实际数的月份。
   即用「上一版本当时填的预估」对比「之后真实发生的销量」。
   diff    = 实际 − 上版预估(正数 = 实际超出预估/预估偏保守)

  if (!ver || !ver.rows) return null;
  const actSet = new Set(S.cfg.actMonths || []);
  const verActSet = new Set(ver.actMonths || []);
  const cmpMs = (ms || []).filter(i => actSet.has(i + 1) && !verActSet.has(i + 1));
  if (!cmpMs.length) return null;
  let totalActual = 0, totalVerFcst = 0;
  for (const e of items) {
    const vr = ver.rows[e.key];
    if (!vr || !vr.m) continue;
    for (const i of cmpMs) {
      const actual = e.row ? e.row.actA[i] : 0;
      const verFcst = vr.m[i];
      if (verFcst != null && actual > 0) { totalActual += actual; totalVerFcst += verFcst; }

  const diff = totalActual - totalVerFcst;
  return {
    actual: totalActual,
    verFcst: totalVerFcst,

    if (S.fillMode === "grp") return a.localeCompare(b, "zh");
    return grpSortKey(a).localeCompare(grpSortKey(b));
  });

  if (!mob) {
    /* ===== 桌面: 宽表格 ===== */
    html += '<div class="twrap"><table class="dt"><thead><tr>' +
      '<th class="l stick1" data-cid="name" style="min-width:200px">' + col1Label + '</th>';
    for (let i = 0; i < 12; i++) html += '<th data-cid="m' + i + '">' + MN[i] + (actSet.has(i + 1) ? "<br><span style='font-weight:400'>Act</span>" : "<br><span style='color:var(--blue)'>预估</span>") + "</th>";
    html += '<th class="l" data-cid="rm" style="min-width:240px">备注(预估说明/变化原因)</th>' +
      '<th data-cid="fy">' + pShort + '预估</th><th data-cid="aop">' + pShort + ' AOP</th><th data-cid="ach">' + pShort + ' Ach%</th><th data-cid="gr">' + pShort + ' GR%</th>' +
      (ver ? '<th data-cid="vfy" title="最近版本快照中的同期间预估">上版' + pShort + '预估</th><th data-cid="dfy" title="本次预估 − 上版预估">Δ上版</th><th data-cid="dfyPct" title="(本次预估 − 上版预估) ÷ 上版预估">Δ上版%</th>' : '') +
      '</tr></thead><tbody id="fill-body">';
    for (const key of sortedKeys) {
      const list = byKey.get(key);
      const qm = list[0].qtyMode;
      const gsubId = 'gsub-' + esc(key).replace(/[^\w\u4e00-\u9fa5]/g, "_");
      html += '<tr class="grp-row"><td class="l stick1">' + esc(key) + (qm ? '<span class="tag q">填数量</span>' : '<span class="tag">填金额K</span>') + '</td>' +
        '<td colspan="' + (12 + (ver ? 7 : 4) + 1) + '" class="l" id="' + gsubId + '"></td></tr>';
      for (const e of list) {
        e._ri = ri;
        const vrow = verRowOf(ver, e.key);
        html += '<tr data-key="' + esc(e.key) + '"><td class="l stick1" style="padding-left:20px">' + esc(e[subKey]) + (e.manual ? '<span class="tag new">新增</span>' : "") + (e.ovCount ? '<span class="tag ovr" title="管理层调整了 ' + e.ovCount + ' 个月">调整' + e.ovCount + '</span>' : "") + "</td>";
        for (let i = 0; i < 12; i++) {
          const c = e.m[i];
          if (c.act) html += '<td class="act-cell num">' + fmtK(c.a) + (e.qtyMode ? '<span class="subv">' + fmtQ(c.q) + "件</span>" : "") + "</td>";
          else {
            const prevA = vrow && vrow.m ? vrow.m[i] : null;
            if (e.qtyMode) {
              const val = c.rawq != null ? String(+c.rawq.toFixed(2)) : (c.raw != null && e.asp > 0 ? String(+(c.raw / e.asp).toFixed(2)) : "");
              const ph = prevA != null && e.asp > 0 ? "上版" + (+(prevA / e.asp).toFixed(1)) : "数量";
              html += '<td><input class="fc-in' + (val ? " filled" : "") + (c.ov ? " ovr" : "") + '" data-ri="' + ri + '" data-m="' + i + '" data-kind="q" value="' + val + '" placeholder="' + ph + '" inputmode="decimal">' +
                '<span class="subv" id="amt-' + ri + "-" + i + '">' + (c.raw != null ? "≈" + fmtK(c.a) + "K" : "") + "</span>" +
                '<span class="subv ovr-sub" id="rv-' + ri + "-" + i + '">' + (c.ov ? "代表 " + (c.rq != null ? fmtQ(c.rq) : (c.ra != null ? "≈" + fmtK(c.ra) + "K" : "未填")) : "") + "</span></td>";
            } else {
              const val = c.raw != null ? String(+(c.raw / 1000).toFixed(2)) : "";
              const ph = prevA != null ? "上版" + fmtK(prevA) : "K";
              html += '<td><input class="fc-in' + (val ? " filled" : "") + (c.ov ? " ovr" : "") + '" data-ri="' + ri + '" data-m="' + i + '" data-kind="a" value="' + val + '" placeholder="' + ph + '" inputmode="decimal">' +
                '<span class="subv ovr-sub" id="rv-' + ri + "-" + i + '">' + (c.ov ? "代表 " + (c.ra != null ? fmtK(c.ra) : "未填") : "") + "</span></td>";
            }
          }
        }
        /* 备注 → 12月后、FY预估前 */
        html += '<td class="l"><input class="rm-in" data-ri="' + ri + '" data-kind="rm" value="' + esc(e.rm) + '" placeholder="例: 6月手术量恢复,上调"></td>';
        /* 期间动态列 */
        html += '<td class="num" id="fy-' + ri + '"></td><td class="num" id="aop-' + ri + '"></td><td class="num" id="ach-' + ri + '"></td>' +
          '<td class="num" id="gr-' + ri + '"></td>';
        if (ver) html += '<td class="num" id="vfy-' + ri + '"></td><td class="num" id="dfy-' + ri + '"></td><td class="num" id="dfyPct-' + ri + '"></td>';
        html += '</tr>';
        ri++;
      }
    }
    html += '</tbody><tfoot><tr class="total-row" id="fill-total"></tr></tfoot></table></div></div>';
  } else {
    /* ===== 手机: 逐行卡片式填写视图 ===== */
    html += '<div class="m-fill" id="fill-body">';
    for (const key of sortedKeys) {
      const list = byKey.get(key);
      const qm = list[0].qtyMode;
      const safe = esc(key).replace(/[^\w\u4e00-\u9fa5]/g, "_");
      html += '<div class="m-grp"><span class="m-grp-name">' + esc(key) + '</span>' +
        (qm ? '<span class="tag q">填数量</span>' : '<span class="tag">填金额K</span>') +
        '<span class="m-grp-sub" id="msub-' + safe + '"></span></div>';
      for (const e of list) {
        e._ri = ri;
        const vrow = verRowOf(ver, e.key);
        const unit = e.qtyMode ? '件' : 'K';
        /* 卡头: 名称 + 期间 KPI(实时) */
        html += '<div class="m-row" data-key="' + esc(e.key) + '">' +
          '<div class="m-row-h"><span class="m-row-name">' + esc(e[subKey]) +
            (e.manual ? '<span class="tag new">新增</span>' : "") +
            (e.ovCount ? '<span class="tag ovr">调整' + e.ovCount + '</span>' : "") + '</span></div>' +
          '<div class="m-kpi">' +
            '<div><small>' + pShort + '预估</small><b class="num" id="fy-' + ri + '">–</b></div>' +
            '<div><small>AOP</small><b class="num" id="aop-' + ri + '">–</b></div>' +
            '<div><small>Ach%</small><b class="num" id="ach-' + ri + '">–</b></div>' +
            '<div><small>GR%</small><b class="num" id="gr-' + ri + '">–</b></div>' +
          '</div>';
        /* 已关账月: 紧凑只读条 */
        let actChips = "";
        for (let i = 0; i < 12; i++) { const c = e.m[i]; if (c.act) actChips += '<span class="m-act-chip"><i>' + MN[i] + '</i>' + fmtK(c.a) + (e.qtyMode ? ' / ' + fmtQ(c.q) + '件' : 'K') + '</span>'; }
        if (actChips) html += '<div class="m-act"><span class="m-act-lab">已关账(Act)</span><div class="m-act-strip">' + actChips + '</div></div>';
        /* 预估月: 逐行输入 */
        html += '<div class="m-months">';
        for (let i = 0; i < 12; i++) {
          const c = e.m[i];
          if (c.act) continue;
          const prevA = vrow && vrow.m ? vrow.m[i] : null;
          let val, ph, kind;
          if (e.qtyMode) {
            val = c.rawq != null ? String(+c.rawq.toFixed(2)) : (c.raw != null && e.asp > 0 ? String(+(c.raw / e.asp).toFixed(2)) : "");
            ph = prevA != null && e.asp > 0 ? "上版" + (+(prevA / e.asp).toFixed(1)) : "数量";
            kind = "q";
          } else {
            val = c.raw != null ? String(+(c.raw / 1000).toFixed(2)) : "";
            ph = prevA != null ? "上版" + fmtK(prevA) : "金额K";
            kind = "a";
          }
          html += '<div class="m-mo">' +
            '<span class="m-mo-lab">' + MN[i] + '<i class="fc">预估</i></span>' +
            '<span class="m-mo-field">' +
              '<input class="fc-in' + (val ? " filled" : "") + (c.ov ? " ovr" : "") + '" data-ri="' + ri + '" data-m="' + i + '" data-kind="' + kind + '" value="' + val + '" placeholder="' + ph + '" inputmode="decimal">' +
              '<span class="m-mo-unit">' + unit + '</span>' +
            '</span>' +
            (e.qtyMode ? '<span class="subv m-mo-amt" id="amt-' + ri + "-" + i + '">' + (c.raw != null ? "≈" + fmtK(c.a) + "K" : "") + "</span>" : "") +
            '<span class="subv ovr-sub m-mo-rv" id="rv-' + ri + "-" + i + '">' + (c.ov ? "代表 " + (e.qtyMode ? (c.rq != null ? fmtQ(c.rq) : (c.ra != null ? "≈" + fmtK(c.ra) + "K" : "未填")) : (c.ra != null ? fmtK(c.ra) : "未填")) : "") + "</span>" +
            '</div>';
        }
        html += '</div>';
        /* 备注 */
        html += '<div class="m-rm"><label>备注 / 变化原因</label>' +
          '<input class="rm-in" data-ri="' + ri + '" data-kind="rm" value="' + esc(e.rm) + '" placeholder="例: 6月手术量恢复,上调"></div>';
        html += '</div>'; /* /m-row */
        ri++;
      }
    }
    html += '<div class="m-total" id="m-fill-total"></div>';
    html += '</div></div>';
  }

  /* —— 整体备注 —— */
  if (S.fillMode === "rep" || !S.fillMode) {
    html += '<div class="card"><div class="card-h"><h3>本次预估整体说明(可选)</h3></div><div class="card-b">' +
      '<textarea id="overall" class="ctrl" style="width:100%;min-height:64px" placeholder="给经理/老板看的整体说明,例如:本月集采落地,导丝价格下调,Q3量增价减…">' + esc((doc && doc.overall) || "") + "</textarea></div></div>";
  }

  host.innerHTML = html;
  const entries = all; // closure
  S._fillEntries = entries; S._fillVer = ver;

  /* —— 事件 —— */
  if ($("#rep-sel")) $("#rep-sel").onchange = e => { S.curRep = e.target.value; renderFill(); };
  if ($("#prov-sel")) $("#prov-sel").onchange = e => { S.fillProv = e.target.value; renderFill(); };
  if ($("#grp-sel")) $("#grp-sel").onchange = e => { S.fillGrp = e.target.value; renderFill(); };
  if ($("#fill-mode-seg")) $("#fill-mode-seg").onclick = e => { const b = e.target.closest("button"); if (b && b.dataset.mode) { S.fillMode = b.dataset.mode; renderFill(); } };
  if ($("#period-seg")) $("#period-seg").onclick = e => { const b = e.target.closest("button"); if (b && b.dataset.p) { if (b.dataset.p === "YTD") { if (!S.period.startsWith("YTD")) S.period = "YTD-12"; } else { S.period = b.dataset.p; } renderFill(); renderCtx(); } };
  if ($("#fill-ytd")) $("#fill-ytd").onchange = e => { S.period = "YTD-" + e.target.value; renderFill(); renderCtx(); };
  if ($("#overall")) $("#overall").oninput = e => { ensureDoc(S.curRep).overall = e.target.value; saveRepDoc(S.curRep); };
  $("#fill-body").addEventListener("input", e => {
    const t = e.target; if (!t.dataset || t.dataset.ri === undefined) return;
    const en = entries[+t.dataset.ri];
    const repToSave = en.rep;
    if (t.dataset.kind === "rm") { ensureCell(repToSave, en.key).rm = t.value; en.rm = t.value; saveRepDoc(repToSave); return; }
    const i = +t.dataset.m;
    /* 管理视图写入"管理调整"覆盖层;代表写入自己的原始提交 */
    const cell = mvFill ? ensureMgrCell(en.key) : ensureCell(repToSave, en.key);
    const raw = t.value.trim();
    if (raw === "" || isNaN(parseFloat(raw))) {
      cell.a[i] = null; cell.q[i] = null;
      if (mvFill) pruneMgrCell(en.key); /* 清空 = 撤销该格调整,回落代表原值 */
    } else {
      const v = parseFloat(raw);
      if (t.dataset.kind === "q") { cell.q[i] = v; cell.a[i] = en.asp > 0 ? v * en.asp : v * 1000; }
      else { cell.a[i] = v * 1000; cell.q[i] = en.asp > 0 ? cell.a[i] / en.asp : null; }
    }
    recalcEntry(en);
    const c = en.m[i];
    t.classList.toggle("filled", c.raw != null || c.rawq != null);
    t.classList.toggle("ovr", !!c.ov);
    const rv = $("#rv-" + t.dataset.ri + "-" + i);
    if (rv) rv.textContent = c.ov ? "代表 " + (en.qtyMode ? (c.rq != null ? fmtQ(c.rq) : (c.ra != null ? "≈" + fmtK(c.ra) + "K" : "未填")) : (c.ra != null ? fmtK(c.ra) : "未填")) : "";
    if (t.dataset.kind === "q") { const lab = $("#amt-" + t.dataset.ri + "-" + i); if (lab) lab.textContent = (c.raw != null || c.rawq != null) ? "≈" + fmtK(c.a) + "K" : ""; }
    paintEntry(en); paintRepStats(entries, ver); paintGroupSubs(entries, ver); paintFillChart(entries); renderCtx();
    if (mvFill) saveMgrDoc(); else saveRepDoc(repToSave);
  });
  /* 整块粘贴(Excel 风格) */
  $("#fill-body").addEventListener("paste", e => {
    const t = e.target; if (!t.dataset || t.dataset.ri === undefined) return;
    e.preventDefault();
    const paste = (e.clipboardData || window.clipboardData).getData("text");
    const lines = paste.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n").filter(l => l.trim() !== "");
    if (!lines.length) return;
    const ri0 = +t.dataset.ri, m0 = +t.dataset.m, kind0 = t.dataset.kind;
    for (let li = 0; li < lines.length; li++) {
      const cols = lines[li].split(/\t/).map(c => c.trim());
      for (let ci = 0; ci < cols.length; ci++) {
        const targetRi = ri0 + li, targetM = m0 + ci;
        if (targetRi >= entries.length || targetM >= 12) continue;
        const targetEn = entries[targetRi];
        if (targetEn.m[targetM].act) continue;
        const raw = cols[ci]; if (raw === "" || isNaN(parseFloat(raw))) continue;
        const v = parseFloat(raw);
        const cell = mvFill ? ensureMgrCell(targetEn.key) : ensureCell(targetEn.rep, targetEn.key);
        if (targetEn.qtyMode) { cell.q[targetM] = v; cell.a[targetM] = targetEn.asp > 0 ? v * targetEn.asp : v * 1000; }
        else { cell.a[targetM] = v * 1000; cell.q[targetM] = targetEn.asp > 0 ? cell.a[targetM] / targetEn.asp : null; }
        recalcEntry(targetEn);
      }
    }
    renderFill(); renderCtx();
    if (mvFill) saveMgrDoc(); else {
      const reps = new Set(); for (let li = 0; li < lines.length; li++) { const tr = ri0 + li; if (tr < entries.length) reps.add(entries[tr].rep); }
      for (const rep of reps) saveRepDoc(rep);
    }
    toast("已粘贴 " + lines.length + " 行");
  });
  /* 键盘方向键/Tab/Enter 在格子间移动 */
  $$('.fc-in').forEach(inp => {
    inp.addEventListener('keydown', e => {
      const ri = +inp.dataset.ri, m = +inp.dataset.m;
      let nextRi = ri, nextM = m;
      if (e.key === 'ArrowRight') nextM = m + 1;
      else if (e.key === 'ArrowLeft') nextM = m - 1;
      else if (e.key === 'ArrowDown') nextRi = ri + 1;
      else if (e.key === 'ArrowUp') nextRi = ri - 1;
      else if (e.key === 'Tab') { if (e.shiftKey) nextM = m - 1; else nextM = m + 1; }
      else if (e.key === 'Enter') nextRi = ri + 1;
      else return;
      if (nextM < 0 || nextM >= 12) return;
      if (nextRi < 0 || nextRi >= entries.length) return;
      e.preventDefault();
      const nextInp = document.querySelector('.fc-in[data-ri="' + nextRi + '"][data-m="' + nextM + '"]');
      if (nextInp) nextInp.focus();
    });
  });
  /* 合理性校验: 负数、异常值(>AOP 5 倍)高亮 */
  function validateInput(input, en, month) {
    const raw = input.value.trim();
    if (raw === '') { input.style.background = ''; input.style.borderColor = ''; return true; }
    const v = parseFloat(raw);
    if (v < 0) { input.style.background = 'var(--red-soft)'; return false; }
    const aop = en.row ? en.row.aopA[month] : 0;
    if (aop > 0 && Math.abs(v * 1000) > aop * 5) { input.style.background = 'var(--amber-soft)'; return false; }
    input.style.background = ''; return true;
  }
  /* 大幅变动必须填备注(软约束: 边框琥珀色提示) */
  function checkNoteRequired(input, en, month) {
    if (en.rm && en.rm.trim()) { input.style.borderColor = ''; return false; }
    const raw = input.value.trim(); if (raw === '') { input.style.borderColor = ''; return false; }
    const v = parseFloat(raw);
    const prevV = en.m[month] && en.m[month].a || 0;
    const aop = en.row ? en.row.aopA[month] : 0;
    if (prevV > 0 && Math.abs(v * 1000 - prevV) / prevV > 0.3) { input.style.borderColor = 'var(--amber)'; return true; }
    if (aop > 0 && Math.abs(v * 1000 - aop) / aop > 0.5) { input.style.borderColor = 'var(--amber)'; return true; }
    input.style.borderColor = ''; return false;
  }
  $$('.fc-in').forEach(inp => {
    const en = entries[+inp.dataset.ri];
    const month = +inp.dataset.m;
    inp.addEventListener('input', () => { validateInput(inp, en, month); checkNoteRequired(inp, en, month); });
  });
  /* 管理视图: 清空某格离开焦点时,输入框显示回代表原值(覆盖已撤销) */
  if (mvFill) $("#fill-body").addEventListener("change", e => {
    const t = e.target; if (!t.dataset || t.dataset.ri === undefined || t.dataset.kind === "rm") return;
    if (t.value.trim() !== "") return;
    const en = entries[+t.dataset.ri]; const i = +t.dataset.m; const c = en.m[i];
    if (!c || c.act) return;
    if (en.qtyMode) t.value = c.rawq != null ? String(+c.rawq.toFixed(2)) : (c.raw != null && en.asp > 0 ? String(+(c.raw / en.asp).toFixed(2)) : "");
    else t.value = c.raw != null ? String(+(c.raw / 1000).toFixed(2)) : "";
    t.classList.toggle("filled", !!t.value);
  });
  $("#qf-aop") && ($("#qf-aop").onclick = () => quickFill("aop"));
  $("#qf-ly") && ($("#qf-ly").onclick = () => quickFill("ly"));
  $("#qf-prev") && ($("#qf-prev").onclick = () => quickFill("prev"));
  $("#qf-clear").onclick = () => {
    const clearTarget = S.fillMode === "prov" ? esc(S.fillProv) + " 省份视图" :
      S.fillMode === "grp" ? esc(S.fillGrp) + " 产品视图" :
      esc(S.curRep);
    if (mvFill) openModal("撤销管理调整", "<p>确定撤销 <b>" + clearTarget + "</b> 在所有预估月份的<b>管理调整</b>,恢复为代表提交的原值吗?代表的原始数据不受影响。</p>",
      '<button class="btn" onclick="closeModal()">取消</button><button class="btn danger" id="qfc-ok">撤销调整</button>');
    else openModal("清空确认", "<p>确定清空 <b>" + clearTarget + "</b> 在所有<b>预估月份</b>的填写吗?已关账月份的实际数不受影响。</p>",
      '<button class="btn" onclick="closeModal()">取消</button><button class="btn danger" id="qfc-ok">清空</button>');
    $("#qfc-ok").onclick = () => { closeModal(); quickFill("clear"); };
  };
  if ($("#add-row")) $("#add-row").onclick = openAddRow;
  $("#exp-rep") && ($("#exp-rep").onclick = exportRepXlsx);

  for (const e of entries) recalcEntry(e), paintEntry(e);
  paintRepStats(entries, ver); paintGroupSubs(entries, ver); paintFillChart(entries);
  
  /* 列宽拖拽: 可灵活调整, 并记住本次会话调过的宽度 */
  requestAnimationFrame(() => initResizableTable($("#tab-fill table.dt"), "fill"));
  /* 恢复滚动位置 */
  const newTwrap = $(".twrap");
  if (newTwrap) newTwrap.scrollLeft = savedScrollLeft;
}

/* 填写页月度趋势: 当前代表的 实际+预估 vs AOP vs 去年 */
function paintFillChart(entries) {
  const el = $("#fill-chart"); if (!el) return;
  const blend = zeros(), aopM = zeros(), lyM = zeros();
  for (const e of entries) for (let i = 0; i < 12; i++) {
    blend[i] += isFinite(e.m[i] && e.m[i].a) ? e.m[i].a : 0;
    if (e.row) { 
      aopM[i] += isFinite(e.row.aopA[i]) ? e.row.aopA[i] : 0; 
      lyM[i] += isFinite(e.row.lyA[i]) ? e.row.lyA[i] : 0; 
    }
  }
  el.innerHTML = monthChart(blend, aopM, lyM);
}

function recalcEntry(e) {
  const actSet = new Set(S.cfg.actMonths);
  const f = (S.fcs.get(e.rep) || { rows: {} }).rows[e.key];
  const mr = isMgrView() ? mgrRowOf(e.key) : null;
  let fy = 0, fyq = 0, openFilled = 0, ovCount = 0;
  for (let i = 0; i < 12; i++) {
    if (actSet.has(i + 1)) { e.m[i] = { act: true, a: e.row.actA[i], q: e.row.actQ[i] }; fy += e.row.actA[i]; fyq += e.row.actQ[i]; }
    else {
      const ra = f && f.a ? f.a[i] : null, rq = f && f.q ? f.q[i] : null; /* 代表原始 */
      let fa = ra, fq = rq, ov = false;
      if (mr) { const ma = mr.a ? mr.a[i] : null; const mq = mr.q ? mr.q[i] : null;
        if (ma != null || mq != null) { fa = ma; fq = mq; ov = true; ovCount++; } }
      let a, q;
      if (e.qtyMode && fq != null) { q = fq; a = e.asp > 0 ? fq * e.asp : (fa != null ? fa : fq * 1000); }
      else { a = fa != null ? fa : 0; q = fq != null ? fq : (fa != null && e.asp > 0 ? fa / e.asp : 0); }
      if (fa != null || fq != null) openFilled++;

function renderProgress() {
  const host = $("#tab-progress");
  if (!S.master || !S.cfg) {
    host.innerHTML = '<div class="card"><div class="empty"><b>还没有数据</b>请先在「管理后台」导入系统导出文件。</div></div>';
    return;
  }
  const entries = scopedEntries();
  const reps = scopeReps();

  const repStatus = [];
  for (const rep of reps) {
    const repEntries = entries.filter(e => e.rep === rep);
    /* 提交进度始终按「全年开口月」衡量,不随填写页当前期间(Q1/H1/YTD…)而变 */
    const pe = calcEntriesPeriod(repEntries, "FY");
    const doc = S.fcs.get(rep);
    const lastUpdate = doc ? doc.updatedAt : 0;
    const completed = pe.openTotal > 0 ? Math.round(pe.openFilled / pe.openTotal * 100) : 100;
    const isSubmitted = completed >= 100;
    repStatus.push({
      rep, dsm: (S.repInfo.get(rep) || {}).dsm || "未分配",
      rsm: (S.repInfo.get(rep) || {}).rsm || "未分配",
      lastUpdate, completed, isSubmitted,
      openFilled: pe.openFilled, openTotal: pe.openTotal
    });
  }

  /* 按 DSM 分组 */
  const byDsm = new Map();
  for (const r of repStatus) {
    if (!byDsm.has(r.dsm)) byDsm.set(r.dsm, []);
    byDsm.get(r.dsm).push(r);
  }

  /* 整体汇总 */
  const totalReps = repStatus.length;
  const totalSubmitted = repStatus.filter(r => r.isSubmitted).length;
  const overallPct = totalReps ? Math.round(totalSubmitted / totalReps * 100) : 0;
  const pctCls = p => p >= 100 ? "pos" : p >= 80 ? "warn" : "neg";

  let html = '<div class="card"><div class="card-h"><h3>📋 提报进度看板</h3>' +
    '<span class="hint">按 DSM 分组显示每位代表的提交状态、完成度与最后更新时间。完成度按全年开口月衡量。</span>' +
    '<button class="btn sm pri" id="exp-unsub" style="margin-left:auto">⬇ 导出未交名单</button></div>' +
    '<div class="card-b" style="display:flex;gap:32px;flex-wrap:wrap;align-items:flex-end">' +
      '<div><small style="color:var(--mute)">已提交 / 总人数</small><div class="num" style="font-size:22px;font-weight:700;line-height:1.2">' + totalSubmitted + ' / ' + totalReps + '</div></div>' +
      '<div><small style="color:var(--mute)">整体提交率</small><div class="num ' + pctCls(overallPct) + '" style="font-size:22px;font-weight:700;line-height:1.2">' + overallPct + '%</div></div>' +
      '<div><small style="color:var(--mute)">DSM 团队数</small><div class="num" style="font-size:22px;font-weight:700;line-height:1.2">' + byDsm.size + '</div></div>' +
    '</div></div>';

  if (totalReps === 0) {
    html += '<div class="card"><div class="empty">当前身份范围内没有代表。</div></div>';
    host.innerHTML = html;
    return;
  }

  /* 每个 DSM 一张独立卡片 */
  const dsmList = [...byDsm.entries()].sort((a, b) => a[0].localeCompare(b[0], "zh"));
  for (const [dsm, listRaw] of dsmList) {
    /* 组内排序: 未提交在前 → 完成度低在前 → 姓名,便于催办 */
    const list = listRaw.slice().sort((a, b) =>
      (Number(a.isSubmitted) - Number(b.isSubmitted)) || (a.completed - b.completed) || a.rep.localeCompare(b.rep, "zh"));
    const sub = list.filter(r => r.isSubmitted).length;
    const teamPct = list.length ? Math.round(sub / list.length * 100) : 0;
    html += '<div class="card"><div class="card-h">' +
      '<h3>👥 ' + esc(dsm) + '</h3>' +
      '<span class="hint">已提交 ' + sub + ' / ' + list.length + ' 人</span>' +
      '<span class="num ' + pctCls(teamPct) + '" style="margin-left:auto;font-size:15px;font-weight:700">' + teamPct + '%</span>' +
      '</div>' +
      '<div class="twrap"><table class="dt prog-tbl">' +
      '<colgroup><col class="c-rep"><col class="c-st"><col class="c-pct"><col class="c-fill"><col class="c-upd"></colgroup>' +
      '<thead><tr>' +
      '<th class="l stick1">代表</th><th>提交状态</th><th>完成度</th><th>已填 / 应填</th><th>最后更新</th>' +
      '</tr></thead><tbody>';
    for (const r of list) {
      html += '<tr>' +
        '<td class="l stick1">' + esc(r.rep) + '</td>' +
        '<td class="num ' + (r.isSubmitted ? 'pos' : 'neg') + '">' + (r.isSubmitted ? '已提交' : '未提交') + '</td>' +
        '<td class="num ' + (r.completed >= 100 ? 'pos' : (r.completed >= 80 ? 'warn' : 'neg')) + '">' + r.completed + '%</td>' +
        '<td class="num">' + r.openFilled + ' / ' + r.openTotal + '</td>' +
        '<td class="num">' + (r.lastUpdate ? dt(r.lastUpdate) : '–') + '</td>' +
        '</tr>';
    }
    html += '</tbody></table></div></div>';
  }

  host.innerHTML = html;
  $("#exp-unsub").onclick = () => exportUnsubXlsx(repStatus);
}

function exportUnsubXlsx(repStatus) {
  if (typeof XLSX === "undefined") { toast("Excel 组件未加载"); return; }
  const unsub = repStatus.filter(r => !r.isSubmitted)
    .sort((a, b) => a.dsm.localeCompare(b.dsm, "zh") || a.completed - b.completed || a.rep.localeCompare(b.rep, "zh"));
  if (!unsub.length) { toast("所有代表已提交，无需催办"); return; }
  const aoa = [["DSM", "代表", "完成度", "已填/应填", "最后更新"]];
  for (const r of unsub) {
    aoa.push([r.dsm, r.rep, r.completed + "%", r.openFilled + "/" + r.openTotal, r.lastUpdate ? dt(r.lastUpdate) : "–"]);
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), "未交名单");
  XLSX.writeFile(wb, "未交名单_" + (S.cfg.cycleLabel || "") + "_" + stamp() + ".xlsx");
  toast("已导出未交名单 " + unsub.length + " 人");
}

async function renderDash() {
  const host = $("#tab-dash");
  if (!S.master || !S.cfg) { host.innerHTML = '<div class="card"><div class="empty"><b>还没有数据</b>请先在「管理后台」导入系统导出文件。</div></div>'; return; }
  const d = S.dash;
  const vs = (S.cfg.versions || []);
  if (d.cmp === "latest") d.cmpId = vs.length ? vs[vs.length - 1].id : "";
  const ver = d.cmpId ? await getVersion(d.cmpId) : null;
  const verMeta = vs.find(v => v.id === d.cmpId);

  let entries = scopedEntries();
  /* 期间筛选 */
  const dp = d.period || "FY";
  const ms = getPeriodMonths(dp);
  const pShort = periodShort(dp);

  /* 维度下钻筛选: 当前维度 + 其它两个维度都可下钻 */
  if (!d.drillFilters) d.drillFilters = {};
  const otherDims = Object.keys(dimDefs).filter(k => k !== d.dim);
  const filterDims = [d.dim, ...otherDims]; /* 当前维度排最前, 作为主下钻 */
  for (const dk of filterDims) {
    const fv = d.drillFilters[dk];
    if (fv && fv.length) entries = entries.filter(e => fv.includes(dimDefs[dk].f(e)));
  }

  const rsms = [...new Set(entries.map(e => e.rsm))].sort();
  if (d.rsm && !rsms.includes(d.rsm)) d.rsm = "";
  if (d.rsm) entries = entries.filter(e => e.rsm === d.rsm);
  if (d.q) { const q = d.q.toLowerCase(); entries = entries.filter(e => (e.rep + e.prov + e.grp + e.dsm + e.rsm).toLowerCase().includes(q)); }

  /* ★ 筛选联动：清理各维度中在当前其他筛选条件下不存在的值 */
  let cleaned = false;
  for (const dk of filterDims) {
    const otherFilters = {};
    for (const otherDk of filterDims) {
      if (otherDk !== dk && d.drillFilters[otherDk] && d.drillFilters[otherDk].length) {
        otherFilters[otherDk] = d.drillFilters[otherDk];
      }
    }
    let baseEntries = scopedEntries();
    if (d.rsm) baseEntries = baseEntries.filter(e => e.rsm === d.rsm);
    for (const [fk, fv] of Object.entries(otherFilters)) {
      baseEntries = baseEntries.filter(e => fv.includes(dimDefs[fk].f(e)));
    }
    const validVals = new Set(baseEntries.map(e => dimDefs[dk].f(e)).filter(Boolean));
    const selected = d.drillFilters[dk] || [];
    const validSelected = selected.filter(v => validVals.has(v));
    if (validSelected.length !== selected.length) {
      d.drillFilters[dk] = validSelected;
      cleaned = true;
    }
  }
  if (cleaned) {
    entries = scopedEntries();
    for (const dk of filterDims) {
      const fv = d.drillFilters[dk];
      if (fv && fv.length) entries = entries.filter(e => fv.includes(dimDefs[dk].f(e)));
    }
    if (d.rsm) entries = entries.filter(e => e.rsm === d.rsm);
  }

  const rows = rollup(entries, dimDefs[d.dim].f);
  if (d.dim === "grp") rows.sort((a, b) => grpSortKey(a.dim).localeCompare(grpSortKey(b.dim)));
  const vRoll = ver ? rollupVer(ver, d.dim, d.rsm, ms, makeDashVerPred(d)) : null;

  /* 期间总览 */
  const T = rows.reduce((o, r) => {
    for (const i of ms) { 
      o.m[i] += isFinite(r.m[i]) ? r.m[i] : 0; 
      o.aopM[i] += isFinite(r.aopA[i]) ? r.aopA[i] : 0; 
      o.lyM[i] += isFinite(r.lyA[i]) ? r.lyA[i] : 0; 
    }
    return o;
  }, { m: zeros(), aopM: zeros(), lyM: zeros() });
  let tFy = 0, tAop = 0, tLy = 0;
  for (const i of ms) { tFy += T.m[i]; tAop += T.aopM[i]; tLy += T.lyM[i]; }

  let html = '<div class="card"><div class="card-h"><h3>筛选与口径</h3>' +
    '<div class="seg" id="dim-seg">' + Object.keys(dimDefs).map(k => '<button data-d="' + k + '" class="' + (d.dim === k ? "on" : "") + '">' + dimDefs[k].name + "</button>").join("") + "</div>" +
    '<div class="seg" id="met-seg"><button data-m="amt" class="' + (d.metric === "amt" ? "on" : "") + '">金额 K</button><button data-m="qty" class="' + (d.metric === "qty" ? "on" : "") + '">数量</button></div>' +
    '<div class="seg" id="dash-period-seg">' + PERIODS.map(p => '<button data-p="' + p.key + '" class="' + (dp === p.key || (p.key === "YTD" && dp.startsWith("YTD")) ? "on" : "") + '">' + p.key + '</button>').join('') + '</div>' +
    '<select class="ctrl" id="dash-ytd" style="width:80px;margin-left:4px;' + (dp.startsWith("YTD") ? "" : "display:none") + '">' + MN.map((m, i) => '<option value="' + (i + 1) + '"' + (dp === "YTD-" + (i + 1) ? " selected" : "") + '>' + m + '</option>').join('') + '</select>' +
    '<select class="ctrl" id="rsm-f"><option value="">全部大区</option>' + rsms.map(r => '<option' + (d.rsm === r ? " selected" : "") + ">" + esc(r) + "</option>").join("") + "</select>" +
    '<select class="ctrl" id="cmp-sel"><option value="">不对比版本</option>' + vs.map(v => '<option value="' + v.id + '"' + (d.cmpId === v.id ? " selected" : "") + ">对比: " + esc(v.label) + "</option>").join("") + "</select>" +
    '<input class="ctrl" id="dash-q" placeholder="搜索代表/省/产品…" value="' + esc(d.q) + '" style="width:160px">' +
    '<button class="btn pri sm" id="exp-xlsx" style="margin-left:auto">\u2b07 导出 Excel</button>' +
    "</div>";

  /* 维度下钻筛选器行 (当前维度在最前, 标记为「主」) */
  const activeDrill = filterDims.reduce((n, dk) => n + ((d.drillFilters[dk] || []).length ? 1 : 0), 0);
  html += '<div class="drillbar">';
  html += '<span class="drillbar-lab">▾ 下钻筛选</span>';
  for (const dk of filterDims) {
    const isCur = dk === d.dim;
    const dimShort = dimDefs[dk].name.replace("维度", "");
    /* 联动：应用除当前维度外的所有筛选条件（含 RSM 下拉框）提取可选值 */
    let baseEntries = scopedEntries();
    if (d.rsm) baseEntries = baseEntries.filter(e => e.rsm === d.rsm);
    for (const otherDk of filterDims) {
      if (otherDk !== dk && d.drillFilters[otherDk] && d.drillFilters[otherDk].length) {
        baseEntries = baseEntries.filter(e => d.drillFilters[otherDk].includes(dimDefs[otherDk].f(e)));
      }
    }
    const allVals = [...new Set(baseEntries.map(e => dimDefs[dk].f(e)))].filter(Boolean).sort((a, b) => a.localeCompare(b, "zh"));
    const selected = d.drillFilters[dk] || [];
    const triggerText = selected.length ? (selected.length === 1 ? esc(selected[0]) : dimShort + ' · 已选 ' + selected.length) : '全部' + dimShort;
    html += '<div class="ms-wrap' + (isCur ? ' primary' : '') + (selected.length ? ' active' : '') + '" id="ms-wrap-' + dk + '" data-dk="' + dk + '">';
    html += '<div class="ms-trigger" id="ms-trigger-' + dk + '">' + (isCur ? '<span class="ms-cur">主</span>' : '') + '<span class="ms-trigger-txt">' + triggerText + '</span></div>';
    html += '<div class="ms-panel">';
    html += '<label class="ms-all"><input type="checkbox" data-all="' + dk + '"' + (!selected.length ? ' checked' : '') + '> 全部' + dimShort + '</label>';
    for (const v of allVals) html += '<label><input type="checkbox" data-dk="' + dk + '" value="' + esc(v) + '"' + (selected.includes(v) ? ' checked' : '') + '> ' + esc(v) + '</label>';
    html += '</div></div>';
  }
  html += '<span class="drillbar-sp"></span>';
  if (activeDrill) html += '<span class="drillbar-count">' + activeDrill + ' 个维度已筛选</span><button class="btn sm" id="drill-clear">清除筛选</button>';
  html += '</div>';

  html += monthChart(T.m, T.aopM, T.lyM) + "</div>";

  /* —— 预估准确率横幅: 上一版本预估 vs 已关账实际(随维度/筛选/期间联动) —— */
  if (ver) {
    const accT = calcVerAccuracy(entries, ver, ms);
    const vLabel = verMeta ? esc(verMeta.label) : "对比版本";
    if (accT) {
      html += '<div class="card acc-card"><div class="acc-strip">' +
        '<div class="acc-title">📊 预估准确率<small>「' + vLabel + '」当时的预估 vs 之后的实际销量 · 对比月份: ' + accMonthsLabel(accT.months) + ' · 随上方维度/筛选联动</small></div>' +
        '<div class="acc-kpi"><small>上版预估</small><b class="num">' + fmtK(accT.verFcst) + ' K</b></div>' +
        '<div class="acc-kpi"><small>实际销量</small><b class="num">' + fmtK(accT.actual) + ' K</b></div>' +
        '<div class="acc-kpi"><small>预估差异(实际−预估)</small><b class="num ' + clsSign(accT.diff) + '">' + fmtDK(accT.diff) + ' K</b></div>' +
        '<div class="acc-kpi main"><small>预估准确率</small><b class="num ' + accCls(accT.acc) + '">' + fmtPct(accT.acc) + '</b></div>' +
        '</div></div>';
    } else {
      html += '<div class="card acc-card"><div class="acc-strip">' +
        '<div class="acc-title">📊 预估准确率<small>「' + vLabel + '」保存后还没有新的关账月份(或当前期间不含可对比月) — 待下个月份关账后,这里会自动回测该版本的预估准确率</small></div>' +
        '</div></div>';
    }
  }

  /* 主表 —— 列模型: 支持点击表头排序 / 拖拽换列 / 拖列缘调宽 */
  const isAmt = d.metric === "amt";
  const vK = isAmt ? fmtK : fmtQ;
  const actSetDash = new Set(S.cfg.actMonths || []);
  const isAdmin = S.me && S.me.role === "admin";

  /* 每行先把全部数值算好(渲染与排序共用) */
  const comp = rows.map(r => {
    let rFy = 0, rAop = 0, rLy = 0, rFyq = 0, rAopQ = 0, rLyQ = 0;
    for (const i of ms) { rFy += r.m[i]; rAop += r.aopA[i]; rLy += r.lyA[i]; rFyq += r.mq[i]; rAopQ += r.aopQ2[i]; rLyQ += r.lyQ2[i]; }
    const fyV = isAmt ? rFy : rFyq, aopV = isAmt ? rAop : rAopQ, lyV = isAmt ? rLy : rLyQ;
    const achV = aopV > 0 ? fyV / aopV : null, grV = lyV > 0 ? fyV / lyV - 1 : null;
    const ach = rAop > 0 ? rFy / rAop : null, gr = rLy > 0 ? rFy / rLy - 1 : null;
    let ytdAct = 0, ytdAop = 0;
    for (const i of ms) if (actSetDash.has(i + 1)) { ytdAct += r.m[i]; ytdAop += r.aopA[i]; }
    const acc = ver ? calcVerAccuracyForItems(r.items, ver, ms) : null;
    const vr = vRoll ? vRoll.get(r.dim) : null;
    let vfy = null, dlt = null, dach = null, dgr = null, isNew = false;
    if (ver) {
      if (vr) {
        vfy = isAmt ? vr.fy : vr.fyq; dlt = fyV - vfy;
        /* 同期间口径:旧版同期值 ÷ 当前同期 AOP / 去年同期 */
        const vach = rAop > 0 ? vr.fy / rAop : null, vgr = rLy > 0 ? vr.fy / rLy - 1 : null;
        dach = ach !== null && vach !== null ? ach - vach : null;
        dgr = gr !== null && vgr !== null ? gr - vgr : null;
      } else isNew = true;
    }
    const prog = r.openTotal ? Math.round(r.openFilled / r.openTotal * 100) : 100;
    return { r, fyV, aopV, lyV, achV, grV, ytdAch: ytdAop > 0 ? ytdAct / ytdAop : null, acc, vfy, dlt, dach, dgr, isNew, prog };
  });

  /* 合计 */
  const sumQ = arr => rows.reduce((s, r) => { let q = 0; for (const i of ms) q += r[arr][i]; return s + q; }, 0);
  const tFyq = sumQ("mq"), tAopQ = sumQ("aopQ2"), tLyQ = sumQ("lyQ2");
  const tFyV = isAmt ? tFy : tFyq, tAopV = isAmt ? tAop : tAopQ, tLyV = isAmt ? tLy : tLyQ;
  const tAch = tAop > 0 ? tFy / tAop : null, tGr = tLy > 0 ? tFy / tLy - 1 : null;
  const tAcc = ver ? calcVerAccuracy(entries, ver, ms) : null;
  let vt = 0; if (ver) for (const [, v] of (vRoll || new Map())) vt += isAmt ? v.fy : v.fyq;
  const tDlt = tFyV - vt;

  /* 列定义: id 固定, 顺序由 d.colOrder 决定 */
  const C = [];
  C.push({ id: "dim", label: dimDefs[d.dim].name.slice(0, 2), thCls: "l stick1", thSty: "min-width:170px", fixed: true,
    sv: c => c.r.dim,
    td: c => '<td class="l stick1">' + (d.open.has(c.r.dim) ? "\u25be " : "\u25b8 ") + esc(c.r.dim) + "</td>",
    tt: () => '<td class="l stick1">\u5408\u8ba1</td>' });
  if (d.months) for (let mi = 0; mi < 12; mi++) (i => C.push({ id: "m" + i, label: MN[i],
    sv: c => isAmt ? c.r.m[i] : c.r.mq[i],
    td: c => '<td class="num' + (actSetDash.has(i + 1) ? " act-cell" : "") + '">' + vK(isAmt ? c.r.m[i] : c.r.mq[i]) + "</td>",
    tt: () => '<td class="num">' + vK(isAmt ? T.m[i] : rows.reduce((s, r) => s + r.mq[i], 0)) + "</td>" }))(mi);
  let tYtdAct = 0, tYtdAop = 0;
  for (const r of rows) for (const i of ms) if (actSetDash.has(i + 1)) { tYtdAct += r.m[i]; tYtdAop += r.aopA[i]; }
  C.push({ id: "ytd", label: "YTD实际 Ach%", sv: c => c.ytdAch,
    td: c => '<td class="num">' + fmtPct(c.ytdAch) + "</td>",
    tt: () => '<td class="num">' + fmtPct(tYtdAop > 0 ? tYtdAct / tYtdAop : null) + "</td>" });
  C.push({ id: "fy", label: pShort + "\u9884\u4f30", sv: c => c.fyV,
    td: c => '<td class="num"><b>' + vK(c.fyV) + "</b></td>",
    tt: () => '<td class="num"><b>' + vK(tFyV) + "</b></td>" });
  C.push({ id: "aop", label: pShort + " AOP", sv: c => c.aopV,
    td: c => '<td class="num">' + vK(c.aopV) + "</td>",
    tt: () => '<td class="num">' + vK(tAopV) + "</td>" });
  C.push({ id: "ach", label: pShort + " Ach%", sv: c => c.achV,
    td: c => '<td class="num ' + clsAch(c.achV) + '">' + achSymHtml(c.achV) + fmtPct(c.achV) + "</td>",
    tt: () => '<td class="num ' + clsAch(tAch) + '">' + achSymHtml(tAch) + fmtPct(tAch) + "</td>" });
  
  
  if (ver) {
    C.push({ id: "vfy", label: "\u4e0a\u7248" + pShort, sv: c => c.isNew ? null : c.vfy,
      td: c => c.isNew ? '<td class="num dim">\u65b0\u589e</td>' : '<td class="num">' + vK(c.vfy) + "</td>",
      tt: () => '<td class="num">' + vK(vt) + "</td>" });
    C.push({ id: "dfy", label: "\u0394" + pShort, sv: c => c.isNew ? c.fyV : c.dlt,
      td: c => c.isNew
        ? '<td class="num pos">' + (isAmt ? fmtDK(c.fyV) : "+" + fmtQ(c.fyV)) + "</td>"
        : '<td class="num ' + (c.dlt > 1e-6 ? "pos delta-up" : c.dlt < -1e-6 ? "neg delta-dn" : "") + '">' + (isAmt ? fmtDK(c.dlt) : (c.dlt > 0 ? "+" : "") + fmtQ(c.dlt)) + "</td>",
      tt: () => '<td class="num ' + clsSign(tDlt) + '">' + (isAmt ? fmtDK(tDlt) : (tDlt > 0 ? "+" : "") + fmtQ(tDlt)) + "</td>" });
    C.push({ id: "dach", label: "\u0394Ach", sv: c => c.dach,
      td: c => c.isNew ? "<td>\u2013</td>" : '<td class="num ' + clsSign(c.dach) + '">' + fmtPP(c.dach) + "</td>",
      tt: () => "<td></td>" });

  }
  C.push({ id: "prog", label: "\u586b\u5199\u8fdb\u5ea6", sv: c => c.prog,
    td: c => '<td class="num ' + (c.prog === 100 ? "pos" : c.prog === 0 ? "dim" : "warn") + '">' + c.prog + "%</td>",
    tt: () => "<td></td>" });
  C.push({ id: "rm", label: "\u5907\u6ce8", thCls: "l", sv: c => c.r.rms.length,
    td: c => '<td class="l">' + (c.r.rms.length ? '<span class="tag" style="background:var(--blue-soft);color:var(--blue)">' + c.r.rms.length + " \u6761</span>" : '<span class="dim" style="color:var(--mute)">\u2014</span>') + "</td>",
    tt: () => "<td></td>" });
  C.push({ id: "mgrRm", label: "\u7ba1\u7406\u5907\u6ce8", thCls: "l", sv: c => getDashComment(d.dim + "|" + c.r.dim),
    td: c => {
      const key = d.dim + "|" + c.r.dim;
      const val = getDashComment(key);
      if (isAdmin) {
        return '<td class="l"><input class="rm-in" data-mgr-rm="' + esc(key) + '" value="' + esc(val) + '" placeholder="\u7ba1\u7406\u8005\u5907\u6ce8" style="width:160px"></td>';
      }
      return '<td class="l" style="white-space:normal;max-width:200px">' + (val ? esc(val) : '<span class="dim" style="color:var(--mute)">\u2014</span>') + '</td>';
    },
    tt: () => "<td></td>" });
  if (ver) {
    C.push({ id: "diff", label: "\u9884\u4f30\u5dee\u5f02", thCls: "diff-h", thTitle: "\u4e0a\u4e00\u7248\u672c\u4fdd\u5b58\u540e\u65b0\u5173\u8d26\u6708\u4efd: \u5b9e\u9645\u9500\u91cf \u2212 \u5f53\u65f6\u9884\u4f30", sv: c => c.acc ? c.acc.diff : null,
      td: c => '<td class="num diff-cell ' + (c.acc ? clsSign(c.acc.diff) : "") + '">' + (c.acc ? fmtDK(c.acc.diff) : "\u2013") + "</td>",
      tt: () => '<td class="num diff-cell ' + (tAcc ? clsSign(tAcc.diff) : "") + '">' + (tAcc ? fmtDK(tAcc.diff) : "\u2013") + "</td>" });
    C.push({ id: "diffPct", label: "\u51c6\u786e\u7387%", thCls: "diff-h", thTitle: "\u9884\u4f30\u51c6\u786e\u7387 = 1 \u2212 |\u5b9e\u9645\u2212\u9884\u4f30| \u00f7 \u5b9e\u9645", sv: c => c.acc ? c.acc.acc : null,
      td: c => '<td class="num diff-cell ' + (c.acc ? accCls(c.acc.acc) : "") + '">' + (c.acc ? fmtPct(c.acc.acc) : "\u2013") + "</td>",
      tt: () => '<td class="num diff-cell ' + (tAcc ? accCls(tAcc.acc) : "") + '">' + (tAcc ? fmtPct(tAcc.acc) : "\u2013") + "</td>" });
  }

  /* 解析列顺序: 用户拖过的顺序优先, 新出现的列插回默认相对位置 */
  const defIds = C.map(c => c.id);
  let order;
  if (Array.isArray(d.colOrder) && d.colOrder.length) {
    order = d.colOrder.filter(id => defIds.includes(id));
    for (const id of defIds) if (!order.includes(id)) {
      const di = defIds.indexOf(id); let pos = 0;
      for (let k = di - 1; k >= 0; k--) { const p = order.indexOf(defIds[k]); if (p >= 0) { pos = p + 1; break; } }
      order.splice(pos, 0, id);
    }
  } else order = defIds.slice();
  order = ["dim", ...order.filter(id => id !== "dim")];
  const colsArr = order.map(id => C.find(c => c.id === id));

  /* 排序: 点击表头切换 降序→升序→默认 */
  let comp2 = comp;
  const sCol = d.sort ? colsArr.find(c => c.id === d.sort.id) : null;
  if (sCol) {
    const dir = d.sort.dir === "asc" ? 1 : -1;
    comp2 = comp.slice().sort((x, y) => {
      const va = sCol.sv(x), vb = sCol.sv(y);
      if (va == null && vb == null) return 0;
      if (va == null) return 1;
      if (vb == null) return -1;
      if (typeof va === "string" || typeof vb === "string") return String(va).localeCompare(String(vb), "zh") * dir;
      return (va - vb) * dir;
    });
  }

  html += '<div class="card"><div class="card-h"><h3>' + dimDefs[d.dim].name + ' \u6c47\u603b <span class="hint">(' + (isAmt ? "\u5343\u5143" : "\u6570\u91cf") + (verMeta ? " \xb7 \u5bf9\u6bd4 " + esc(verMeta.label) : "") + ' \xb7 \u671f\u95f4: ' + pShort + (isMgrView() ? ' \xb7 \u542b\u7ba1\u7406\u8c03\u6574\u540e\u6700\u7ec8\u6570' : ' \xb7 \u672c\u4eba\u539f\u59cb\u63d0\u4ea4') + ')</span></h3><span class="hint">\u70b9\u51fb\u884c\u5c55\u5f00\u660e\u7ec6\u4e0e\u5907\u6ce8 \xb7 \u70b9\u8868\u5934\u6392\u5e8f \xb7 \u62d6\u8868\u5934\u6362\u5217 \xb7 \u62d6\u5217\u7f18\u8c03\u5bbd</span><label style="font-size:12px;display:flex;align-items:center;gap:4px;margin-left:auto"><input type="checkbox" id="show-m"' + (d.months ? " checked" : "") + ">显示月度列</label></div>" + '<div class="twrap"><table class="dt" id="dash-main"><thead><tr>';
  for (const c of colsArr) {
    const isSorted = d.sort && d.sort.id === c.id;
    html += '<th class="' + (c.thCls || "") + ' sortable' + (isSorted ? " sorted" : "") + '" data-cid="' + c.id + '"' +
      (c.fixed ? "" : ' draggable="true"') + (c.thSty ? ' style="' + c.thSty + '"' : "") +
      ' title="' + (c.thTitle || "\u70b9\u51fb\u6392\u5e8f \xb7 \u62d6\u62fd\u6362\u5217\u987a\u5e8f \xb7 \u62d6\u53f3\u7f18\u8c03\u5217\u5bbd") + '">' + c.label +
      '<span class="sort-ico">' + (isSorted ? (d.sort.dir === "asc" ? "\u25b2" : "\u25bc") : "\u21c5") + "</span></th>";
  }
  html += "</tr></thead><tbody>";
  for (const c0 of comp2) {
    html += '<tr class="dash-row" data-dim="' + esc(c0.r.dim) + '" style="cursor:pointer">';
    for (const c of colsArr) html += c.td(c0);
    html += "</tr>";
    if (d.open.has(c0.r.dim)) html += dashDetail(c0.r, ver, isAmt, d, dp, colsArr.length);
  }
  html += '<tr class="total-row">';
  for (const c of colsArr) html += c.tt();
  html += "</tr></tbody></table></div></div>";

  /* 备注墙 */
  const allRm = entries.filter(e => e.rm);
  const allowReps = new Set(scopeReps());
  const overalls = [...S.fcs.values()].filter(x => x.overall && allowReps.has(x.rep) && (!d.rsm || (S.repInfo.get(x.rep) || {}).rsm === d.rsm));
  html += '<div class="card"><div class="card-h"><h3>\ud83d\udcdd \u5907\u6ce8\u6c47\u603b <span class="hint">' + allRm.length + " \u6761\u884c\u5907\u6ce8 \xb7 " + overalls.length + " \u6761\u6574\u4f53\u8bf4\u660e \u2014 \u5907\u6ce8\u6c38\u8fdc\u8ddf\u968f\u6570\u636e\u884c,\u5207\u6362\u7ef4\u5ea6\u4e0d\u4f1a\u9519\u4f4d</span></h3></div><div>";
  for (const x of overalls) html += '<div class="rm-li"><span class="who">\u3010\u6574\u4f53\u3011' + esc(x.rep) + "</span>" + esc(x.overall) + "</div>";
  for (const e of allRm.sort((a, b) => b.fy - a.fy)) {
    const pe = calcEntryPeriod(e, dp);
    const vfy0 = verPeriodFy(verRowOf(ver, e.key), e.key, getPeriodMonths(dp)); const dlt = vfy0 === null ? null : pe.fy - vfy0;
    html += '<div class="rm-li"><span class="who">' + esc(e.rep) + " \xb7 " + esc(e.prov) + " \xb7 <b>" + esc(e.grp) + "</b></span>" + esc(e.rm) +
      ' <span class="num" style="color:var(--mute);font-size:11px">(' + pShort + ' ' + fmtK(pe.fy) + "K" + (dlt !== null ? ' \xb7 vs\u4e0a\u7248 <span class="' + clsSign(dlt) + '">' + fmtDK(dlt) + "</span>" : "") + ")</span></div>";
  }
  if (!allRm.length && !overalls.length) html += '<div class="empty">\u6682\u65e0\u5907\u6ce8</div>';
  html += "</div></div>";

  /* \u7ba1\u7406\u5907\u6ce8\u6c47\u603b */

  for (const dk of Object.keys(dimDefs)) {
    const vals = [...new Set(entries.map(e => dimDefs[dk].f(e)))].filter(Boolean).sort((a, b) => a.localeCompare(b, "zh"));
    for (const v of vals) {
