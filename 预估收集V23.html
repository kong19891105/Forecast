    }
  }
  for (const e of entries) {
    const cmt = getDashComment("entry|" + e.key);
    if (cmt) mgrComments.push({ type: "\u660e\u7ec6", name: e.rep + " \xb7 " + e.prov + " \xb7 " + e.grp, cmt });
  }
  if (mgrComments.length) {
    html += '<div class="card"><div class="card-h"><h3>\ud83d\udc68\u200d\ud83d\udcbc \u7ba1\u7406\u5907\u6ce8\u6c47\u603b <span class="hint">' + mgrComments.length + " \u6761\u7ba1\u7406\u5907\u6ce8</span></h3></div><div>";
    for (const mc of mgrComments) html += '<div class="rm-li"><span class="who">[' + esc(mc.type) + "] " + esc(mc.name) + "</span>" + esc(mc.cmt) + "</div>";
    html += "</div></div>";
  }

  host.innerHTML = html;
  /* events */
  $("#dim-seg").onclick = e => { const b = e.target.closest("button"); if (b) { d.dim = b.dataset.d; d.open.clear(); d.drillFilters = {}; renderDash(); } };
  $("#met-seg").onclick = e => { const b = e.target.closest("button"); if (b) { d.metric = b.dataset.m; renderDash(); } };
  $("#dash-period-seg").onclick = e => { const b = e.target.closest("button"); if (b && b.dataset.p) { if (b.dataset.p === "YTD") { if (!d.period.startsWith("YTD")) d.period = "YTD-12"; } else { d.period = b.dataset.p; } renderDash(); } };
  if ($("#dash-ytd")) $("#dash-ytd").onchange = e => { d.period = "YTD-" + e.target.value; renderDash(); };
  $("#rsm-f").onchange = e => { d.rsm = e.target.value; renderDash(); };

  $$(".dash-row").forEach(tr => tr.onclick = ev => { if (ev.target.closest("input")) return; const k = tr.dataset.dim; d.open.has(k) ? d.open.delete(k) : d.open.add(k); renderDash(); });

    const trigger = $("#ms-trigger-" + dk);
    const txtEl = trigger.querySelector(".ms-trigger-txt") || trigger;
    const panel = wrap.querySelector(".ms-panel");
    const dimShort = dimDefs[dk].name.replace("维度", "");
    
    trigger.onclick = e => {
      e.stopPropagation();
      const isOpen = wrap.classList.contains("open");
      $$(".ms-wrap").forEach(w => w.classList.remove("open"));
      if (!isOpen) wrap.classList.add("open");
    };
    
    panel.onclick = e => {
      e.stopPropagation();
      const allCb = panel.querySelector('input[data-all="' + dk + '"]');
      const itemCbs = [...panel.querySelectorAll('input[data-dk="' + dk + '"]')];
      
      if (e.target === allCb || e.target.closest('label') === allCb.closest('label')) {
        if (allCb.checked) {
          itemCbs.forEach(cb => cb.checked = false);
          d.drillFilters[dk] = [];
        }
      } else {
        const checked = itemCbs.filter(cb => cb.checked).map(cb => cb.value);
        allCb.checked = !checked.length;
        d.drillFilters[dk] = checked;
      }
      
      const selected = d.drillFilters[dk] || [];
      wrap.classList.toggle("active", selected.length > 0);
      txtEl.textContent = selected.length ? (selected.length === 1 ? selected[0] : dimShort + ' · 已选 ' + selected.length) : '全部' + dimShort;
    };
  }
  
  /* document click：关闭面板并刷新 */
  if (S._dashClickHandler) document.removeEventListener("click", S._dashClickHandler);
  S._dashClickHandler = function(e) {
    if (S.tab !== "dash") return;
    if (!e.target.closest(".ms-wrap")) {
      const wasOpen = $$("#tab-dash .ms-wrap.open").length > 0;
      $$("#tab-dash .ms-wrap").forEach(w => w.classList.remove("open"));
      if (wasOpen) renderDash();
    }
  };
  document.addEventListener("click", S._dashClickHandler);
  
  if ($("#drill-clear")) $("#drill-clear").onclick = () => { d.drillFilters = {}; renderDash(); };
  
  /* 表头: 点击排序 + 拖拽换列 */

    $$('input[data-mgr-rm]').forEach(inp => {

  $$("#dash-main > thead th").forEach(th => {
    const cid = th.dataset.cid;
    th.onclick = e => {
      if (e.target.closest(".resize-handle")) return;
      if (d.sort && d.sort.id === cid) d.sort = d.sort.dir === "desc" ? { id: cid, dir: "asc" } : null;
      else d.sort = { id: cid, dir: "desc" };
      renderDash();
    };
    th.addEventListener("dragstart", e => {
      if (cid === "dim") { e.preventDefault(); return; }
      S._dragCol = cid;
      e.dataTransfer.setData("text/plain", cid);
      e.dataTransfer.effectAllowed = "move";
      requestAnimationFrame(() => th.classList.add("dragging-col"));
    });
    th.addEventListener("dragend", () => {
      S._dragCol = null;
      $$("#dash-main > thead th").forEach(t => t.classList.remove("dragging-col", "drop-before", "drop-after"));
    });
    th.addEventListener("dragover", e => {
      if (!S._dragCol || cid === S._dragCol || cid === "dim") return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      const rc = th.getBoundingClientRect();
      const before = e.clientX < rc.left + rc.width / 2;
      th.classList.toggle("drop-before", before);
      th.classList.toggle("drop-after", !before);
    });
    th.addEventListener("dragleave", () => th.classList.remove("drop-before", "drop-after"));
    th.addEventListener("drop", e => {
      e.preventDefault();
      const srcId = S._dragCol || e.dataTransfer.getData("text/plain");
      if (!srcId || srcId === cid || cid === "dim") return;
      const rc = th.getBoundingClientRect();
      const before = e.clientX < rc.left + rc.width / 2;
      const ord = order.filter(id => id !== srcId);
      ord.splice(ord.indexOf(cid) + (before ? 0 : 1), 0, srcId);
      d.colOrder = ["dim", ...ord.filter(id => id !== "dim")];
      S._dragCol = null;
      renderDash();
    });
  });

  /* 列宽拖拽初始化(可调宽并记忆) */
  requestAnimationFrame(() => initResizableTable($("#dash-main"), "dash"));
}

function monthChart(blend, aop, ly) {
  const W = 1180, H = 150, pad = 34, bw = 30;
  /* pattern id 必须全文档唯一:填写页/看板页同时存在图表时,重复 id 会让
     预估柱引用到隐藏 tab 里的 pattern,导致斜纹不显示、与图例不一致 */
  const pid = "hat" + (monthChart._n = (monthChart._n || 0) + 1);
  // 防御: 清理 NaN/undefined, 确保 max 有效
  const clean = arr => arr.map(v => isFinite(v) ? v : 0);
  const blendC = clean(blend), aopC = clean(aop), lyC = clean(ly);
  let max = Math.max(...blendC, ...aopC, ...lyC, 1) * 1.12;
  if (!isFinite(max) || max <= 0) max = 1;
  const x = i => pad + i * ((W - pad * 2) / 12) + 18;
  const y = v => H - 26 - ((isFinite(v) ? v : 0) / max) * (H - 44);
  const actSet = new Set((S.cfg && S.cfg.actMonths) || []);
  let s = '<div class="chartbox"><svg viewBox="0 0 ' + W + " " + H + '" width="100%" preserveAspectRatio="xMidYMid meet">' +
    '<defs><pattern id="' + pid + '" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#DCE8FF"/><line x1="0" y1="0" x2="0" y2="6" stroke="#5B8DEF" stroke-width="2.2"/></pattern></defs>';
  for (let i = 0; i < 12; i++) {
    const isAct = actSet.has(i + 1);
    s += '<rect x="' + (x(i) - bw / 2) + '" y="' + y(blendC[i]) + '" width="' + bw + '" height="' + Math.max(0, H - 26 - y(blendC[i])) + '" rx="3" fill="' + (isAct ? "#1C3257" : "url(#" + pid + ")") + '"' + (isAct ? "" : ' stroke="#5B8DEF" stroke-width="1"') + "><title>" + MN[i] + (isAct ? " 实际 " : " 预估 ") + fmtK(blendC[i]) + "K</title></rect>";
    s += '<text x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="11" fill="#7A879C">' + (i + 1) + "月</text>";
    s += '<text x="' + x(i) + '" y="' + (y(blendC[i]) - 4) + '" text-anchor="middle" font-size="9.5" fill="#3B4A63" font-family="Bahnschrift,Segoe UI">' + fmtK(blendC[i], 0) + "</text>";
  }
  let pl = "", pl2 = "";
  for (let i = 0; i < 12; i++) { pl += (i ? "L" : "M") + x(i) + "," + y(aopC[i]) + " "; pl2 += (i ? "L" : "M") + x(i) + "," + y(lyC[i]) + " "; }
  s += '<path d="' + pl2 + '" fill="none" stroke="#B9C2D2" stroke-width="1.6" stroke-dasharray="2 3"/>';
  s += '<path d="' + pl + '" fill="none" stroke="#C2362B" stroke-width="1.8"/>';
  for (let i = 0; i < 12; i++) s += '<circle cx="' + x(i) + '" cy="' + y(aopC[i]) + '" r="2.6" fill="#C2362B"><title>' + MN[i] + " AOP " + fmtK(aopC[i]) + "K</title></circle>";
  s += "</svg></div>" +
    '<div class="legend"><span><i style="background:#1C3257"></i>已关账实际</span><span><i style="background:repeating-linear-gradient(45deg,#DCE8FF 0,#DCE8FF 4px,#5B8DEF 4px,#5B8DEF 6px);border:1px solid #5B8DEF"></i>预估</span><span><i style="background:#C2362B;height:3px;margin-bottom:3px"></i>AOP 指标</span><span><i style="background:#B9C2D2;height:2px;margin-bottom:3px"></i>FY' + ((S.cfg && S.cfg.ly) || "") + ' 同期</span><span style="margin-left:auto">单位:千元 K</span></div>';
  return s;
}

function exportDashXlsx(rows, entries, ver, verMeta) {

  const wb = XLSX.utils.book_new();
  const K = v => Math.round(v / 100) / 10; // 千元1位
  const P = v => v === null || !isFinite(v) ? null : Math.round(v * 1000) / 10; // %1位
  const d = S.dash;
  const dp = d.period || "FY";
  const msX = getPeriodMonths(dp);
  const pS = periodShort(dp);
  const actSetX = new Set(S.cfg.actMonths || []);
  const head1 = [dimDefs[d.dim].name, "YTD Ach%", pS + "预估K", pS + " AOP K", "Ach%", "预估差异K", "预估准确率%", "上版" + pS + " K", "Δ" + pS + " K", "ΔAch pp", "填写进度%", "备注条数", "管理备注"];
  const aoa1 = [["周期", S.cfg.cycleLabel, "期间", pS, "导出时间", new Date().toLocaleString("zh-CN"), verMeta ? "对比版本:" + verMeta.label : "无版本对比"], head1];
  const vRoll = ver ? rollupVer(ver, d.dim, d.rsm, msX, makeDashVerPred(d)) : null;
  for (const r of rows) {
    let rFy = 0, rAop = 0, rLy = 0, ytdAct = 0, ytdAop = 0;
    for (const i of msX) { rFy += r.m[i]; rAop += r.aopA[i]; rLy += r.lyA[i]; if (actSetX.has(i + 1)) { ytdAct += r.m[i]; ytdAop += r.aopA[i]; } }
    const ach = rAop > 0 ? rFy / rAop : null, gr = rLy > 0 ? rFy / rLy - 1 : null;
    const vr = vRoll ? vRoll.get(r.dim) : null;
    const vach = vr && rAop > 0 ? vr.fy / rAop : null, vgr = vr && rLy > 0 ? vr.fy / rLy - 1 : null;
    const rAcc = ver ? calcVerAccuracyForItems(r.items, ver, msX) : null;
    aoa1.push([r.dim, P(ytdAop > 0 ? ytdAct / ytdAop : null), K(rFy), K(rAop), P(ach),
      rAcc ? K(rAcc.diff) : null, rAcc ? P(rAcc.acc) : null,
      vr ? K(vr.fy) : null, vr ? K(rFy - vr.fy) : null,
      ach !== null && vach !== null ? P(ach - vach) : null,

  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa1), "汇总-" + dimDefs[d.dim].name.slice(0, 4));
  /* 明细 */
  const aoa2 = [["RSM", "DSM", "代表", "省份", "产品组", ...MN.map((m, i) => m + (new Set(S.cfg.actMonths).has(i + 1) ? "Act" : "FCST") + " K"), "FY预估K", "FY AOP K", "Ach%", "预估差异K", "预估准确率%", "上版FY K", "ΔFY K", "FY代表原始K", "管理调整月数", "备注", "管理备注"]];
  for (const e of entries.slice().sort((a, b) => a.rsm.localeCompare(b.rsm, "zh") || a.rep.localeCompare(b.rep, "zh") || b.fy - a.fy)) {
    const vr = verRowOf(ver, e.key);
    const eAcc = ver ? calcVerAccuracyForItems([e], ver, msX) : null;
    aoa2.push([e.rsm, e.dsm, e.rep, e.prov, e.grp, ...e.m.map(c => K(c.a)),
      K(e.fy), K(e.aop), P(e.aop > 0 ? e.fy / e.aop : null),
      eAcc ? K(eAcc.diff) : null, eAcc ? P(eAcc.acc) : null,
      vr ? K(vr.fy) : null, vr ? K(e.fy - vr.fy) : null,
      K(e.m.reduce((s, c, i) => s + entryRepA(e, i), 0)), e.ovCount || 0, e.rm || "", getDashComment("entry|" + e.key)]);
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa2), "全部明细");
  /* 管理调整对照: 逐月保留 代表原始提交 与 DSM/大区/管理员调整后 两个版本 */
  const aoaAdj = [["代表", "省份", "产品组", "月份", "代表原始K", "管理调整后K", "差额K"]];
  for (const e of entries) {
    if (!e.ovCount) continue;
    for (let i = 0; i < 12; i++) {
      const c = e.m[i]; if (!c || !c.ov) continue;
      const repEmpty = (c.ra == null && c.rq == null);
      const repA = repEmpty ? null : entryRepA(e, i);
      aoaAdj.push([e.rep, e.prov, e.grp, (i + 1) + "月", repA == null ? null : K(repA), K(c.a), repA == null ? K(c.a) : K(c.a - repA)]);
    }

  /* 备注 */
  const aoa3 = [["代表", "省份", "产品组", "备注", "管理备注", "本版FY K", "上版FY K", "ΔFY K"]];
  for (const e of entries.filter(x => x.rm)) { const vr = verRowOf(ver, e.key); aoa3.push([e.rep, e.prov, e.grp, e.rm, getDashComment("entry|" + e.key), K(e.fy), vr ? K(vr.fy) : null, vr ? K(e.fy - vr.fy) : null]); }
  const expAllow = new Set(scopeReps());

  /* 管理备注清单 */
  const aoa4 = [["维度", "名称", "管理备注"]];
  for (const dk of Object.keys(dimDefs)) {
    const vals = [...new Set(entries.map(e => dimDefs[dk].f(e)))].filter(Boolean).sort((a, b) => a.localeCompare(b, "zh"));
    for (const v of vals) {
      const cmt = getDashComment(dk + "|" + v);
      if (cmt) aoa4.push([dimDefs[dk].name, v, cmt]);
    }
  }
  for (const e of entries) {
    const cmt = getDashComment("entry|" + e.key);
    if (cmt) aoa4.push(["明细", e.rep + " · " + e.prov + " · " + e.grp, cmt]);
  }
  if (aoa4.length > 1) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa4), "管理备注清单");
  XLSX.writeFile(wb, "预估看板_" + S.cfg.cycleLabel + ".xlsx");
}

function openModal(title, body, footer) {
  const m = $("#modal");
  m.innerHTML = '<div class="modal-h"><b>' + title + '</b><button class="icon-btn" onclick="closeModal()">✕</button></div>' +
    '<div class="modal-b">' + body + '</div>' + (footer ? '<div class="modal-f">' + footer + '</div>' : "");
  $("#mask").classList.add("show");
}
function closeModal() { $("#mask").classList.remove("show"); }
const dt = ts => new Date(ts).toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
function stamp() { const d = new Date(); const p = n => String(n).padStart(2, "0"); return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "_" + p(d.getHours()) + p(d.getMinutes()); }
function downloadJSON(name, obj) {
  const blob = new Blob([JSON.stringify(obj)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

/* =================== 系统数据导入流程 =================== */
async function onXlsxFile(file) {
  if (typeof XLSX === "undefined") {
    openModal("无法读取 Excel", "<p>SheetJS 解析库未能加载(当前网络可能无法访问 cdnjs.cloudflare.com)。请换有外网的环境打开本工具,或让 IT 把 xlsx.full.min.js 内联进本文件。</p>", '<button class="btn pri" onclick="closeModal()">知道了</button>');
    return;
  }
  toast("正在解析 " + file.name + " …");
  try {
    const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: "array" });
    let best = null, bestScore = -1;
    for (const n of wb.SheetNames) {
      const ws = wb.Sheets[n]; if (!ws || !ws["!ref"]) continue;
      const r = XLSX.utils.decode_range(ws["!ref"]);
      const score = (r.e.r - r.s.r) + (/detail/i.test(n) ? 1e9 : 0);
      if (score > bestScore) { bestScore = score; best = n; }
    }
    if (!best) { toast("⚠ 文件里没有可用的工作表"); return; }
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[best], { defval: null })
      // 修复:部分系统导出文件给表头单元格套了「会计专用」数字格式(如 _(* #,##0.00_);…;_(@_)),
      // SheetJS 0.18 默认输出「格式化后文本」,会把表头变成「 26 Amt 」「 26 Amt AOP 」(前后各带空格)。
      // 而 detectCols 内部对表头做了 trim,识别能通过,但返回的列名是去空格的「26 Amt」,
      // 与数据行里真实的带空格键不一致 → 26 Amt / 26 Qty / 26 Amt AOP / 26 Qty AOP / 25 Amt / 25 Qty 全读成空(0)。
      // 这里在解析后统一 trim 掉每个键的前后空格,使其与 detectCols 一致。
      .map(o => { const n = {}; for (const k in o) n[String(k).trim()] = o[k]; return n; });
    if (!rows.length) { toast("⚠ 工作表「" + best + "」是空的"); return; }
    const C = detectCols(Object.keys(rows[0]));
    if (C.err) { openModal("列识别失败", "<p>" + esc(C.err) + '</p><p style="color:var(--mute);font-size:12px;word-break:break-all">检测到的表头: ' + esc(Object.keys(rows[0]).join(" | ")) + "</p>", '<button class="btn pri" onclick="closeModal()">关闭</button>'); return; }
    const agg = aggregateRows(rows, C);
    if (!agg.rows.length) { toast("⚠ 没有解析到任何有效数据行"); return; }
    S.pendingImport = { fileName: file.name, sheet: best, C, agg };
    openImportPreview();
  } catch (err) { console.error(err); openModal("解析失败", "<p>" + esc(err && err.message || String(err)) + "</p>", '<button class="btn pri" onclick="closeModal()">关闭</button>'); }
}

async function commitImport() {

async function exportRepFile() {

/* 单个代表 doc 的合并(JSON 与 Excel 两条导入路径共用):按 updatedAt 去重,本机更新则跳过 */
async function mergeRepDoc(doc) {
  if (!doc || !doc.rep) return "bad";
  if (!doc.rows) doc.rows = {};
  if (!doc.updatedAt) doc.updatedAt = Date.now();
  const old = S.fcs.get(doc.rep);
  if (old && (old.updatedAt || 0) >= (doc.updatedAt || 0)) return "skip";
  S.fcs.set(doc.rep, doc);
  const ok = await Store.set("fc-f-" + doc.rep, doc);
  return ok ? "ok" : "bad";
}
async function importRepFiles(files) {
  let ok = 0, skip = 0, bad = 0;
  for (const f of files) {
    try {
      const d = JSON.parse(await f.text());
      const doc = d && d.kind === "fc-rep" && d.doc;
      const r = await mergeRepDoc(doc);
      if (r === "ok") ok++; else if (r === "skip") skip++; else bad++;
    } catch (e) { bad++; }
  }
  rerender();
  toast("合并完成: 更新 " + ok + " 人" + (skip ? " · 跳过 " + skip + "(本机更新)" : "") + (bad ? " · 失败 " + bad : ""));
}

/* =================== 代表预估 Excel 导入(管理员多选合并) =================== */
/* 1) 优先读隐藏 _FCDATA(无损);2) 没有则从可见表按 代表+省份+产品组 还原 */
function readEmbeddedRepDoc(wb) {
  const name = wb.SheetNames.find(n => /_FCDATA/i.test(n));
  if (!name) return null;
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: "" });
  if (!aoa.length || String(aoa[0][0] || "").trim() !== "FC-REP-V1") return null;
  const n = parseInt(aoa[0][1]) || (aoa.length - 1);
  let s = "";
  for (let i = 1; i <= n && i < aoa.length; i++) s += (aoa[i][0] == null ? "" : String(aoa[i][0]));
  try { const d = JSON.parse(s); return (d && d.doc) ? d.doc : (d && d.rep ? d : null); } catch (e) { return null; }
}
function reconstructRepDocsFromSheet(wb, file) {
  const qtySet = new Set((S.cfg && S.cfg.qtyGroups) || []);
  const norm = s => String(s == null ? "" : s).trim();
  const monthIdxOf = h => {
    const t = norm(h);
    let m = t.match(/^(\d{1,2})\s*月?$/); if (m) { const k = +m[1]; if (k >= 1 && k <= 12) return k - 1; }
    const mn = MN.indexOf(t); if (mn >= 0) return mn;
    const en = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"].indexOf(t.slice(0, 3).toLowerCase());
    if (en >= 0) return en;
    return -1;
  };
  const docs = new Map();
  for (const sn of wb.SheetNames) {
    if (/_FCDATA/i.test(sn)) continue;
    const ws = wb.Sheets[sn]; if (!ws || !ws["!ref"]) continue;
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
    if (!aoa.length) continue;
    // 找表头行:含 省份 与 产品组 两类列
    let hr = -1, col = {};
    for (let r = 0; r < Math.min(aoa.length, 8); r++) {
      const row = aoa[r].map(norm), c = {};
      row.forEach((h, i) => {
        if (/^(代表|rep|销售代表)$/i.test(h)) c.rep = i;
        else if (/^(省份|省|province)$/i.test(h)) c.prov = i;
        else if (/(产品组|product\s*line|prod\s*group|^group$|^产品$|for\s*预估)/i.test(h)) c.grp = i;
        else if (/(备注|说明|remark|note)/i.test(h)) c.rm = i;
        else { const mi = monthIdxOf(h); if (mi >= 0) { c.m = c.m || {}; c.m[mi] = i; } }
      });
      if (c.prov != null && c.grp != null && c.m && Object.keys(c.m).length) { hr = r; col = c; break; }
    }
    if (hr < 0) continue;
    // 兜底代表名:文件名 预估_姓名_时间.xlsx
    let fileRep = "";
    const fn = (file && file.name || "").replace(/\.(xlsx|xls)$/i, "");
    let fm = fn.match(/^预估[_\s]+(.+?)[_\s]+\d{6,}/); if (fm) fileRep = fm[1];
    for (let r = hr + 1; r < aoa.length; r++) {
      const row = aoa[r];
      const prov = norm(row[col.prov]), grp = norm(row[col.grp]);
      if (!prov || !grp) continue;
      const rep = (col.rep != null ? norm(row[col.rep]) : "") || fileRep;
      if (!rep) continue;
      let doc = docs.get(rep);
      if (!doc) { doc = { rep, updatedAt: (file && file.lastModified) || Date.now(), overall: "", rows: {} }; docs.set(rep, doc); }
      const key = rowKey(rep, prov, grp);
      const qm = qtySet.has(grp);
      const cell = doc.rows[key] || { a: Array(12).fill(null), q: Array(12).fill(null), rm: "" };
      for (const mi in col.m) {
        const raw = norm(row[col.m[mi]]);
        if (raw === "" || raw === "(实际)") continue;
        const v = parseFloat(raw.replace(/,/g, "")); if (!isFinite(v)) continue;
        if (qm) cell.q[+mi] = v; else cell.a[+mi] = v;
      }
      if (col.rm != null) { const rm = norm(row[col.rm]); if (rm) cell.rm = rm; }
      doc.rows[key] = cell;
    }
  }
  return [...docs.values()].filter(d => Object.keys(d.rows).length);
}
async function importRepXlsxFiles(files) {
  if (typeof XLSX === "undefined") { toast("Excel 组件未加载(需联网加载一次)"); return; }
  let ok = 0, skip = 0, bad = 0, recon = 0;
  for (const f of files) {
    try {
      const wb = XLSX.read(new Uint8Array(await f.arrayBuffer()), { type: "array" });
      let docs = []; const emb = readEmbeddedRepDoc(wb);
      if (emb && emb.rep) docs = [emb];
      else { docs = reconstructRepDocsFromSheet(wb, f); recon += docs.length; }
      if (!docs.length) { bad++; continue; }
      for (const doc of docs) { const r = await mergeRepDoc(doc); if (r === "ok") ok++; else if (r === "skip") skip++; else bad++; }
    } catch (e) { console.error("importRepXlsxFiles:", e); bad++; }
  }
  rerender();
  toast("Excel 合并完成: 更新 " + ok + " 人" + (skip ? " · 跳过 " + skip + "(本机更新)" : "") + (recon ? " · 兼容还原 " + recon : "") + (bad ? " · 失败 " + bad : ""));
}

/* =================== 管理调整数据的清除(按人员/产品/省份) =================== */
/* 返回真正含有调整(至少一个非空格)的 key 列表; key = rep|prov|grp */
function mgrAdjKeys() {
  const out = [];
  if (!S.mgr || !S.mgr.rows) return out;
  for (const k in S.mgr.rows) {
    const c = S.mgr.rows[k];
    const has = (c && c.a && c.a.some(v => v != null)) || (c && c.q && c.q.some(v => v != null));
    if (has) out.push(k);
  }
  return out;
}
/* 某格数 = 非空的 a 格 + 非空的 q 格 */
function mgrCellCount(c) {
  return ((c && c.a) ? c.a.filter(v => v != null).length : 0) + ((c && c.q) ? c.q.filter(v => v != null).length : 0);
}
/* 按维度(rep/prov/grp)汇总各取值的调整行数与格数 */
function mgrDimValues(dim) {
  const ix = dim === "rep" ? 0 : dim === "prov" ? 1 : 2;
  const m = new Map();
  for (const k of mgrAdjKeys()) {
    const v = k.split("|")[ix] || "(空)";
    const o = m.get(v) || { rows: 0, cells: 0 };
    o.rows++; o.cells += mgrCellCount(S.mgr.rows[k]); m.set(v, o);
  }
  return m;
}
/* 执行清除: value 为 "__ALL__" 则清除全部;否则清除该维度匹配的 key */
async function clearMgrBy(dim, value) {
  if (!S.mgr || !S.mgr.rows) return 0;
  const ix = dim === "rep" ? 0 : dim === "prov" ? 1 : 2;
  let removed = 0;
  for (const k of Object.keys(S.mgr.rows)) {
    if (value === "__ALL__" || (k.split("|")[ix] || "(空)") === value) { delete S.mgr.rows[k]; removed++; }
  }
  clearTimeout(_mgrTimer); _mgrTimer = null;
  S.mgr.updatedAt = Date.now();
  const ok = await Store.set("fc-mgr", S.mgr);
  S._mgrDirty = false;
  return ok ? removed : -1;
}
function openClearMgr() {
  const keys = mgrAdjKeys();
  if (!keys.length) { toast("当前没有任何管理调整数据"); return; }
  const totalCells = keys.reduce((s, k) => s + mgrCellCount(S.mgr.rows[k]), 0);
  const dimName = { rep: "人员(代表)", prov: "省份", grp: "产品组" };
  const buildOpts = dim => {
    const arr = [...mgrDimValues(dim).entries()].sort((a, b) => a[0].localeCompare(b[0], "zh"));
    return '<option value="__ALL__">— 全部(清除所有管理调整 · 共 ' + keys.length + ' 行 / ' + totalCells + ' 格)—</option>' +
      arr.map(([v, o]) => '<option value="' + esc(v) + '">' + esc(v) + "(" + o.rows + " 行 / " + o.cells + " 格)</option>").join("");
  };
  const body = '<p style="font-size:13px;color:var(--ink2);line-height:1.6">清除 DSM / RSM / 管理员做过的<b>管理调整</b>(填写页橙色格)。清除后这些行恢复为<b>代表的原始提交</b>。<b style="color:var(--red)">代表原始数据、系统实际数与 AOP 均不受影响。</b></p>' +
    '<div class="field" style="margin-top:10px"><label>按维度清除</label><div class="seg" id="cm-dim" style="display:inline-flex"><button data-d="rep" class="on">按人员</button><button data-d="grp">按产品组</button><button data-d="prov">按省份</button></div></div>' +
    '<div class="field" style="margin-top:10px"><label>选择要清除的对象</label><select class="ctrl" id="cm-val" style="width:100%">' + buildOpts("rep") + "</select></div>" +
    '<p style="color:var(--mute);font-size:12px;margin-top:8px">提示:括号内为该对象当前的管理调整规模(行数 / 月度格数)。此操作不可撤销,但可重新做调整。</p>';
  openModal("🧹 清除管理调整数据", body, '<button class="btn" onclick="closeModal()">取消</button><button class="btn danger" id="cm-ok">清除</button>');
  let dim = "rep";
  $$("#cm-dim [data-d]").forEach(b => b.onclick = () => {
    $$("#cm-dim [data-d]").forEach(x => x.classList.remove("on")); b.classList.add("on");
    dim = b.dataset.d; $("#cm-val").innerHTML = buildOpts(dim);
  });
  $("#cm-ok").onclick = async () => {
    const val = $("#cm-val").value;
    const label = val === "__ALL__" ? "全部管理调整" : (dimName[dim] + "「" + val + "」");
    closeModal(); toast("正在清除 …");
    const n = await clearMgrBy(dim, val);
    if (n < 0) { toast("⚠ 清除失败,请重试"); return; }
    rerender();
    toast(n ? "已清除 " + label + ":移除 " + n + " 行管理调整,恢复代表原值" : "没有匹配的管理调整");
  };
}

/* =====================================================================
   ④ 管理报表模块
   按 产品/省份/代表/地区(DSM)/大区(RSM) 维度,横向展示
   Q1 Q2 Q3 Q4 H1 H2 及 YTD(可任意选截止月) 的「预估值 / 达成率 / 增长率」。
   达成率 / 增长率 的配色与形状符号与「数据看板」完全一致(achSymHtml + clsAch/clsSign)。
   ===================================================================== */
function renderReport() {
  const host = $("#tab-report");
  if (!S.master || !S.cfg) { host.innerHTML = '<div class="card"><div class="empty"><b>还没有数据</b>请先在「管理后台」导入系统导出文件。</div></div>'; return; }
  const r = S.report;
  // YTD 默认截止月: 取最大关账月, 无则 12 (与看板"任意选 YTD 月份"一致, 用户可改)
  if (!r.ytdN) { const am = (S.cfg.actMonths || []); r.ytdN = am.length ? Math.max(...am) : 12; }
  if (!dimDefs[r.dim]) r.dim = "grp";
  if (!r.drillFilters) r.drillFilters = {};
  if (!Array.isArray(r.hidePeriods)) r.hidePeriods = [];
  if (r.dataMode !== "rep") r.dataMode = "mgr";

  /* —— 口径 / 数据来源 —— */
  const isAmt = r.metric !== "qty";
  const mArr = isAmt ? "m" : "mq", aopArr = isAmt ? "aopA" : "aopQ2", lyArr = isAmt ? "lyA" : "lyQ2";
  const vK = isAmt ? fmtK : fmtQ;
  const rawOnly = r.dataMode === "rep";                 // 代表填写: 不套用管理调整层
  /* 数据来源开关: 代表填写(原始) vs 管理调整后(最终) */
  const repScoped = () => buildEntries(rawOnly).filter(inScope);

  /* 维度下钻筛选(与数据看板一致): 当前维度 + 其它维度都可多选下钻, 选项随其它筛选联动 */
  const filterDims = [r.dim, ...Object.keys(dimDefs).filter(k => k !== r.dim)];
  const applyDrill = es => { for (const dk of filterDims) { const fv = r.drillFilters[dk]; if (fv && fv.length) es = es.filter(e => fv.includes(dimDefs[dk].f(e))); } return es; };
  let entries = applyDrill(repScoped());

  /* 级联清理: 去掉在其它筛选条件下已不存在的已选值 */
  let cleaned = false;
  for (const dk of filterDims) {
    let base = repScoped();
    for (const otherDk of filterDims) if (otherDk !== dk && r.drillFilters[otherDk] && r.drillFilters[otherDk].length) base = base.filter(e => r.drillFilters[otherDk].includes(dimDefs[otherDk].f(e)));
    const valid = new Set(base.map(e => dimDefs[dk].f(e)).filter(Boolean));
    const sel = r.drillFilters[dk] || [];
    const vsel = sel.filter(v => valid.has(v));
    if (vsel.length !== sel.length) { r.drillFilters[dk] = vsel; cleaned = true; }
  }
  if (cleaned) entries = applyDrill(repScoped());

  const rows = rollup(entries, dimDefs[r.dim].f);   // rollup 默认按 AOP 降序
  if (r.dim === "grp") rows.sort((a, b) => grpSortKey(a.dim).localeCompare(grpSortKey(b.dim))); // 产品维度: 与数据看板一致, 按固定产品顺序排序

  // 报表期间: 四个季度 + 上下半年 + YTD(截止月可选) — 可被「显示期间」筛选器隐藏
  const allPeriods = [
    { key: "Q1", label: "Q1", mKey: "Q1" }, { key: "Q2", label: "Q2", mKey: "Q2" },
    { key: "Q3", label: "Q3", mKey: "Q3" }, { key: "Q4", label: "Q4", mKey: "Q4" },
    { key: "H1", label: "H1", mKey: "H1" }, { key: "H2", label: "H2", mKey: "H2" },
    { key: "YTD", label: "YTD" + r.ytdN, mKey: "YTD-" + r.ytdN }
  ];
  const periods = allPeriods.filter(p => !r.hidePeriods.includes(p.key));

  // 按期间月份汇总当前口径(金额/数量)的 预估/AOP/去年
  const calc = (o, mKey) => {
    let fy = 0, aop = 0, ly = 0;
    for (const i of getPeriodMonths(mKey)) { fy += o[mArr][i] || 0; aop += o[aopArr][i] || 0; ly += o[lyArr][i] || 0; }
    return { fy, aop, ly, ach: aop > 0 ? fy / aop : null, gr: ly > 0 ? (fy - ly) / ly : null };
  };
  // 合计(对全部行的月度数组求和, 两种口径都备好)
  const tot = { m: zeros(), mq: zeros(), aopA: zeros(), aopQ2: zeros(), lyA: zeros(), lyQ2: zeros() };
  for (const o of rows) for (let i = 0; i < 12; i++) {
    tot.m[i] += o.m[i] || 0; tot.mq[i] += o.mq[i] || 0;
    tot.aopA[i] += o.aopA[i] || 0; tot.aopQ2[i] += o.aopQ2[i] || 0;
    tot.lyA[i] += o.lyA[i] || 0; tot.lyQ2[i] += o.lyQ2[i] || 0;
  }

  /* —— 排序: 点击任意列表头, 降序 → 升序 → 默认 —— */
  const sortVal = (o, cid) => {
    if (cid === "dim") return o.dim;
    const dot = cid.lastIndexOf(".");
    const pk = cid.slice(0, dot), field = cid.slice(dot + 1);
    const p = allPeriods.find(x => x.key === pk);
    if (!p) return null;
    return calc(o, p.mKey)[field];
  };
  let sortedRows = rows.slice();
  if (r.sort) {
    const dir = r.sort.dir === "asc" ? 1 : -1, sid = r.sort.id;
    sortedRows.sort((x, y) => {
      const va = sortVal(x, sid), vb = sortVal(y, sid);
      if (va == null && vb == null) return 0;
      if (va == null) return 1;
      if (vb == null) return -1;
      if (typeof va === "string" || typeof vb === "string") return String(va).localeCompare(String(vb), "zh") * dir;
      return (va - vb) * dir;
    });
  }

  // 三联单元格: 预估值 / 达成率(带形状符号) / 增长率
  const cells3 = c =>
    '<td class="num" style="border-left:2px solid var(--line)">' + vK(c.fy) + '</td>' +
    '<td class="num ' + clsAch(c.ach) + '">' + achSymHtml(c.ach) + fmtPct(c.ach) + '</td>' +
    '<td class="num ' + clsSign(c.gr) + '">' + fmtPct(c.gr) + '</td>';
  const sortIco = cid => '<span class="sort-ico">' + (r.sort && r.sort.id === cid ? (r.sort.dir === "asc" ? "\u25b2" : "\u25bc") : "\u21c5") + '</span>';
  const lbl = t => '<div style="font-size:11.5px;color:var(--mute);font-weight:600;margin-bottom:4px">' + t + '</div>';

  // —— 控制条 ——
  let h = '<div class="card"><div class="card-h"><b>管理报表</b><span class="hint">按维度查看各期间「预估值 / 达成率 / 增长率」</span></div><div style="padding:12px 16px 14px">';
  h += '<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end">';
  // 维度
  h += '<div>' + lbl("维度") + '<div class="seg" id="rep-dim-seg">' +
    Object.keys(dimDefs).map(k => '<button data-d="' + k + '" class="' + (r.dim === k ? "on" : "") + '">' + dimDefs[k].name + "</button>").join("") + "</div></div>";
  // 金额 K / 数量 切换器(与数据看板一致)
  h += '<div>' + lbl("口径") + '<div class="seg" id="rep-met-seg">' +
    '<button data-m="amt" class="' + (isAmt ? "on" : "") + '">金额 K</button>' +
    '<button data-m="qty" class="' + (!isAmt ? "on" : "") + '">数量</button></div></div>';
  // 代表填写 / 管理调整后 切换器
  h += '<div>' + lbl("数据来源") + '<div class="seg" id="rep-data-seg">' +
    '<button data-md="mgr" class="' + (!rawOnly ? "on" : "") + '">管理调整后</button>' +
    '<button data-md="rep" class="' + (rawOnly ? "on" : "") + '">代表填写</button></div></div>';
  // 显示期间(时间筛选器)
  h += '<div>' + lbl("显示期间") + '<div class="seg" id="rep-period-seg">' +
    allPeriods.map(p => '<button data-p="' + p.key + '" class="' + (!r.hidePeriods.includes(p.key) ? "on" : "") + '">' + p.key + "</button>").join("") + "</div></div>";
  // YTD 截止月
  h += '<div>' + lbl("YTD 截止月份") + '<select class="ctrl" id="rep-ytd" style="width:120px">' +
    MN.map((m, i) => '<option value="' + (i + 1) + '"' + (r.ytdN === i + 1 ? " selected" : "") + ">截至 " + m + "</option>").join("") + "</select></div>";
  h += '</div>';
  h += '<div class="hint" style="margin-top:10px;line-height:1.7">范围:' + esc(scopeLabel()) +
    ' · 口径:<b>' + (isAmt ? "金额(千元 K)" : "数量(件)") + '</b>' +
    ' · 数据来源:<b style="color:' + (rawOnly ? "var(--blue)" : "var(--amber)") + '">' + (rawOnly ? "代表填写原始数" : "管理调整后最终数") + '</b>' +
    ' · 预估值 = 已关账月实际 + 未关账月预估</div>';
  h += '<div class="hint" style="margin-top:4px">达成率符号(与数据看板一致):' +
    achSymHtml(1.05) + '<span style="color:var(--green)">达标 ≥100%</span> &nbsp; ' +
    achSymHtml(0.9) + '<span style="color:var(--amber)">接近 80–100%</span> &nbsp; ' +
    achSymHtml(0.5) + '<span style="color:var(--red)">偏低 &lt;80%</span> · 增长率:绿=正 / 红=负 · 点击列表头可排序 · 拖列右缘可调宽</div>';

  /* —— 下钻筛选器(与数据看板一致): 当前维度标「主」, 各维度多选, 选项随其它筛选联动 —— */
  const activeDrill = filterDims.reduce((n, dk) => n + ((r.drillFilters[dk] || []).length ? 1 : 0), 0);
  h += '<div class="drillbar" style="margin-top:10px;border-radius:8px">';
  h += '<span class="drillbar-lab">▾ 下钻筛选</span>';
  for (const dk of filterDims) {
    const isCur = dk === r.dim;
    const dimShort = dimDefs[dk].name.replace("维度", "");
    let base = repScoped();
    for (const otherDk of filterDims) if (otherDk !== dk && r.drillFilters[otherDk] && r.drillFilters[otherDk].length) base = base.filter(e => r.drillFilters[otherDk].includes(dimDefs[otherDk].f(e)));
    const allVals = [...new Set(base.map(e => dimDefs[dk].f(e)))].filter(Boolean).sort((a, b) => dk === "grp" ? grpSortKey(a).localeCompare(grpSortKey(b)) : a.localeCompare(b, "zh"));
    const selected = r.drillFilters[dk] || [];
    const triggerText = selected.length ? (selected.length === 1 ? esc(selected[0]) : dimShort + " · 已选 " + selected.length) : "全部" + dimShort;
    h += '<div class="ms-wrap' + (isCur ? " primary" : "") + (selected.length ? " active" : "") + '" id="rms-wrap-' + dk + '" data-dk="' + dk + '">';
    h += '<div class="ms-trigger" id="rms-trigger-' + dk + '">' + (isCur ? '<span class="ms-cur">主</span>' : "") + '<span class="ms-trigger-txt">' + triggerText + "</span></div>";
    h += '<div class="ms-panel">';
    h += '<label class="ms-all"><input type="checkbox" data-all="' + dk + '"' + (!selected.length ? " checked" : "") + "> 全部" + dimShort + "</label>";
    for (const v of allVals) h += '<label><input type="checkbox" data-dk="' + dk + '" value="' + esc(v) + '"' + (selected.includes(v) ? " checked" : "") + "> " + esc(v) + "</label>";
    h += "</div></div>";
  }
  h += '<span class="drillbar-sp"></span>';
  if (activeDrill) h += '<span class="drillbar-count">' + activeDrill + ' 个维度已筛选</span><button class="btn sm" id="rep-drill-clear">清除筛选</button>';
  h += "</div>";

  h += '</div></div>';

  // —— 报表表格 ——
  h += '<div class="card"><div class="card-h"><b>' + dimDefs[r.dim].name + ' × 期间</b><span class="hint">达成率 = 预估÷AOP · 增长率 = (预估−去年同期)÷去年同期 · ' + (r.sort ? "按「" + esc(r.sort.id) + "」" + (r.sort.dir === "asc" ? "升序" : "降序") : (r.dim === "grp" ? "按产品固定顺序排列" : "按规模(AOP)降序")) + " · 点表头排序 · 拖列缘调宽</span></div>";
  h += '<div class="twrap"><table class="dt" id="report-tbl"><thead>';
  // 第一行表头: 维度(可排序/可调宽) + 各期间(跨3列)
  h += '<tr><th class="l stick1 sortable' + (r.sort && r.sort.id === "dim" ? " sorted" : "") + '" data-cid="dim" rowspan="2" style="min-width:150px" title="点击排序 · 拖右缘调列宽">' + dimDefs[r.dim].name + sortIco("dim") + "</th>" +
    periods.map(p => '<th colspan="3" style="text-align:center;border-left:2px solid var(--line)' + (p.key === "YTD" ? ";background:var(--blue-soft,#EEF4FF)" : "") + '">' + p.label + "</th>").join("") + "</tr>";
  // 第二行表头: 每期间下的 预估/达成%/增长% — 每列可点击排序, 可拖宽
  h += "<tr>";
  for (const p of periods) {
    const sub = [["fy", "预估"], ["ach", "达成%"], ["gr", "增长%"]];
    sub.forEach(([f, labTxt], idx) => {
      const cid = p.key + "." + f;
      h += '<th class="sortable' + (r.sort && r.sort.id === cid ? " sorted" : "") + '" data-cid="' + cid + '"' + (idx === 0 ? ' style="border-left:2px solid var(--line)"' : "") + ' title="点击排序 · 拖右缘调列宽">' + labTxt + sortIco(cid) + "</th>";
    });
  }
  h += "</tr></thead><tbody>";
  if (!sortedRows.length) {
    h += '<tr><td class="l" colspan="' + (1 + periods.length * 3) + '" style="color:var(--mute);text-align:center;padding:18px">当前范围内没有数据</td></tr>';
  } else {
    for (const o of sortedRows) {
      h += '<tr><td class="l stick1">' + esc(o.dim) + "</td>" +
        periods.map(p => cells3(calc(o, p.mKey))).join("") + "</tr>";
    }
  }
  h += "</tbody><tfoot><tr class='total-row'><td class='l stick1'>合计</td>" +
    periods.map(p => cells3(calc(tot, p.mKey))).join("") + "</tr></tfoot>";
  h += "</table></div></div>";

  host.innerHTML = h;

  // —— 绑定 ——
  const seg = $("#rep-dim-seg");
  if (seg) seg.onclick = e => { const b = e.target.closest("button"); if (b && b.dataset.d) { r.dim = b.dataset.d; r.drillFilters = {}; r.sort = null; renderReport(); } };
  const metSeg = $("#rep-met-seg");
  if (metSeg) metSeg.onclick = e => { const b = e.target.closest("button"); if (b && b.dataset.m) { r.metric = b.dataset.m; renderReport(); } };
  const dataSeg = $("#rep-data-seg");
  if (dataSeg) dataSeg.onclick = e => { const b = e.target.closest("button"); if (b && b.dataset.md) { r.dataMode = b.dataset.md; renderReport(); } };
  const perSeg = $("#rep-period-seg");
  if (perSeg) perSeg.onclick = e => {
    const b = e.target.closest("button"); if (!b || !b.dataset.p) return;
    const pk = b.dataset.p; const hid = new Set(r.hidePeriods);
    if (hid.has(pk)) hid.delete(pk);
    else { if (allPeriods.length - hid.size <= 1) { toast("至少保留一个期间"); return; } hid.add(pk); }
    r.hidePeriods = [...hid]; renderReport();
  };
  const ytd = $("#rep-ytd");
  if (ytd) ytd.onchange = e => { r.ytdN = parseInt(e.target.value) || 12; renderReport(); };

  /* 列表头点击排序(维度列 + 各期间子列) */
  $$("#report-tbl thead th[data-cid]").forEach(th => {
    th.addEventListener("click", e => {
      if (e.target.closest(".resize-handle")) return;
      const cid = th.dataset.cid;
      if (r.sort && r.sort.id === cid) r.sort = r.sort.dir === "desc" ? { id: cid, dir: "asc" } : null;
      else r.sort = { id: cid, dir: "desc" };
      renderReport();
    });
  });

  /* 下钻多选下拉(与数据看板一致): 选中即时记录, 关闭面板时重算联动并刷新 */
  for (const dk of filterDims) {
    const wrap = $("#rms-wrap-" + dk); if (!wrap) continue;
    const trigger = $("#rms-trigger-" + dk);
    const txtEl = trigger.querySelector(".ms-trigger-txt") || trigger;
    const panel = wrap.querySelector(".ms-panel");
    const dimShort = dimDefs[dk].name.replace("维度", "");
    trigger.onclick = e => { e.stopPropagation(); const isOpen = wrap.classList.contains("open"); $$("#tab-report .ms-wrap").forEach(w => w.classList.remove("open")); if (!isOpen) wrap.classList.add("open"); };
    panel.onclick = e => {
      e.stopPropagation();
      const allCb = panel.querySelector('input[data-all="' + dk + '"]');
      const itemCbs = [...panel.querySelectorAll('input[data-dk="' + dk + '"]')];
      if (e.target === allCb || e.target.closest("label") === allCb.closest("label")) {
        if (allCb.checked) { itemCbs.forEach(cb => cb.checked = false); r.drillFilters[dk] = []; }
      } else {
        const checked = itemCbs.filter(cb => cb.checked).map(cb => cb.value);
        allCb.checked = !checked.length; r.drillFilters[dk] = checked;
      }
      const sel = r.drillFilters[dk] || [];
      wrap.classList.toggle("active", sel.length > 0);
      txtEl.textContent = sel.length ? (sel.length === 1 ? sel[0] : dimShort + " · 已选 " + sel.length) : "全部" + dimShort;
    };
  }
  /* 点击空白处: 关闭面板并刷新(重算联动选项与表格) */
  if (S._reportClickHandler) document.removeEventListener("click", S._reportClickHandler);
  S._reportClickHandler = function (e) {
    if (S.tab !== "report") return;
    if (!e.target.closest(".ms-wrap")) {
      const wasOpen = $$("#tab-report .ms-wrap.open").length > 0;
      $$("#tab-report .ms-wrap").forEach(w => w.classList.remove("open"));
      if (wasOpen) renderReport();
    }
  };
  document.addEventListener("click", S._reportClickHandler);
  if ($("#rep-drill-clear")) $("#rep-drill-clear").onclick = () => { r.drillFilters = {}; renderReport(); };

  /* 列宽拖拽(与数据看板一致, 记忆列宽). 报表为两行表头, 显式传入叶子列单元格 */
  requestAnimationFrame(() => {
    const tbl = $("#report-tbl");
    if (tbl && tbl.tHead && tbl.tHead.rows.length >= 2) {
      const dimTh = tbl.tHead.rows[0].cells[0];
      const leafCells = [...tbl.tHead.rows[1].cells];
      initResizableTable(tbl, "report", [dimTh, ...leafCells]);
    }
  });
}

/* =================== 管理后台 =================== */
function renderAdmin() {
  const host = $("#tab-admin");
  if (!S.me || S.me.role !== "admin") {
    host.innerHTML = '<div class="card"><div class="empty"><b>仅管理员可见</b>请点右上角「👤」切换为管理员身份后进入。</div></div>';
    return;
  }
  const cfg = S.cfg, mt = S.master && S.master.meta;
  const grps = S.master ? [...new Set(S.master.rows.map(r => r.grp))].sort((a, b) => a.localeCompare(b, "zh")) : [];
  const qset = new Set((cfg && cfg.qtyGroups) || []);
  const vs = (cfg && cfg.versions) || [];
  const actSet = new Set((cfg && cfg.actMonths) || []);
  let h = '<div class="admin-grid">';
  /* ① 导入 */
  h += '<div class="card"><div class="card-h"><b>① 每月导入系统数据</b></div><div style="padding:14px 16px;font-size:13px">' +
    (mt ? "<p>当前数据: <b>" + esc(mt.fileName || "") + '</b><br><span style="color:var(--mute)">' + dt(mt.importedAt) + " 导入 · 明细 " + (mt.srcRows || 0).toLocaleString() + " 行 → " + mt.combos + " 个组合" + (mt.bu ? " · BU: " + esc(mt.bu) : "") + "</span></p>" : '<p style="color:var(--mute)">还没有导入过数据。</p>') +
    '<p style="color:var(--mute);font-size:12px;margin:8px 0">直接选系统导出的 Excel(detail 明细)。工具自动识别年份、聚合到 代表×省份×产品组、建议关账月份。<b>已填写的预估按 代表+省份+产品组 自动对上,人员/产品变化零手工处理。</b></p>' +
    '<button class="btn pri" id="ad-import">📂 选择系统导出文件并导入</button></div></div>';
  /* ② 口径 */
  h += '<div class="card"><div class="card-h"><b>② 关账月份与周期</b></div><div style="padding:14px 16px;font-size:13px">';
  if (cfg) {
    h += '<div class="field" style="margin-bottom:10px"><label>周期标签(顶部显示 + 导出文件名)</label><input class="ctrl" id="cfg-label" style="width:100%" value="' + esc(cfg.cycleLabel || "") + '"></div>' +
      '<label style="font-size:11.5px;color:var(--mute);font-weight:600">已关账月份(锁定为实际,销售不可填)</label><div style="margin:6px 0 10px">' +
      MN.map((m, i) => '<span class="chip-toggle' + (actSet.has(i + 1) ? " q" : "") + '" data-cm="' + (i + 1) + '">' + m + (actSet.has(i + 1) ? " ✓" : "") + "</span>").join("") + "</div>" +
      '<button class="btn pri sm" id="ad-savecfg">保存口径</button>';
  } else h += '<p style="color:var(--mute)">导入数据后可在这里调整。</p>';
  h += "</div></div>";
  /* ③ 版本 */

async function doChangePassword() {
  const old = $("#cp-old").value.trim();
  const newPwd = $("#cp-new").value.trim();
  const confirm = $("#cp-confirm").value.trim();

  if (newPwd && newPwd !== confirm) { toast("两次输入的新密码不一致"); return; }

  const { role, name } = S.me;
  let currentPin;
  if (role === "admin") {
    currentPin = await Passwords.getAdminPin();
  } else {
    currentPin = await Passwords.getPersonalPin(role, name);
  }

  // 如果当前有密码，必须验证旧密码
  if (currentPin && !(await Passwords.verify(old, currentPin))) {
    toast("当前密码不正确"); return;

  if (role === "admin") {
    await Passwords.setAdminPin(newPwd);

    await Passwords.setPersonalPin(role, name, newPwd);
  }

/* 表格列宽拖拽: colgroup + table-layout:fixed + pointer capture + rAF 节流, 平滑不抖动
   key: 传入后按列 id 记忆用户调过的宽度(本次会话内切换/刷新视图不丢) */
function initResizableTable(table, key, thsOverride) {
  if (!table || !table.tHead || !table.tHead.rows.length) return;
  const ths = thsOverride && thsOverride.length ? thsOverride.slice() : [...table.tHead.rows[0].cells];
  if (!ths.length) return;
  let cg = table.querySelector(":scope > colgroup.rz-cols");
  if (!cg) {
    cg = document.createElement("colgroup");
    cg.className = "rz-cols";
    ths.forEach(() => cg.appendChild(document.createElement("col")));
    table.insertBefore(cg, table.firstChild);
  }
  const cols = [...cg.children];
  S._colW = S._colW || {};
  const saved = key ? (S._colW[key] = S._colW[key] || {}) : {};
  const cid = i => ths[i].dataset.cid || ("c" + i);
  const widths = ths.map(th => th.offsetWidth);
  const initW = widths.slice();
  let fixed = false;
  const apply = () => {
    let tot = 0;
    for (let i = 0; i < cols.length; i++) { cols[i].style.width = widths[i] + "px"; tot += widths[i]; }
    if (!fixed) { table.classList.add("rz-fixed"); fixed = true; }
    table.style.width = tot + "px";
  };
  /* 恢复本会话中用户调整过的列宽 */
  let hasSaved = false;
  ths.forEach((th, i) => { const w = saved[cid(i)]; if (w) { widths[i] = w; hasSaved = true; } });
  if (hasSaved) apply();

  ths.forEach((th, i) => {
    if (th.querySelector(".resize-handle")) return;
    const h = document.createElement("div");
    h.className = "resize-handle";
    h.setAttribute("draggable", "false");
    h.title = "拖拽调整列宽 · 双击恢复默认";
    h.addEventListener("dragstart", e => e.preventDefault());
    h.addEventListener("click", e => e.stopPropagation());
    h.addEventListener("dblclick", e => {
      e.stopPropagation();
      widths[i] = initW[i];
      delete saved[cid(i)];
      apply();
    });
    h.addEventListener("pointerdown", e => {
      e.preventDefault();
      e.stopPropagation();
      if (!fixed) { ths.forEach((t, j) => { if (!saved[cid(j)]) widths[j] = t.offsetWidth; }); }
      apply();
      h.setPointerCapture(e.pointerId);
      h.classList.add("dragging");
      document.body.classList.add("col-resizing");
      const sx = e.clientX, sw = widths[i];
      const min = ths[i].classList.contains("stick1") ? 90 : 44;
      let raf = 0, nx = sw;
      const mv = ev => {
        nx = Math.max(min, sw + ev.clientX - sx);
        if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (widths[i] !== nx) { widths[i] = nx; apply(); } });
      };
      const up = () => {
        h.removeEventListener("pointermove", mv);
        h.removeEventListener("pointerup", up);
        h.removeEventListener("pointercancel", up);
        if (raf) { cancelAnimationFrame(raf); raf = 0; }
        h.classList.remove("dragging");
        document.body.classList.remove("col-resizing");
        widths[i] = nx;
        if (key) saved[cid(i)] = nx;
        apply();
      };
      h.addEventListener("pointermove", mv);
      h.addEventListener("pointerup", up);
      h.addEventListener("pointercancel", up);
    });
    th.appendChild(h);
  });
}

function cloudMode() { return !!CLOUD_URL; }
async function cloudFetch(silent) {
  if (!cloudMode()) return null;
  // 自动生成 CDN 回退 URL：把 raw.githubusercontent.com 替换为 jsdelivr CDN
  const urls = [CLOUD_URL];
  if (CLOUD_URL.includes("raw.githubusercontent.com")) {
    // jsDelivr: https://cdn.jsdelivr.net/gh/用户名/仓库名@分支/路径
    const m = CLOUD_URL.match(/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)/);
    if (m) urls.push("https://cdn.jsdelivr.net/gh/" + m[1] + "/" + m[2] + "@" + m[3] + "/" + m[4]);
  }
  let lastErr = "";
  for (const url of urls) {
    try {
      const resp = await fetch(url, { cache: "no-store" });
          if (resp.ok) {
        const d = await resp.json();
        if (!d || d.kind !== "fc-package") throw new Error("JSON 格式不符 (kind != fc-package)");
        if (!d.master) throw new Error("JSON 缺少 master 字段");
        if (url !== CLOUD_URL) console.log("cloudFetch: 通过 CDN 拉取成功");
        return d;
      }
      lastErr = "HTTP " + resp.status + (resp.status === 404 ? " (文件不存在)" : resp.status === 403 ? " (仓库需设为公开 Public)" : "");
    } catch (e) {
      lastErr = (e.message || e);
    }
  }  // end URL loop
  if (!silent) {
    toast("☁ 拉取失败: " + lastErr + " — raw.githubusercontent.com 国内被墙,已尝试 CDN 回退");
    console.error("cloudFetch failed:", lastErr);
  }
  return null;
}
async function cloudPull(force) {
  if (!cloudMode()) { toast("⚠ CLOUD_URL 为空,请在代码中配置数据包 Raw URL"); return false; }
  const d = await cloudFetch(!force);  // 手动同步(silent=false)显示详细错误
  if (!d) return false;
  // 云端文件未更新(同一 exportedAt)且非手动强制 → 不重复写入,保护管理员本机未上传的修改
  const lastTs = await Store.get("fc-cloud-ts");
  if (!force && lastTs && d.exportedAt && d.exportedAt <= lastTs) return false;
  try {
    await Store.set("fc-cfg", d.cfg);
    await Store.set("fc-master", d.master);
    // 各人预估:取更新时间较新的一方,避免覆盖本机刚填、尚未汇总进云端包的数据
    for (const f of (d.forecasts || [])) if (f && f.rep) {
      const local = await Store.get("fc-f-" + f.rep);
      if (!local || (local.updatedAt || 0) <= (f.updatedAt || 0)) await Store.set("fc-f-" + f.rep, f);
    }
    for (const v of (d.versions || [])) if (v && v.id) await Store.set("fc-v-" + v.id, v);
    // 管理备注: 跟随数据包(此前云端模式漏同步)
    if (d.dashComments) await Store.set("fc-dash-comments", d.dashComments);
    // 管理调整层: 取更新时间较新的一方,避免覆盖本机经理刚改、尚未上传的调整
    if (d.mgrAdjust) {
      const localM = await Store.get("fc-mgr");
      if (!localM || (localM.updatedAt || 0) <= (d.mgrAdjust.updatedAt || 0)) await Store.set("fc-mgr", d.mgrAdjust);
    }
    // ★ 密码同步:包内时间戳更新(或本地为空)即生效 —— 管理员设密码后导出上传,团队打开页面即要求新密码
    if (d.passwords) await Passwords.applyFromPackage(d.passwords);
    Passwords._loaded = false; await Passwords._load();
    if (d.exportedAt) await Store.set("fc-cloud-ts", d.exportedAt);
  } catch (e) {
    toast("⚠ 数据写入失败,可能超出浏览器存储上限: " + (e.message || e));
    return false;
  }
  await loadAll(); await validateMe(); applyMe();
  const label = (d.cfg && d.cfg.cycleLabel) || "云端数据";
  toast("✅ 已同步云端数据: " + label + " (" + new Date(d.exportedAt).toLocaleString("zh-CN") + ")");
  return true;
}
async function init() {
  await Store.init();
  // 云端模式：每次打开都检查云端是否有新数据包(同一包不会重复写入)
  if (cloudMode()) await cloudPull(false);
  /* 初始化水印 */
  const wm = $("#watermark");
  if (wm) {
    const text = "Designed by Kong, 仅波士顿科学内部使用";
    const w = window.innerWidth, h = window.innerHeight;
    const stepX = 280, stepY = 200;
    let s = "";
    for (let y = -100; y < h + 100; y += stepY) {
      for (let x = -100; x < w + 100; x += stepX) {
        s += '<span style="left:' + x + 'px;top:' + y + 'px">' + text + '</span>';
      }
    }
    wm.innerHTML = s;
  }
  const b = $("#sync-badge");
  if (Store.shared) { b.textContent = "🟢 共享模式"; b.title = "所有人打开同一发布链接,实时共用一份数据"; b.style.background = "#E7F6EC"; b.style.color = "#1E7B3C"; b.style.borderColor = "#BFE5CC"; }
  else if (cloudMode()) { b.textContent = "☁ 云端模式"; b.title = "管理员上传数据包后,其他人打开网页自动拉取最新数据"; b.style.background = "#EDF3FF"; b.style.color = "#2458E6"; b.style.borderColor = "#B9CDF5"; }
  else { b.textContent = "💾 本地模式"; b.title = "数据仅保存在本浏览器;请用管理后台的数据包导出/导入接力"; }
  await loadAll();
  // 任何模式下都恢复身份（云端/本地用 localStorage 存，共享模式用 window.storage）
  { S.me = await Store.pget("fc-me"); await validateMe(); }
  if (S.me && S.me.role === "rep") S.curRep = S.me.name;
  $$(".tabs .tab").forEach(btn => btn.onclick = () => switchTab(btn.dataset.tab));
  $("#btn-me").onclick = () => renderGate();
  $("#btn-help") && ($("#btn-help").onclick = () => openManual());
  $("#btn-chgpwd").onclick = () => openChangePasswordModal();
  $("#btn-cloud").onclick = async () => { toast("正在从 GitHub 拉取 …"); const ok = await cloudPull(true); if (!ok) toast("⚠ 拉取失败,请检查 CLOUD_URL 和网络"); else rerender(); renderCtx(); };
  if (cloudMode()) { const bc = $("#btn-cloud"); if (bc) bc.style.display = ""; }
  $("#btn-refresh").onclick = async () => { toast("正在刷新 …"); await loadAll(); await validateMe(); applyMe(); rerender(); if (!S.me) renderGate(); else toast("已读取最新数据"); };
  $("#mask").addEventListener("click", e => { if (S.gateOpen) return; if (e.target === $("#mask")) closeModal(); });
  $("#file-xlsx").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) onXlsxFile(f); });
  $("#file-pkg").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) importPackage(f); });
  $("#file-reps").addEventListener("change", e => { const fs = [...e.target.files]; e.target.value = ""; if (fs.length) importRepFiles(fs); });
  $("#file-reps-xlsx").addEventListener("change", e => { const fs = [...e.target.files]; e.target.value = ""; if (fs.length) importRepXlsxFiles(fs); });
  window.addEventListener("beforeunload", () => { flushDirtyReps(false); });
  applyMe();
  rerender();
  if (!S.me) renderGate();
}
init();
</script>
</body>
</html>
