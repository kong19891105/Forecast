<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>预估收集工具 · 月度滚动预估</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#152235; --ink2:#354764; --mute:#6E7E96;
  --paper:#F2F4F8; --card:#FFFFFF; --line:#E1E5ED; --line2:#C8CFDB;
  --blue:#2054E0; --blue-soft:#EDF3FF; --blue-line:#B2CBF8;
  --blue-hover:#1744BA;
  --green:#0D7F56; --green-soft:#E8F5EF;
  --red:#B8322B; --red-soft:#FAECEA;
  --amber:#9E6200; --amber-soft:#FBF2E0;
  --navy-bar:#172B45;
  --shadow-sm:0 1px 2px rgba(21,34,53,.05),0 2px 8px rgba(21,34,53,.06);
  --shadow-md:0 2px 6px rgba(21,34,53,.06),0 8px 24px rgba(21,34,53,.08);
  --shadow-lg:0 8px 30px rgba(10,18,32,.12),0 2px 8px rgba(10,18,32,.06);
  --r:12px;
  --r-sm:8px;
  --num:"Bahnschrift","Segoe UI",system-ui,sans-serif;
  --transition:180ms cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.55;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
::selection{background:rgba(32,84,224,.18);color:var(--ink)}
button{font-family:inherit;cursor:pointer;transition:var(--transition)}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--ink);transition:var(--transition)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#C8CFDB;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#A0AAB8}

/* ---------- app bar ---------- */
.appbar{
  background:linear-gradient(135deg,var(--ink),#1A2E4A);
  color:#fff;display:flex;align-items:center;gap:18px;padding:0 24px;height:54px;
  position:sticky;top:0;z-index:50;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 2px 12px rgba(0,0,0,.15);
}
.logo{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.logo b{font-size:16px;font-weight:700;letter-spacing:.02em}
.logo span{font-size:11px;color:#8DA3C4;font-weight:500}
.tabs{display:flex;gap:2px;height:100%}
.tab{
  background:none;border:none;color:#A8BCD6;font-size:13.5px;
  padding:0 18px;height:100%;border-bottom:3px solid transparent;
  transition:color var(--transition),border-color var(--transition);
  font-weight:500;
}
.tab:hover{color:#E8F0FF}
.tab.on{color:#fff;border-bottom-color:#5B8DEF;font-weight:600}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.sync-badge{
  font-size:11px;padding:3px 10px;border-radius:99px;
  background:rgba(255,255,255,.1);color:#C4D5ED;white-space:nowrap;
  border:1px solid rgba(255,255,255,.08);
}
.sync-badge.live{background:rgba(46,160,109,.2);color:#8FE8BF;border-color:rgba(46,160,109,.3)}
.icon-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
  color:#D8E5F8;border-radius:var(--r-sm);padding:5px 12px;font-size:12px;
  transition:background var(--transition);
}
.icon-btn:hover{background:rgba(255,255,255,.16)}
.icon-btn:active{background:rgba(255,255,255,.22);transform:scale(.97)}

/* ---------- 口径条 ---------- */
.ctxbar{
  background:var(--navy-bar);color:#CDD8EB;display:flex;align-items:center;
  gap:22px;padding:8px 24px;font-size:12px;position:sticky;top:54px;z-index:49;
  flex-wrap:wrap;min-height:44px;
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset;
}
.ctx-cycle{font-weight:700;color:#fff;font-size:13px;white-space:nowrap}
.mchips{display:flex;gap:5px;align-items:center}
.mchip{
  width:30px;text-align:center;padding:2px 0;border-radius:6px;
  font-size:11px;font-family:var(--num);border:1px solid rgba(255,255,255,.22);
  color:#A0B9DD;transition:var(--transition);
}
.mchip.act{background:#E6EDFA;color:var(--ink);border-color:#E6EDFA;font-weight:700}
.mchip.fc{border-style:dashed;color:#7CB8FF;border-color:#4B7ED9}
.ctx-legend{color:#879CBD;white-space:nowrap}
.ctx-kpis{margin-left:auto;display:flex;gap:24px;align-items:center}
.ctx-kpi{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.ctx-kpi small{color:#879CBD;font-size:10px;font-weight:500}
.ctx-kpi b{font-family:var(--num);font-size:15px;color:#fff}
.gauge{
  width:120px;height:6px;border-radius:99px;
  background:rgba(255,255,255,.12);overflow:hidden;position:relative;
}
.gauge i{
  display:block;height:100%;
  background:linear-gradient(90deg,#4B7ED9,#2A9E6A);border-radius:99px;
  transition:width .5s cubic-bezier(.4,0,.2,1);
}

/* ---------- layout ---------- */
main{max-width:1480px;margin:0 auto;padding:20px 24px 64px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow-sm);margin-bottom:18px;
  transition:box-shadow var(--transition);
}
.card:hover{box-shadow:var(--shadow-md)}
.card-h{
  display:flex;align-items:center;gap:12px;padding:14px 18px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.card-h h3{font-size:14px;font-weight:700;color:var(--ink)}
.card-h .hint{font-size:12px;color:var(--mute);font-weight:400}
.card-b{padding:16px 18px}
.empty{padding:56px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;font-size:16px;color:var(--ink2);margin-bottom:8px;font-weight:600}

/* ---------- controls ---------- */
.btn{
  border:1px solid var(--line2);background:#fff;border-radius:var(--r-sm);
  padding:7px 16px;font-size:13px;color:var(--ink2);
  transition:all var(--transition);font-weight:500;
}
.btn:hover{border-color:var(--blue);color:var(--blue);background:#FAFCFF}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--blue-hover);border-color:var(--blue-hover);box-shadow:0 2px 8px rgba(32,84,224,.25)}
.btn.pri:active{background:#133AA0;transform:scale(.97)}
.btn.danger{color:var(--red);border-color:#E2BEBA}
.btn.danger:hover{background:var(--red-soft);border-color:var(--red)}
.btn.sm{padding:5px 12px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
select.ctrl,input.ctrl{
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:7px 10px;
  font-size:13px;background:#fff;outline:none;
}
select.ctrl:focus,input.ctrl:focus{
  border-color:var(--blue);box-shadow:0 0 0 3px rgba(32,84,224,.12);
}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r-sm);overflow:hidden}
.seg button{
  border:none;background:#fff;padding:6px 14px;font-size:12.5px;color:var(--ink2);
  border-right:1px solid var(--line);transition:all var(--transition);font-weight:500;
}
.seg button:last-child{border-right:none}
.seg button:hover{background:#F6F8FC}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11.5px;color:var(--mute);font-weight:600;letter-spacing:.01em}

/* ---------- tables ---------- */
.twrap{overflow:auto;max-height:72vh;border-radius:0 0 var(--r) var(--r)}
.twrap::-webkit-scrollbar-track{background:var(--card)}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;white-space:nowrap}
.dt th{
  position:sticky;top:0;background:#EBEEF5;color:var(--ink2);
  font-weight:700;font-size:11px;padding:8px 10px;
  border-bottom:2px solid var(--line2);text-align:right;z-index:3;
  letter-spacing:.02em;
}
.dt th.l,.dt td.l{text-align:left}
.dt td{
  padding:6px 10px;border-bottom:1px solid var(--line);
  text-align:right;background:#fff;transition:background .12s;
}
.dt tr:nth-child(even) td{background:#FAFBFD}
.dt tr:hover td{background:#F0F4FC}
.dt .stick1{
  position:sticky;left:0;z-index:2;
  border-right:2px solid var(--line);
}
.dt th.stick1{z-index:4}
.dt .grp-row td{
  background:#F2F4F8;font-weight:700;color:var(--ink);
  border-top:1px solid var(--line2);font-size:13px;
}
.dt .total-row td{
  background:#E8ECF3;font-weight:700;border-top:2px solid var(--line2);
  position:sticky;bottom:0;z-index:2;
}
.dt td.act-cell{color:var(--ink2);background:#F7F8F4}
.dt td.dim{color:var(--mute)}
td.pos,.pos{color:var(--green);font-weight:600}
td.neg,.neg{color:var(--red);font-weight:600}
td.warn,.warn{color:var(--amber);font-weight:600}
.fc-in{
  width:72px;border:1px solid var(--blue-line);background:var(--blue-soft);
  color:var(--blue);font-weight:600;font-family:var(--num);
  border-radius:6px;padding:5px 7px;text-align:right;outline:none;
  transition:all var(--transition);
}
.fc-in::placeholder{color:#A0B8E0;font-weight:400}
.fc-in:hover{border-color:var(--blue)}
.fc-in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(32,84,224,.15);background:#fff}
.fc-in.filled{background:#fff;border-color:var(--blue-line)}
.rm-in{
  width:240px;border:1px solid var(--line2);border-radius:6px;
  padding:5px 8px;font-size:12px;outline:none;
  transition:all var(--transition);
}
.rm-in:hover{border-color:var(--blue)}
.rm-in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(32,84,224,.12)}
.subv{display:block;font-size:10px;color:var(--mute);font-family:var(--num);line-height:1.1;margin-top:1px}
.tag{
  display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:4px;
  background:#EDF1F7;color:var(--ink2);margin-left:6px;vertical-align:1px;
  font-weight:600;letter-spacing:.01em;
}
.tag.q{background:var(--amber-soft);color:var(--amber)}
.tag.new{background:var(--green-soft);color:var(--green)}
.delta-up::before{content:"▲";font-size:9px;margin-right:2px}
.delta-dn::before{content:"▼";font-size:9px;margin-right:2px}

/* ---------- multi-select dropdown ---------- */
.ms-wrap{position:relative;display:inline-block;vertical-align:middle}
.ms-trigger{
  border:1px solid var(--line2);border-radius:var(--r-sm);padding:6px 10px;
  background:#fff;cursor:pointer;font-size:13px;min-width:110px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  color:var(--ink2);user-select:none;transition:all var(--transition);
}
.ms-trigger:hover{border-color:var(--blue)}
.ms-trigger::after{content:"▼";font-size:9px;color:var(--mute);transition:transform var(--transition)}
.ms-wrap.open .ms-trigger::after{transform:rotate(180deg)}
.ms-panel{
  position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:#fff;
  border:1px solid var(--line2);border-radius:var(--r-sm);
  box-shadow:var(--shadow-lg);max-height:300px;overflow-y:auto;
  min-width:190px;display:none;padding:6px 0;
  animation:msIn .15s cubic-bezier(.4,0,.2,1);
}
@keyframes msIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.ms-wrap.open .ms-panel{display:block}
.ms-panel label{
  display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:12.5px;
  cursor:pointer;white-space:nowrap;color:var(--ink2);transition:background .1s;
}
.ms-panel label:hover{background:var(--blue-soft)}
.ms-panel input[type=checkbox]{margin:0;width:14px;height:14px;accent-color:var(--blue)}
.ms-panel .ms-all{border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:5px;font-weight:700}
.ms-panel .ms-done{
  border-top:1px solid var(--line);padding-top:6px;margin-top:5px;
  background:var(--blue-soft);color:var(--blue);font-weight:600;justify-content:center;
}
.ms-panel .ms-done:hover{background:var(--blue-line);color:#fff}

/* ---------- resizable table ---------- */
.dt th,.dt td{border-right:1px solid var(--line)}
.dt th:last-child,.dt td:last-child{border-right:none}
.resize-handle{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize;z-index:5}
.resize-handle:hover,.resize-handle.dragging{background:rgba(91,141,239,.4)}
.dt th{position:relative}

/* ---------- watermark ---------- */
.watermark{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.watermark span{
  position:absolute;display:block;font-size:13px;
  color:rgba(160,175,200,.14);font-weight:600;
  transform:rotate(-30deg);white-space:nowrap;user-select:none;
  letter-spacing:.04em;
}

/* ---------- stats grid ---------- */
.statgrid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:12px;padding:16px 18px;
}
.stat{
  border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  background:linear-gradient(180deg,#fff,#F8FAFD);
  transition:all var(--transition);
}
.stat:hover{border-color:var(--line2);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.stat small{display:block;font-size:11px;color:var(--mute);margin-bottom:4px;font-weight:600;letter-spacing:.01em}
.stat b{font-family:var(--num);font-size:20px;color:var(--ink)}
.stat .sub{font-size:11px;color:var(--mute);font-family:var(--num);margin-top:2px}
.savestate{font-size:12px;color:var(--mute);transition:color var(--transition)}
.savestate.ok{color:var(--green)}

/* dashboard chart */
.chartbox{padding:12px 18px 6px}
.chartbox svg{border-radius:6px}
.legend{display:flex;gap:18px;font-size:11px;color:var(--mute);padding:0 18px 12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* remarks drawer rows */
.rm-li{
  padding:10px 16px;border-bottom:1px solid var(--line);font-size:12.5px;
  transition:background .12s;
}
.rm-li:hover{background:#FAFBFE}
.rm-li b{color:var(--ink2)}
.rm-li .who{color:var(--mute);font-size:11.5px;margin-right:8px}

/* admin */
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:980px){.admin-grid{grid-template-columns:1fr}}
.chip-toggle{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);
  border-radius:99px;padding:5px 14px;font-size:12px;margin:0 6px 6px 0;
  background:#fff;cursor:pointer;user-select:none;transition:all var(--transition);
}
.chip-toggle:hover{border-color:var(--blue);background:#FAFCFF}
.chip-toggle.q{background:var(--amber-soft);border-color:#DDB85C;color:var(--amber);font-weight:600}
.chip-toggle.q:hover{background:#F7EBD0}
.vlist .vitem{display:flex;align-items:center;gap:14px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.vlist .vitem b{min-width:160px}
.vlist .meta{color:var(--mute);font-size:12px}
.note{
  font-size:12.5px;color:var(--ink2);background:var(--amber-soft);
  border:1px solid #E5D2A0;border-radius:var(--r-sm);
  padding:12px 16px;margin-bottom:12px;
}
.note.blue{background:var(--blue-soft);border-color:var(--blue-line)}
.steps{font-size:13px;color:var(--ink2)}
.steps li{margin:8px 0 8px 20px}
.steps b{color:var(--ink)}
kbd.k{background:#EDF1F7;border:1px solid var(--line2);border-radius:4px;padding:1px 6px;font-size:11px;font-family:var(--num)}

/* modal */
.mask{
  position:fixed;inset:0;background:rgba(10,16,28,.5);
  display:none;align-items:flex-start;justify-content:center;z-index:100;
  padding:6vh 16px;backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
}
.mask.show{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:16px;max-width:700px;width:100%;
  max-height:86vh;overflow:auto;
  box-shadow:0 24px 80px rgba(10,18,32,.25),0 4px 16px rgba(10,18,32,.1);
  animation:modalIn .25s cubic-bezier(.4,0,.2,1);
}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-h{
  padding:16px 24px;border-bottom:1px solid var(--line);
  font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;
}
.modal-b{padding:20px 24px}
.modal-f{
  padding:14px 24px;border-top:1px solid var(--line);
  display:flex;justify-content:flex-end;gap:10px;
}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:13px;margin:8px 0}
.kv span{color:var(--mute)}
.mcheck{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.mcheck label{
  border:1px solid var(--line2);border-radius:7px;padding:5px 9px;
  font-size:12px;cursor:pointer;font-family:var(--num);transition:all var(--transition);
}
.mcheck label:hover{border-color:var(--blue)}
.mcheck label.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 24px;border-radius:99px;
  font-size:13px;box-shadow:var(--shadow-lg);z-index:200;
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* print */
@media print{.appbar,.ctxbar,.card-h .btn,.fc-toolbar{display:none}}
</style>

</head>
<body>

<div class="watermark" id="watermark"></div>

<header class="appbar">
  <div class="logo"><b>预估收集</b><span id="bu-tag">URO · 月度滚动</span></div>
  <nav class="tabs">
    <button class="tab on" data-tab="fill">✏️ 填写预估</button>
    <button class="tab" data-tab="dash">📊 数据看板</button>
    <button class="tab" data-tab="admin">⚙️ 管理后台</button>
  </nav>
  <div class="bar-right">
    <button class="icon-btn" id="btn-me" title="切换身份 / 可见范围">👤 选择身份</button>
    <span class="sync-badge" id="sync-badge">本地模式</span>
    <button class="icon-btn" id="btn-cloud" title="从 GitHub 拉取最新数据包" style="display:none">☁ 云端同步</button>
    <button class="icon-btn" id="btn-refresh" title="刷新页面数据">🔄 刷新</button>
  </div>
</header>

<div class="ctxbar" id="ctxbar">
  <span class="ctx-cycle" id="ctx-cycle">尚未导入数据</span>
  <div class="mchips" id="ctx-months"></div>
  <span class="ctx-legend">■ 已关账(Actual) &nbsp;⬚ 预估(Forecast)</span>
  <div class="ctx-kpis" id="ctx-kpis"></div>
</div>

<main>
  <!-- ============ 填写预估 ============ -->
  <section id="tab-fill"></section>
  <!-- ============ 数据看板 ============ -->
  <section id="tab-dash" style="display:none"></section>
  <!-- ============ 管理后台 ============ -->
  <section id="tab-admin" style="display:none"></section>
</main>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<input type="file" id="file-xlsx" accept=".xlsx,.xls,.csv" style="display:none">
<input type="file" id="file-pkg" accept=".json" style="display:none">
<input type="file" id="file-reps" accept=".json" multiple style="display:none">

<script>
/* =====================================================================
   预估收集工具 — 单文件应用
   三运行模式:
   ① 作为 Claude Artifact 发布 → window.storage 共享存储，全员实时共用
   ② GitHub Pages 云端模式   → 管理员上传数据包 JSON，其他人自动拉取
   ③ 本地 HTML 文件           → localStorage 持久化 + 数据包文件接力
   — 修改下面的 CLOUD_URL 为你的 GitHub 数据包 Raw URL 即可启用云端 —
   ===================================================================== */
// ★ 改为你的 GitHub 数据包 Raw URL（以 https://raw.githubusercontent.com/ 开头）
const CLOUD_URL = "";
"use strict";
const MN = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function fmtK(v, d) { if (v === null || v === undefined || !isFinite(v)) return "–";

  return k.toLocaleString("zh-CN", { minimumFractionDigits: dd, maximumFractionDigits: dd }); }

/* =================== 存储适配层 =================== */
const Store = {
  shared: false,
  mem: {},
  async init() { try { if (window.storage && typeof window.storage.get === "function") { await window.storage.list("fc-", true); this.shared = true; } } catch (e) { this.shared = false; } },
  async get(k) {
    if (this.shared) { try { const r = await window.storage.get(k, true); return r && r.value != null ? JSON.parse(r.value) : null; } catch (e) { return null; } }
    return this.mem[k] !== undefined ? this.mem[k] : null;
  },
  async set(k, v) {
    if (this.shared) { try { const r = await window.storage.set(k, JSON.stringify(v), true); return !!r; } catch (e) { console.error(e); toast("⚠ 共享存储写入失败"); return false; } }
    this.mem[k] = JSON.parse(JSON.stringify(v)); return true;
  },
  async del(k) { if (this.shared) { try { await window.storage.delete(k, true); } catch (e) {} } else delete this.mem[k]; },
  async list(prefix) {
    if (this.shared) { try { const r = await window.storage.list(prefix, true); return (r && r.keys) ? r.keys.map(x => typeof x === "string" ? x : x.key) : []; } catch (e) { return []; } }
    return Object.keys(this.mem).filter(k => k.startsWith(prefix));
  },
  /* 个人空间(shared=false): 每个使用者各自一份,用于记住身份 */
  async pget(k) {
    if (this.shared) { try { const r = await window.storage.get(k, false); return r && r.value != null ? JSON.parse(r.value) : null; } catch (e) { return null; } }
    return this.mem["p:" + k] !== undefined ? this.mem["p:" + k] : null;
  },
  async pset(k, v) {
    if (this.shared) { try { const r = await window.storage.set(k, JSON.stringify(v), false); return !!r; } catch (e) { return false; } }
    this.mem["p:" + k] = JSON.parse(JSON.stringify(v)); return true;
  },
  async pdel(k) { if (this.shared) { try { await window.storage.delete(k, false); } catch (e) {} } else delete this.mem["p:" + k]; }
};

/* =================== 系统导出解析 (纯函数) =================== */
function detectCols(headers) {
  const H = headers.map(h => String(h ?? "").trim());
  const find = (...cands) => { for (const c of cands) { const i = H.findIndex(h => h === c); if (i >= 0) return H[i]; } return null; };
  const findInc = kw => { const i = H.findIndex(h => h.includes(kw)); return i >= 0 ? H[i] : null; };
  // 自动识别年份: 同时存在 "XX Amt" 与 "XX Amt AOP" 的最大年份为当年
  let cy = null; const yrs = [];
  for (const h of H) { const m = h.match(/^(\d{2}) Amt$/); if (m && H.includes(m[1] + " Amt AOP")) yrs.push(parseInt(m[1])); }
  if (yrs.length) cy = Math.max(...yrs);
  if (cy === null) return { err: "未找到形如「26 Amt」与「26 Amt AOP」的列,请确认导出的是系统标准 detail 明细。" };
  const ly = cy - 1;
  const C = {
    cy, ly,
    rep: find("Rep", "rep", "代表", "销售代表"),
    prov: find("Province", "省份", "省"),
    grp: find("Region 0 - for 预估") || findInc("for 预估") || find("Prod Group", "Product Line5", "产品组"),
    rsm: find("RSM", "Region", "大区"),
    dsm: find("District", "DSM", "地区"),
    bu: find("BU"),
    month: find("Month", "month", "月份"),
    aopA: cy + " Amt AOP", aopQ: cy + " Qty AOP",
    actA: cy + " Amt",     actQ: cy + " Qty",
    lyA: find(ly + " Amt"), lyQ: find(ly + " Qty")
  };
  for (const need of ["rep", "prov", "grp", "month"]) if (!C[need]) return { err: "缺少必需列: " + need + " (Rep / Province / Region 0 - for 预估 / Month)" };
  return C;
}

function aggregateRows(rows, C) {
  const map = new Map(); const mAct = zeros(); const mAop = zeros(); let used = 0; let bu = "";
  for (const r of rows) {
    const m = parseInt(r[C.month]); if (!(m >= 1 && m <= 12)) continue;
    used++;
    const rep = String(r[C.rep] ?? "").trim() || "未分配";
    const prov = String(r[C.prov] ?? "").trim() || "未知";
    const grp = String(r[C.grp] ?? "").trim() || "未分组";
    if (!bu && C.bu && r[C.bu]) bu = String(r[C.bu]).trim();
    const key = rowKey(rep, prov, grp);
    let o = map.get(key);
    if (!o) { o = { rep, prov, grp, rsm: String(r[C.rsm] ?? "").trim(), dsm: String(r[C.dsm] ?? "").trim(), aopA: zeros(), aopQ: zeros(), actA: zeros(), actQ: zeros(), lyA: zeros(), lyQ: zeros() }; map.set(key, o); }
    const i = m - 1;
    o.aopA[i] += num(r[C.aopA]); o.aopQ[i] += num(r[C.aopQ]);
    o.actA[i] += num(r[C.actA]); o.actQ[i] += num(r[C.actQ]);
    if (C.lyA) o.lyA[i] += num(r[C.lyA]); if (C.lyQ) o.lyQ[i] += num(r[C.lyQ]);
    mAct[i] += num(r[C.actA]); mAop[i] += num(r[C.aopA]);
  }
  // 已关账月份建议: 实际 ≥ 当月AOP的20% 视为完整月
  const sugg = []; for (let i = 0; i < 12; i++) if (mAct[i] > 0 && (mAop[i] <= 0 || mAct[i] >= 0.2 * mAop[i])) sugg.push(i + 1);
  return { rows: [...map.values()], used, suggested: sugg, mAct, mAop, bu };
}

function rowASP(r) {

  if (ov > 0) return ov;
  const aA = r.aopA.reduce((a, b) => a + b, 0), aQ = r.aopQ.reduce((a, b) => a + b, 0);
  if (aQ > 0) return aA / aQ;
  const lA = r.lyA.reduce((a, b) => a + b, 0), lQ = r.lyQ.reduce((a, b) => a + b, 0);
  if (lQ > 0) return lA / lQ;
  const cA = r.actA.reduce((a, b) => a + b, 0), cQ = r.actQ.reduce((a, b) => a + b, 0);

  return 0;
}

/* 把"主数据 + 各代表填写"合成统一条目列表 */
function buildEntries() {
  if (!S.master || !S.cfg) return [];
  const actSet = new Set(S.cfg.actMonths || []);
  const qtySet = new Set(S.cfg.qtyGroups || []);
  const out = [];
  const seen = new Set();
  const mk = (r, f, manual) => {
    const asp = rowASP(r);
    const qm = qtySet.has(r.grp);
    const m = []; let fy = 0, fyq = 0, openTotal = 0, openFilled = 0;
    for (let i = 0; i < 12; i++) {
      if (actSet.has(i + 1)) { const v = r.actA[i]; m.push({ act: true, a: v, q: r.actQ[i] }); fy += v; fyq += r.actQ[i]; }
      else {
        openTotal++;
        const fa = f && f.a ? f.a[i] : null; const fq = f && f.q ? f.q[i] : null;
        let a, q;
        if (qm && fq != null) { q = fq; a = asp > 0 ? fq * asp : (fa != null ? fa : fq * 1000); }
        else { a = fa != null ? fa : 0; q = fq != null ? fq : (fa != null && asp > 0 ? fa / asp : 0); }
        if (fa != null || fq != null) openFilled++;
        m.push({ act: false, a, q, raw: fa, rawq: fq });
        fy += a; fyq += q;
      }
    }
    const aop = r.aopA.reduce((x, y) => x + y, 0), aopQ = r.aopQ.reduce((x, y) => x + y, 0);
    const ly = r.lyA.reduce((x, y) => x + y, 0), lyQ = r.lyQ.reduce((x, y) => x + y, 0);
    out.push({ key: rowKey(r.rep, r.prov, r.grp), rep: r.rep, prov: r.prov, grp: r.grp,
      rsm: r.rsm || (S.repInfo.get(r.rep) || {}).rsm || "未分配", dsm: r.dsm || (S.repInfo.get(r.rep) || {}).dsm || "未分配",
      qtyMode: qtySet.has(r.grp), asp, m, fy, fyq, aop, aopQ, ly, lyQ,
      ytdAct: r.actA.reduce((s, v, i) => actSet.has(i + 1) ? s + v : s, 0),
      ytdAop: r.aopA.reduce((s, v, i) => actSet.has(i + 1) ? s + v : s, 0),
      openTotal, openFilled, rm: (f && f.rm) || "", manual: !!manual, row: r, f });
  };
  for (const r of S.idx.values()) {
    const k = rowKey(r.rep, r.prov, r.grp); seen.add(k);
    const doc = S.fcs.get(r.rep); mk(r, doc && doc.rows ? doc.rows[k] : null, false);
  }
  for (const doc of S.fcs.values()) for (const k in (doc.rows || {})) {
    const f = doc.rows[k];
    if (f && f.manual && !seen.has(k)) {
      const [rep, prov, grp] = k.split("|");
      mk({ rep, prov, grp, rsm: "", dsm: "", aopA: zeros(), aopQ: zeros(), actA: zeros(), actQ: zeros(), lyA: zeros(), lyQ: zeros() }, f, true);
    }
  }
  return out;
}

  if (!S.cfg || !S.master) { cyc.textContent = "尚未导入数据 — 请到「管理后台」导入系统导出文件"; mc.innerHTML = ""; kp.innerHTML = ""; return; }
  cyc.textContent = S.cfg.cycleLabel + " · FY" + S.cfg.cy + (S.me && S.me.role !== "admin" ? " · " + scopeLabel() : "");
  const actSet = new Set(S.cfg.actMonths);
  mc.innerHTML = MN.map((n, i) => '<span class="mchip ' + (actSet.has(i + 1) ? "act" : "fc") + '">' + (i + 1) + "</span>").join("");
  const es = scopedEntries();
  const pe = calcEntriesPeriod(es, S.period);
  const ach = pe.aop > 0 ? pe.fy / pe.aop : null;
  const gr = pe.ly > 0 ? pe.fy / pe.ly - 1 : null;
  const ytdAch = pe.ytdAop > 0 ? pe.ytdAct / pe.ytdAop : null;
  const oT = pe.openTotal, oF = pe.openFilled;
  const pLabel = periodLabel(S.period);
  kp.innerHTML =
    '<div class="ctx-kpi"><small>YTD达成</small><b class="num">' + fmtPct(ytdAch) + "</b></div>" +
    '<div class="ctx-kpi"><small>' + pLabel + '预估达成</small><b class="num">' + fmtPct(ach) + "</b></div>" +
    '<div class="ctx-kpi"><small>' + pLabel + ' GR% vs FY' + S.cfg.ly + "</small><b class=\"num\">" + fmtPct(gr) + "</b></div>" +
    '<div class="ctx-kpi"><small>填写进度 ' + Math.round(oT ? oF / oT * 100 : 0) + '%</small><div class="gauge"><i style="width:' + Math.min(100, oT ? oF / oT * 100 : 0) + '%"></i></div></div>';
}

/* =====================================================================
   ① 填写预估页
   ===================================================================== */
async function renderFill() {
  const host = $("#tab-fill");
  if (!S.master || !S.cfg) {
    host.innerHTML = '<div class="card"><div class="empty"><b>还没有底表数据</b>管理员请先到「管理后台」导入系统导出的 AOP/Actual 明细文件,导入后各代表即可在此填写。</div></div>';
    return;
  }
  /* 保存滚动位置 */
  const twrapEl = $(".twrap");
  const savedScrollLeft = twrapEl ? twrapEl.scrollLeft : 0;
  
  const reps = scopeReps();
  const lockRep = S.me && S.me.role === "rep";
  if (lockRep) S.curRep = S.me.name;
  else if (S.curRep && !reps.includes(S.curRep)) S.curRep = "";
  const lv = latestVerMeta();
  const ver = lv ? await getVersion(lv.id) : null;
  const actSet = new Set(S.cfg.actMonths);

  let html = '<div class="card"><div class="card-h">';
  if (lockRep) {
    html += "<h3>" + esc(S.curRep) + " 的预估填写</h3>" +
      '<span class="hint">身份:销售代表 — 只显示并保存你自己的数据,与其他同事互不影响</span>';
  } else {
    html += '<h3>选择代表岗位</h3>' +
      '<select class="ctrl" id="rep-sel" style="min-width:220px"><option value="">— 请选择代表 / 岗位 —</option>' +
      reps.map(r => { const inf = S.repInfo.get(r) || {}; return '<option value="' + esc(r) + '"' + (r === S.curRep ? " selected" : "") + ">" + esc(r) + (inf.dsm ? " · " + esc(inf.dsm) : "") + "</option>"; }).join("") +
      "</select>" +
      '<span class="hint">' + (S.me && S.me.role !== "admin" ? "范围:" + scopeLabel() + " · 可代填空缺岗位(岗位号)" : "系统中岗位换人/显示岗位号时,这里会自动跟随系统导出更新,无需手工改名。") + "</span>";
  }
  html += '<span class="savestate" id="savestate" style="margin-left:auto"></span>' +
    "</div>";

  if (!S.curRep) {
    html += '<div class="empty"><b>请先在上方选择姓名(岗位)</b>选中后只会显示并保存该代表的填写,与其他同事互不影响。</div></div>';
    host.innerHTML = html;
    if ($("#rep-sel")) $("#rep-sel").onchange = e => { S.curRep = e.target.value; renderFill(); };
    return;
  }
  html += "</div>";

  const all = buildEntries().filter(e => e.rep === S.curRep);
  all.sort((a, b) => a.grp.localeCompare(b.grp, "zh") || b.aop - a.aop);
  const byGrp = new Map();
  for (const e of all) { if (!byGrp.has(e.grp)) byGrp.set(e.grp, []); byGrp.get(e.grp).push(e); }
  const doc = S.fcs.get(S.curRep);

  /* —— 个人统计卡 —— */
  html += '<div class="card"><div class="statgrid" id="rep-stats"></div>' +
    '<div class="card-b fc-toolbar" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)">' +
    '<span class="hint" style="margin-right:4px">快捷填充(仅填空白预估格):</span>' +
    '<button class="btn sm" id="qf-aop">按 AOP 指标</button>' +
    '<button class="btn sm" id="qf-ly">按去年同期</button>' +
    (ver ? '<button class="btn sm" id="qf-prev">复制上次版本</button>' : "") +
    '<button class="btn sm danger" id="qf-clear">清空我的全部预估</button>' +
    '<span style="flex:1"></span>' +
    '<button class="btn sm" id="add-row">＋ 新增产品/省份行</button>' +
    (!Store.shared ? '<button class="btn sm pri" id="exp-rep">⬇ 导出我的预估文件</button>' : "") +
    "</div></div>";

  /* —— 月度趋势图(随输入实时更新) —— */
  html += '<div class="card"><div class="card-h"><h3>📈 月度趋势 · ' + esc(S.curRep) + '</h3>' +
    '<span class="hint">深色柱 = 已关账实际 · 斜纹柱 = 预估(随下方输入实时变化) · 红线 = AOP · 虚线 = 去年同期</span></div>' +
    '<div id="fill-chart" style="padding:4px 10px 2px"></div></div>';

  /* —— 填写表 —— */
  const pLabel = periodLabel(S.period);
  const pShort = S.period === "FY" ? "FY" : S.period;
  html += '<div class="card"><div class="card-h"><h3>' + esc(S.curRep) + ' 的预估明细</h3>' +
    '<div class="seg" id="period-seg">' + PERIODS.map(p => '<button data-p="' + p.key + '" class="' + (S.period === p.key ? "on" : "") + '">' + p.label + '</button>').join('') + '</div>' +
    '<span class="hint">蓝色格可编辑(其余为系统数据,不可改) · 金额单位:千元 K · 灰底为已关账实际 · 输入框灰字为上次版本值</span></div>' +
    '<div class="twrap"><table class="dt"><thead><tr>' +
    '<th class="l stick1" style="min-width:200px">产品 / 省份</th>';
  for (let i = 0; i < 12; i++) html += '<th>' + MN[i] + (actSet.has(i + 1) ? "<br><span style='font-weight:400'>Act</span>" : "<br><span style='color:var(--blue)'>预估</span>") + "</th>";
  html += '<th class="l" style="min-width:240px">备注(预估说明/变化原因)</th>' +
    '<th>' + pShort + '预估</th><th>' + pShort + ' AOP</th><th>' + pShort + ' Ach%</th><th>' + S.cfg.ly + pShort + '</th><th>' + pShort + ' GR%</th>' +
    (ver ? '<th>上版' + pShort + '</th><th>Δ' + pShort + '</th><th>ΔAch</th>' : '') +
    '</tr></thead><tbody id="fill-body">';

  let ri = 0;
  const sortedGrps = [...byGrp.keys()].sort((a, b) => grpSortKey(a).localeCompare(grpSortKey(b)));
  for (const grp of sortedGrps) {
    const list = byGrp.get(grp);
    const qm = list[0].qtyMode;
    const gsubId = 'gsub-' + esc(grp).replace(/[^\w\u4e00-\u9fa5]/g, "_");
    html += '<tr class="grp-row"><td class="l stick1">' + esc(grp) + (qm ? '<span class="tag q">填数量</span>' : '<span class="tag">填金额K</span>') + '</td>' +
      '<td colspan="' + (12 + 5 + (ver ? 3 : 0) + 1) + '" class="l" id="' + gsubId + '"></td></tr>';
    for (const e of list) {
      e._ri = ri;
      const vrow = verRowOf(ver, e.key);
      const pe = calcEntryPeriod(e, S.period);
      html += '<tr data-key="' + esc(e.key) + '"><td class="l stick1" style="padding-left:20px">' + esc(e.prov) + (e.manual ? '<span class="tag new">新增</span>' : "") + "</td>";
      for (let i = 0; i < 12; i++) {
        const c = e.m[i];
        if (c.act) html += '<td class="act-cell num">' + fmtK(c.a) + (e.qtyMode ? '<span class="subv">' + fmtQ(c.q) + "件</span>" : "") + "</td>";
        else {
          const prevA = vrow && vrow.m ? vrow.m[i] : null;
          if (e.qtyMode) {
            const val = c.rawq != null ? String(+c.rawq.toFixed(2)) : (c.raw != null && e.asp > 0 ? String(+(c.raw / e.asp).toFixed(2)) : "");
            const ph = prevA != null && e.asp > 0 ? "上版" + (+(prevA / e.asp).toFixed(1)) : "数量";
            html += '<td><input class="fc-in' + (val ? " filled" : "") + '" data-ri="' + ri + '" data-m="' + i + '" data-kind="q" value="' + val + '" placeholder="' + ph + '" inputmode="decimal">' +
              '<span class="subv" id="amt-' + ri + "-" + i + '">' + (c.raw != null ? "≈" + fmtK(c.a) + "K" : "") + "</span></td>";
          } else {
            const val = c.raw != null ? String(+(c.raw / 1000).toFixed(2)) : "";
            const ph = prevA != null ? "上版" + fmtK(prevA) : "K";
            html += '<td><input class="fc-in' + (val ? " filled" : "") + '" data-ri="' + ri + '" data-m="' + i + '" data-kind="a" value="' + val + '" placeholder="' + ph + '" inputmode="decimal"></td>';
          }
        }
      }
      /* 备注 → 12月后、FY预估前 */
      html += '<td class="l"><input class="rm-in" data-ri="' + ri + '" data-kind="rm" value="' + esc(e.rm) + '" placeholder="例: 6月手术量恢复,上调"></td>';
      /* 期间动态列 */
      html += '<td class="num" id="fy-' + ri + '"></td><td class="num" id="aop-' + ri + '"></td><td class="num" id="ach-' + ri + '"></td>' +
        '<td class="num" id="ly-' + ri + '"></td><td class="num" id="gr-' + ri + '"></td>';
      if (ver) html += '<td class="num" id="vfy-' + ri + '"></td><td class="num" id="dfy-' + ri + '"></td><td class="num" id="dach-' + ri + '"></td>';
      html += '</tr>';
      ri++;
    }
  }
  html += '</tbody><tfoot><tr class="total-row" id="fill-total"></tr></tfoot></table></div></div>';

  /* —— 整体备注 —— */
  html += '<div class="card"><div class="card-h"><h3>本次预估整体说明(可选)</h3></div><div class="card-b">' +
    '<textarea id="overall" class="ctrl" style="width:100%;min-height:64px" placeholder="给经理/老板看的整体说明,例如:本月集采落地,导丝价格下调,Q3量增价减…">' + esc((doc && doc.overall) || "") + "</textarea></div></div>";

  host.innerHTML = html;
  const entries = all; // closure
  S._fillEntries = entries; S._fillVer = ver;

  /* —— 事件 —— */
  if ($("#rep-sel")) $("#rep-sel").onchange = e => { S.curRep = e.target.value; renderFill(); };
  if ($("#period-seg")) $("#period-seg").onclick = e => { const b = e.target.closest("button"); if (b && b.dataset.p) { S.period = b.dataset.p; renderFill(); renderCtx(); } };
  $("#overall").oninput = e => { ensureDoc(S.curRep).overall = e.target.value; saveRepDoc(S.curRep); };
  $("#fill-body").addEventListener("input", e => {
    const t = e.target; if (!t.dataset || t.dataset.ri === undefined) return;
    const en = entries[+t.dataset.ri];
    if (t.dataset.kind === "rm") { ensureCell(S.curRep, en.key).rm = t.value; en.rm = t.value; saveRepDoc(S.curRep); return; }
    const i = +t.dataset.m;
    const cell = ensureCell(S.curRep, en.key);
    const raw = t.value.trim();
    if (raw === "" || isNaN(parseFloat(raw))) { cell.a[i] = null; cell.q[i] = null; t.classList.remove("filled"); }
    else {
      const v = parseFloat(raw);
      if (t.dataset.kind === "q") { cell.q[i] = v; cell.a[i] = en.asp > 0 ? v * en.asp : v * 1000; }
      else { cell.a[i] = v * 1000; cell.q[i] = en.asp > 0 ? cell.a[i] / en.asp : null; }
      t.classList.add("filled");
    }
    recalcEntry(en);
    if (t.dataset.kind === "q") { const lab = $("#amt-" + t.dataset.ri + "-" + i); if (lab) lab.textContent = cell.a[i] != null ? "≈" + fmtK(cell.a[i]) + "K" : ""; }
    paintEntry(en); paintRepStats(entries, ver); paintGroupSubs(entries, ver); paintFillChart(entries); renderCtx();
    saveRepDoc(S.curRep);
  });
  $("#qf-aop") && ($("#qf-aop").onclick = () => quickFill("aop"));
  $("#qf-ly") && ($("#qf-ly").onclick = () => quickFill("ly"));
  $("#qf-prev") && ($("#qf-prev").onclick = () => quickFill("prev"));
  $("#qf-clear").onclick = () => {
    openModal("清空确认", "<p>确定清空 <b>" + esc(S.curRep) + "</b> 在所有<b>预估月份</b>的填写吗?已关账月份的实际数不受影响。</p>",
      '<button class="btn" onclick="closeModal()">取消</button><button class="btn danger" id="qfc-ok">清空</button>');
    $("#qfc-ok").onclick = () => { closeModal(); quickFill("clear"); };
  };
  $("#add-row").onclick = openAddRow;
  $("#exp-rep") && ($("#exp-rep").onclick = exportRepFile);

  for (const e of entries) recalcEntry(e), paintEntry(e);
  paintRepStats(entries, ver); paintGroupSubs(entries, ver); paintFillChart(entries);
  
  /* 恢复滚动位置 */
  const newTwrap = $(".twrap");
  if (newTwrap) newTwrap.scrollLeft = savedScrollLeft;
}

/* 填写页月度趋势: 当前代表的 实际+预估 vs AOP vs 去年 */
function paintFillChart(entries) {
  const el = $("#fill-chart"); if (!el) return;
  const blend = zeros(), aopM = zeros(), lyM = zeros();
  for (const e of entries) for (let i = 0; i < 12; i++) {
    blend[i] += e.m[i].a;
    if (e.row) { aopM[i] += e.row.aopA[i]; lyM[i] += e.row.lyA[i]; }
  }
  el.innerHTML = monthChart(blend, aopM, lyM);
}

function recalcEntry(e) {
  const actSet = new Set(S.cfg.actMonths);
  const f = (S.fcs.get(e.rep) || { rows: {} }).rows[e.key];
  let fy = 0, fyq = 0, openFilled = 0;
  for (let i = 0; i < 12; i++) {
    if (actSet.has(i + 1)) { e.m[i] = { act: true, a: e.row.actA[i], q: e.row.actQ[i] }; fy += e.row.actA[i]; fyq += e.row.actQ[i]; }
    else {
      const fa = f && f.a ? f.a[i] : null, fq = f && f.q ? f.q[i] : null;
      let a, q;
      if (e.qtyMode && fq != null) { q = fq; a = e.asp > 0 ? fq * e.asp : (fa != null ? fa : fq * 1000); }
      else { a = fa != null ? fa : 0; q = fq != null ? fq : (fa != null && e.asp > 0 ? fa / e.asp : 0); }
      if (fa != null || fq != null) openFilled++;
      e.m[i] = { act: false, a, q, raw: fa, rawq: fq }; fy += a; fyq += q;
    }
  }
  e.fy = fy; e.fyq = fyq; e.openFilled = openFilled;
}
function paintEntry(e) {
  const i = e._ri; if (i === undefined) return;
  const set = (id, txt, cls) => { const el = $("#" + id); if (el) { el.textContent = txt; el.className = "num " + (cls || ""); } };
  const pe = calcEntryPeriod(e, S.period);
  const ach = pe.aop > 0 ? pe.fy / pe.aop : null, gr = pe.ly > 0 ? pe.fy / pe.ly - 1 : null;
  set("fy-" + i, fmtK(pe.fy), pe.fy ? "" : "dim");
  set("aop-" + i, fmtK(pe.aop));
  set("ach-" + i, fmtPct(ach), clsAch(ach));
  set("ly-" + i, fmtK(pe.ly));
  set("gr-" + i, fmtPct(gr), clsSign(gr));
  const ver = S._fillVer, vr = verRowOf(ver, e.key);
  if (ver) {
    const ms = getPeriodMonths(S.period);
    let vfy = 0; if (vr && vr.m) for (const mi of ms) vfy += (vr.m[mi] || 0);
    const d = (vr && vr.m) ? pe.fy - vfy : null;
    set("vfy-" + i, (vr && vr.m) ? fmtK(vfy) : "–");
    set("dfy-" + i, d === null ? "–" : fmtDK(d), d ? (d > 0 ? "pos delta-up" : "neg delta-dn") : "");
    const vfyAop = vr ? (function(){ let s=0; for(const mi of ms) s+=(vr.m?vr.m[mi]:0); return s; })() : 0;
    const va = vr && vr.aop > 0 ? vr.fy / vr.aop : null;
    const dach = ach !== null && va !== null ? ach - va : null;
    set("dach-" + i, fmtPP(dach), clsSign(dach));
  }
}
function paintGroupSubs(entries, ver) {
  const p = S.period || "FY";
  const ms = getPeriodMonths(p);
  const pShort = p === "FY" ? "FY" : p;
  const by = new Map();
  for (const e of entries) { if (!by.has(e.grp)) by.set(e.grp, []); by.get(e.grp).push(e); }
  for (const [grp, list] of by) {
    const elId = 'gsub-' + esc(grp).replace(/[^\w\u4e00-\u9fa5]/g, "_");
    const el = $("#" + elId); if (!el) continue;
    const ps = calcEntriesPeriod(list, p);
    const fy = ps.fy, aop = ps.aop, ly = ps.ly;
    const ach = aop > 0 ? fy / aop : null, gr = ly > 0 ? fy / ly - 1 : null;
    
    /* 计算分月小计 */
    const mm = zeros();
    for (const e of list) for (let i = 0; i < 12; i++) mm[i] += e.m[i].a;
    
    let vtxt = "";
    if (ver) { let vfy = 0, has = false; for (const e of list) { const vr = verRowOf(ver, e.key); if (vr && vr.m) { let s = 0; for (const i of ms) s += (vr.m[i] || 0); vfy += s; has = true; } }
      if (has) { const d = fy - vfy; vtxt = ' · vs上版 <span class="num ' + clsSign(d) + '">' + fmtDK(d) + "</span>"; } }
    
    /* 小计行改成跟总计行一样的格式 */
    let h = '<td class="l stick1"><b>' + esc(grp) + '</b> 小计' + vtxt + '</td>';
    for (let i = 0; i < 12; i++) h += '<td class="num">' + fmtK(mm[i]) + '</td>';
    h += '<td class="l"></td>'; // 备注空列
    h += '<td class="num"><b>' + fmtK(fy) + '</b></td><td class="num">' + fmtK(aop) + '</td><td class="num ' + clsAch(ach) + '">' + fmtPct(ach) + '</td>' +
      '<td class="num">' + fmtK(ly) + '</td><td class="num ' + clsSign(gr) + '">' + fmtPct(gr) + '</td>';
    if (ver) { let vfy = 0; for (const e of list) { const vr = verRowOf(ver, e.key); if (vr && vr.m) { let s = 0; for (const i of ms) s += (vr.m[i] || 0); vfy += s; } }
      const d = fy - vfy; h += '<td class="num">' + fmtK(vfy) + '</td><td class="num ' + clsSign(d) + '">' + fmtDK(d) + '</td><td></td>'; }
    el.parentElement.innerHTML = h;
  }
  /* 底部合计行 */
  const tr = $("#fill-total"); if (!tr) return;
  const ps = calcEntriesPeriod(entries, p);
  const fy = ps.fy, aop = ps.aop, ly = ps.ly;
  const mm = zeros(); for (const e of entries) for (let i = 0; i < 12; i++) mm[i] += e.m[i].a;
  let h = '<td class="l stick1">合计 (千元)</td>';
  for (let i = 0; i < 12; i++) h += '<td class="num">' + fmtK(mm[i]) + "</td>";
  /* 备注 → 空td */
  h += '<td></td>';
  const ach = aop > 0 ? fy / aop : null, gr = ly > 0 ? fy / ly - 1 : null;
  h += '<td class="num">' + fmtK(fy) + '</td><td class="num">' + fmtK(aop) + '</td><td class="num ' + clsAch(ach) + '">' + fmtPct(ach) + "</td>" +
    '<td class="num">' + fmtK(ly) + '</td><td class="num ' + clsSign(gr) + '">' + fmtPct(gr) + "</td>";
  if (ver) { let vfy = 0; for (const e of entries) { const vr = verRowOf(ver, e.key); if (vr && vr.m) { let s = 0; for (const i of ms) s += (vr.m[i] || 0); vfy += s; } }
    const d = fy - vfy; h += '<td class="num">' + fmtK(vfy) + '</td><td class="num ' + clsSign(d) + '">' + fmtDK(d) + '</td><td></td>'; }
  tr.innerHTML = h;
}
function paintRepStats(entries, ver) {
  const el = $("#rep-stats"); if (!el) return;
  const p = S.period || "FY";
  const ps = calcEntriesPeriod(entries, p);
  const fy = ps.fy, aop = ps.aop, ly = ps.ly;
  const ytdA = entries.reduce((s, e) => s + e.ytdAct, 0), ytdP = entries.reduce((s, e) => s + e.ytdAop, 0);
  const oT = ps.openTotal, oF = ps.openFilled;
  const ach = aop > 0 ? fy / aop : null, gr = ly > 0 ? fy / ly - 1 : null;
  const ytdGr = ytdP > 0 ? ytdA / ytdP - 1 : null;
  let vfy = 0, has = false;
  const ms = getPeriodMonths(p);
  if (ver) for (const e of entries) { const vr = verRowOf(ver, e.key); if (vr && vr.m) { let s = 0; for (const i of ms) s += (vr.m[i] || 0); vfy += s; has = true; } }
  const d = has ? fy - vfy : null;
  const pLbl = p === "FY" ? "全年" : p;
  el.innerHTML =
    stat("YTD 实际达成", fmtPct(ytdP > 0 ? ytdA / ytdP : null), fmtK(ytdA) + " / " + fmtK(ytdP) + " K") +

function quickFill(mode) {
  const entries = S._fillEntries || []; const ver = S._fillVer;
  const actSet = new Set(S.cfg.actMonths);
  for (const e of entries) {
    const cell = ensureCell(S.curRep, e.key);
    for (let i = 0; i < 12; i++) {
      if (actSet.has(i + 1)) continue;
      if (mode === "clear") { cell.a[i] = null; cell.q[i] = null; continue; }
      if (cell.a[i] != null) continue; // 只填空白
      let amt = null;
      if (mode === "aop") amt = e.row.aopA[i] || null;
      else if (mode === "ly") amt = e.row.lyA[i] || null;
      else if (mode === "prev") { const vr = verRowOf(ver, e.key); amt = vr && vr.m ? (vr.m[i] || null) : null; }
      if (amt != null && amt !== 0) { cell.a[i] = amt; cell.q[i] = e.asp > 0 ? amt / e.asp : null; }
    }
  }
  saveRepDoc(S.curRep);
  renderFill(); renderCtx();
  toast(mode === "clear" ? "已清空" : "已填充空白预估格");
}

function dashDetail(r, ver, isAmt, d, dp) {

function monthChart(blend, aop, ly) {

    s += '<text x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="11" fill="#7A879C">' + (i + 1) + "月</text>";
    s += '<text x="' + x(i) + '" y="' + (y(blend[i]) - 4) + '" text-anchor="middle" font-size="9.5" fill="#3B4A63" font-family="Bahnschrift,Segoe UI">' + fmtK(blend[i], 0) + "</text>";
  }

  s += '<path d="' + pl2 + '" fill="none" stroke="#B9C2D2" stroke-width="1.6" stroke-dasharray="2 3"/>';

  return s;
}

function exportDashXlsx(rows, entries, ver, verMeta) {

  const wb = XLSX.utils.book_new();

  const P = v => v === null || !isFinite(v) ? null : Math.round(v * 1000) / 10; // %1位
  const d = S.dash;
  const head1 = [dimDefs[d.dim].name, "YTD Ach%", "FY预估K", "FY AOP K", "Ach%", "FY" + S.cfg.ly + " K", "GR%", "上版FY K", "ΔFY K", "ΔAch pp", "ΔGR pp", "填写进度%", "备注条数"];
  const aoa1 = [["周期", S.cfg.cycleLabel, "导出时间", new Date().toLocaleString("zh-CN"), verMeta ? "对比版本:" + verMeta.label : "无版本对比"], head1];
  const vRoll = ver ? rollupVer(ver, d.dim, d.rsm) : null;

    const vr = vRoll ? vRoll.get(r.dim) : null;
    const vach = vr && vr.aop > 0 ? vr.fy / vr.aop : null, vgr = vr && vr.ly > 0 ? vr.fy / vr.ly - 1 : null;
    aoa1.push([r.dim, P(r.ytdAop > 0 ? r.ytdAct / r.ytdAop : null), K(r.fy), K(r.aop), P(ach), K(r.ly), P(gr),
      vr ? K(vr.fy) : null, vr ? K(r.fy - vr.fy) : null,
      ach !== null && vach !== null ? P(ach - vach) : null, gr !== null && vgr !== null ? P(gr - vgr) : null,
      r.openTotal ? Math.round(r.openFilled / r.openTotal * 100) : 100, r.rms.length]);
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa1), "汇总-" + dimDefs[d.dim].name.slice(0, 4));
  /* 明细 */
  const aoa2 = [["RSM", "DSM", "代表", "省份", "产品组", ...MN.map((m, i) => m + (new Set(S.cfg.actMonths).has(i + 1) ? "Act" : "FCST") + " K"), "FY预估K", "FY AOP K", "Ach%", "FY" + S.cfg.ly + " K", "GR%", "上版FY K", "ΔFY K", "备注"]];
  for (const e of entries.slice().sort((a, b) => a.rsm.localeCompare(b.rsm, "zh") || a.rep.localeCompare(b.rep, "zh") || b.fy - a.fy)) {
    const vr = verRowOf(ver, e.key);
    aoa2.push([e.rsm, e.dsm, e.rep, e.prov, e.grp, ...e.m.map(c => K(c.a)),
      K(e.fy), K(e.aop), P(e.aop > 0 ? e.fy / e.aop : null), K(e.ly), P(e.ly > 0 ? e.fy / e.ly - 1 : null),
      vr ? K(vr.fy) : null, vr ? K(e.fy - vr.fy) : null, e.rm || ""]);
  }
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa2), "全部明细");
  /* 备注 */
  const aoa3 = [["代表", "省份", "产品组", "备注", "本版FY K", "上版FY K", "ΔFY K"]];
  for (const e of entries.filter(x => x.rm)) { const vr = verRowOf(ver, e.key); aoa3.push([e.rep, e.prov, e.grp, e.rm, K(e.fy), vr ? K(vr.fy) : null, vr ? K(e.fy - vr.fy) : null]); }
  const expAllow = new Set(scopeReps());
  for (const x of [...S.fcs.values()].filter(x => x.overall && expAllow.has(x.rep))) aoa3.push([x.rep, "", "【整体说明】", x.overall, null, null, null]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa3), "备注清单");
  XLSX.writeFile(wb, "预估看板_" + S.cfg.cycleLabel + ".xlsx");
}

async function onXlsxFile(file) {
  if (typeof XLSX === "undefined") {
    openModal("无法读取 Excel", "<p>SheetJS 解析库未能加载(当前网络可能无法访问 cdnjs.cloudflare.com)。请换有外网的环境打开本工具,或让 IT 把 xlsx.full.min.js 内联进本文件。</p>", '<button class="btn pri" onclick="closeModal()">知道了</button>');
    return;
  }
  toast("正在解析 " + file.name + " …");
  try {
    const wb = XLSX.read(new Uint8Array(await file.arrayBuffer()), { type: "array" });
    let best = null, bestScore = -1;
    for (const n of wb.SheetNames) {
      const ws = wb.Sheets[n]; if (!ws || !ws["!ref"]) continue;
      const r = XLSX.utils.decode_range(ws["!ref"]);
      const score = (r.e.r - r.s.r) + (/detail/i.test(n) ? 1e9 : 0);
      if (score > bestScore) { bestScore = score; best = n; }
    }
    if (!best) { toast("⚠ 文件里没有可用的工作表"); return; }
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[best], { defval: null });
    if (!rows.length) { toast("⚠ 工作表「" + best + "」是空的"); return; }
    const C = detectCols(Object.keys(rows[0]));
    if (C.err) { openModal("列识别失败", "<p>" + esc(C.err) + '</p><p style="color:var(--mute);font-size:12px;word-break:break-all">检测到的表头: ' + esc(Object.keys(rows[0]).join(" | ")) + "</p>", '<button class="btn pri" onclick="closeModal()">关闭</button>'); return; }
    const agg = aggregateRows(rows, C);
    if (!agg.rows.length) { toast("⚠ 没有解析到任何有效数据行"); return; }
    S.pendingImport = { fileName: file.name, sheet: best, C, agg };
    openImportPreview();
  } catch (err) { console.error(err); openModal("解析失败", "<p>" + esc(err && err.message || String(err)) + "</p>", '<button class="btn pri" onclick="closeModal()">关闭</button>'); }
}

async function buildSnapshot(label) {
  if (!S.master || !S.cfg) { toast("还没有数据,无法保存版本"); return null; }
  const rows = {};
  for (const e of buildEntries()) rows[e.key] = { rep: e.rep, prov: e.prov, grp: e.grp, rsm: e.rsm, dsm: e.dsm, fy: e.fy, fyq: e.fyq, aop: e.aop, ly: e.ly, rm: e.rm || "", m: e.m.map(c => c.act ? null : c.a) };
  const id = uid();
  const ver = { id, label, savedAt: Date.now(), cycleLabel: S.cfg.cycleLabel, actMonths: S.cfg.actMonths, rows };
  if (!await Store.set("fc-v-" + id, ver)) { toast("⚠ 版本保存失败"); return null; }
  S.cfg.versions = (S.cfg.versions || []).concat([{ id, label, savedAt: ver.savedAt }]);
  await Store.set("fc-cfg", S.cfg);
  S.verCache.set(id, ver);
  return id;
}

async function importRepFiles(files) {
  let ok = 0, skip = 0, bad = 0;
  for (const f of files) {
    try {
      const d = JSON.parse(await f.text());
      const doc = d && d.kind === "fc-rep" && d.doc;
      if (!doc || !doc.rep) { bad++; continue; }
      const old = S.fcs.get(doc.rep);
      if (old && (old.updatedAt || 0) >= (doc.updatedAt || 0)) { skip++; continue; }
      S.fcs.set(doc.rep, doc); await Store.set("fc-f-" + doc.rep, doc); ok++;
    } catch (e) { bad++; }
  }
  rerender();
  toast("合并完成: 更新 " + ok + " 人" + (skip ? " · 跳过 " + skip + "(本机更新)" : "") + (bad ? " · 失败 " + bad : ""));
}

/* 表格列宽拖拽 */
function initResizableTable(table) {
  if (!table) return;
  const ths = table.querySelectorAll("thead th");
  ths.forEach((th, idx) => {
    if (th.querySelector(".resize-handle")) return;
    const handle = document.createElement("div");
    handle.className = "resize-handle";
    th.appendChild(handle);
    let startX, startWidth, colIdx = idx;
    handle.addEventListener("mousedown", e => {
      e.preventDefault();
      handle.classList.add("dragging");
      startX = e.pageX;
      startWidth = th.offsetWidth;
      const onMove = ev => {
        const newWidth = startWidth + (ev.pageX - startX);
        const w = Math.max(50, newWidth) + "px";
        th.style.width = w;
        th.style.minWidth = w;
        // 同步调整该列所有单元格
        const rows = table.querySelectorAll("tbody tr, tfoot tr");
        rows.forEach(row => {
          const cell = row.children[colIdx];
          if (cell) { cell.style.width = w; cell.style.minWidth = w; }
        });
      };
      const onUp = () => {
        handle.classList.remove("dragging");
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
      };
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
  });
}

function cloudMode() { return !!CLOUD_URL; }
async function cloudFetch(silent) {
  if (!cloudMode()) return null;
  // 自动生成 CDN 回退 URL：把 raw.githubusercontent.com 替换为 jsdelivr CDN
  const urls = [CLOUD_URL];
  if (CLOUD_URL.includes("raw.githubusercontent.com")) {
    // jsDelivr: https://cdn.jsdelivr.net/gh/用户名/仓库名@分支/路径
    const m = CLOUD_URL.match(/raw\.githubusercontent\.com\/([^/]+)\/([^/]+)\/([^/]+)\/(.+)/);
    if (m) urls.push("https://cdn.jsdelivr.net/gh/" + m[1] + "/" + m[2] + "@" + m[3] + "/" + m[4]);
  }
  let lastErr = "";
  for (const url of urls) {
    try {
      const resp = await fetch(url, { cache: "no-store" });
          if (resp.ok) {
        const d = await resp.json();
        if (!d || d.kind !== "fc-package") throw new Error("JSON 格式不符 (kind != fc-package)");
        if (!d.master) throw new Error("JSON 缺少 master 字段");
        if (url !== CLOUD_URL) console.log("cloudFetch: 通过 CDN 拉取成功");
        return d;
      }
      lastErr = "HTTP " + resp.status + (resp.status === 404 ? " (文件不存在)" : resp.status === 403 ? " (仓库需设为公开 Public)" : "");
    } catch (e) {
      lastErr = (e.message || e);
    }
  }  // end URL loop
  if (!silent) {
    toast("☁ 拉取失败: " + lastErr + " — raw.githubusercontent.com 国内被墙,已尝试 CDN 回退");
    console.error("cloudFetch failed:", lastErr);
  }
  return null;
}
async function cloudPull(force) {
  if (!cloudMode()) { toast("⚠ CLOUD_URL 为空,请在代码中配置数据包 Raw URL"); return false; }
  const localMeta = await Store.get("fc-master");
  // 仅当本地无数据（首次打开）时自动拉取；force=true 可强制拉取
  if (!force && localMeta) return false;
  const d = await cloudFetch(!force);  // 手动同步(silent=false)显示详细错误
  if (!d) return false;
  try {
    await Store.set("fc-cfg", d.cfg);
    await Store.set("fc-master", d.master);
    for (const f of (d.forecasts || [])) if (f && f.rep) await Store.set("fc-f-" + f.rep, f);
    for (const v of (d.versions || [])) if (v && v.id) await Store.set("fc-v-" + v.id, v);
  } catch (e) {
    toast("⚠ 数据写入失败,可能超出浏览器存储上限: " + (e.message || e));
    return false;
  }
  await loadAll(); validateMe(); applyMe();
  const label = (d.cfg && d.cfg.cycleLabel) || "云端数据";
  toast("✅ 已同步云端数据: " + label + " (" + new Date(d.exportedAt).toLocaleString("zh-CN") + ")");
  return true;
}
async function init() {
  await Store.init();
  // 云端模式：自动拉取管理员发布的数据包
  if (cloudMode()) {
    const localCfg = await Store.get("fc-cfg");
    if (!localCfg) await cloudPull(false);
  }
  /* 初始化水印 */
  const wm = $("#watermark");
  if (wm) {
    const text = "Designed by Kong, 仅波士顿科学内部使用";
    const w = window.innerWidth, h = window.innerHeight;
    const stepX = 280, stepY = 200;
    let s = "";
    for (let y = -100; y < h + 100; y += stepY) {
      for (let x = -100; x < w + 100; x += stepX) {
        s += '<span style="left:' + x + 'px;top:' + y + 'px">' + text + '</span>';
      }
    }
    wm.innerHTML = s;
  }
  const b = $("#sync-badge");
  if (Store.shared) { b.textContent = "🟢 共享模式"; b.title = "所有人打开同一发布链接,实时共用一份数据"; b.style.background = "#E7F6EC"; b.style.color = "#1E7B3C"; b.style.borderColor = "#BFE5CC"; }
  else if (cloudMode()) { b.textContent = "☁ 云端模式"; b.title = "管理员上传数据包后,其他人打开网页自动拉取最新数据"; b.style.background = "#EDF3FF"; b.style.color = "#2458E6"; b.style.borderColor = "#B9CDF5"; }
  else { b.textContent = "💾 本地模式"; b.title = "数据仅保存在本浏览器;请用管理后台的数据包导出/导入接力"; }
  await loadAll();
  if (Store.shared) { S.me = await Store.pget("fc-me"); validateMe(); }
  if (S.me && S.me.role === "rep") S.curRep = S.me.name;
  $$(".tabs .tab").forEach(btn => btn.onclick = () => switchTab(btn.dataset.tab));
  $("#btn-me").onclick = () => renderGate();
  $("#btn-cloud").onclick = async () => { toast("正在从 GitHub 拉取 …"); const ok = await cloudPull(true); if (!ok) toast("⚠ 拉取失败,请检查 CLOUD_URL 和网络"); else rerender(); renderCtx(); };
  if (cloudMode()) { const bc = $("#btn-cloud"); if (bc) bc.style.display = ""; }
  $("#btn-refresh").onclick = async () => { toast("正在刷新 …"); await loadAll(); validateMe(); applyMe(); rerender(); if (!S.me) renderGate(); else toast("已读取最新数据"); };
  $("#mask").addEventListener("click", e => { if (S.gateOpen) return; if (e.target === $("#mask")) closeModal(); });
  $("#file-xlsx").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) onXlsxFile(f); });
  $("#file-pkg").addEventListener("change", e => { const f = e.target.files[0]; e.target.value = ""; if (f) importPackage(f); });
  $("#file-reps").addEventListener("change", e => { const fs = [...e.target.files]; e.target.value = ""; if (fs.length) importRepFiles(fs); });
  applyMe();
  rerender();
  if (!S.me) renderGate();
}
init();
</script>
